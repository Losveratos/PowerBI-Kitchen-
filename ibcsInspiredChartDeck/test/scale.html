<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 1.52 geometry checks: IBCS 2.0 / ISO 24896 scaling of the templates C03–C13.
     Measures px per unit of base and variance elements straight from the SVG and
     prints one "measure ·" line per finding; checks print "ok ·" / "FAIL ·".
     Run: node test/build.js && node test/scale.js -->
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #f2f2f2; margin: 20px; }
  .case { background: #fff; border: 1px solid #ddd; margin-bottom: 24px; padding: 8px; }
  .case h4 { margin: 0 0 6px 0; font-size: 12px; color: #666; }
  .stage { position: relative; }
</style>
</head>
<body>
<script src="visual.bundle.js"></script>
<script>
const Visual = ChartKitchen.Visual;
const AC_C = "#404040", PY_C = "#B3B3B3", GOOD = "#1E8F9E", BAD = "#D64541";

function makeHost() {
  return {
    hostCapabilities: { allowInteractions: true },
    colorPalette: { isHighContrast: false },
    eventService: { renderingStarted(){}, renderingFinished(){}, renderingFailed(o, e){ console.error("renderfail", e); } },
    createSelectionManager: () => ({ select: () => Promise.resolve([]), clear: () => Promise.resolve(), getSelectionIds: () => [], showContextMenu(){} }),
    createSelectionIdBuilder: () => ({ withCategory(){ return this; }, createSelectionId(){ return { equals: () => false }; } }),
    tooltipService: { show(){}, move(){}, hide(){} },
    createLocalizationManager: () => ({ getDisplayName: () => "" }),
    persistProperties: () => {}, drill: () => {}, launchUrl: () => {},
    locale: "de-DE"
  };
}
function col(role, values, format, name) {
  return { source: { displayName: name ?? (role === "actual" ? "Nettoumsatz in EUR" : role), roles: { [role]: true }, isMeasure: true, format }, values };
}
function dataView(cats, cols, objects, multValues, rowTypes) {
  const categories = [{ source: { displayName: "Monat", roles: { category: true } }, values: cats }];
  if (multValues) { categories.push({ source: { displayName: "Region", roles: { multiples: true } }, values: multValues }); }
  if (rowTypes) { categories.push({ source: { displayName: "Typ", roles: { rowType: true } }, values: rowTypes }); }
  return { metadata: { columns: [], objects: objects || {} }, categorical: { categories, values: cols } };
}
function stage(id, title, w, h) {
  const c = document.createElement("div"); c.className = "case";
  c.innerHTML = `<h4>${id} · ${title}</h4><div class="stage" id="${id}" style="width:${w}px;height:${h}px"></div>`;
  document.body.appendChild(c);
}
function run(id, title, dv, w, h) {
  stage(id, title, w, h);
  const v = new Visual({ element: document.getElementById(id), host: makeHost() });
  v.update({ viewport: { width: w, height: h }, dataViews: [dv], viewMode: 0 });
}
function check(cond, msg) { if (cond) { console.log("ok · " + msg); } else { console.error("FAIL · " + msg); } }
function measure(msg) { console.log("measure · " + msg); }
const fill = el => (el.getAttribute("fill") || "").toUpperCase();
const num = (el, a) => parseFloat(el.getAttribute(a));
const med = a => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : NaN; };
const r2 = v => Math.round(v * 100) / 100;

/** base vs Δ px per unit for column/bar charts: AC rect and the variance rect after it,
 *  per category group (first n groups = first tile). vertical: heights, else widths */
function tierRatio(id, acVals, dVals, vertical, opts = {}) {
  const groups = [...document.querySelectorAll(`#${id} g.icd-cat`)].slice(0, acVals.length);
  const kMain = [], kD = [], acW = [], dW = [], pos = [];
  groups.forEach((g, i) => {
    const rects = [...g.querySelectorAll(":scope > rect")];
    const ai = rects.findIndex(r => fill(r) === AC_C);
    if (!opts.line && ai >= 0 && acVals[i]) {
      const r = rects[ai];
      kMain.push((vertical ? num(r, "height") : num(r, "width")) / Math.abs(acVals[i]));
      acW.push(vertical ? num(r, "width") : num(r, "height"));
      pos.push(vertical ? num(r, "x") : num(r, "y"));
    }
    const dr = rects.slice(ai + 1).find(r => [GOOD, BAD, PY_C].includes(fill(r)));
    if (dr && dVals[i] && Math.abs(dVals[i]) >= opts.minD) {
      kD.push({ k: (vertical ? num(dr, "height") : num(dr, "width")) / Math.abs(dVals[i]), d: Math.abs(dVals[i]) });
      dW.push(vertical ? num(dr, "width") : num(dr, "height"));
      if (opts.line) { pos.push(num(dr, "x")); }
    }
  });
  if (opts.line) {
    // line mode: AC px/unit from the marker circles (largest vs smallest value)
    const circ = groups.map(g => g.querySelector("circle")).filter(Boolean);
    let iMin = 0, iMax = 0;
    acVals.forEach((v, i) => { if (v < acVals[iMin]) iMin = i; if (v > acVals[iMax]) iMax = i; });
    kMain.push(Math.abs(num(circ[iMin], "cy") - num(circ[iMax], "cy")) / (acVals[iMax] - acVals[iMin]));
  }
  const big = kD.sort((a, b) => b.d - a.d)[0];
  const step = pos.length > 1 ? Math.abs(pos[1] - pos[0]) : NaN;
  return { kMain: med(kMain), kD: big ? big.k : NaN, ratio: big ? big.k / med(kMain) : NaN,
    acW: med(acW) / step, dW: med(dW) / step };
}

const M = 1e6;
const mon8 = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug"];
const ac8 = [3.62, 3.75, 3.98, 4.05, 4.12, 4.21, 4.30, 4.18].map(v => v * M);
const py8 = [3.50, 3.66, 3.80, 3.95, 3.90, 4.05, 3.978, 4.02].map(v => v * M);
const pl8 = [3.70, 3.70, 3.90, 4.10, 4.00, 4.30, 4.20, 4.25].map(v => v * M);
const dPy8 = ac8.map((v, i) => v - py8[i]), dPl8 = ac8.map((v, i) => v - pl8[i]);
const FMT = "#,0";
const scaleOf = (id) => document.querySelector(`#${id} [data-icd="scale-zoom"]`);

// ---- C03 · Säulen mit ΔPY
run("C03", "Säulen + ΔPY + ΔPY% (Basis PY)", dataView(mon8, [col("actual", ac8, FMT), col("previousYear", py8, FMT)],
  { chart: { orientation: "columns", comparisonMode: "py", showAbsoluteVariance: true, showRelativeVariance: true } }), 900, 460);
{
  const m = tierRatio("C03", ac8, dPy8, true, { minD: 0.05 * M });
  const z = scaleOf("C03");
  measure(`C03 Säulen ΔPY: AC ${r2(m.kMain * M)} px/M, ΔPY ${r2(m.kD * M)} px/M → Faktor ${r2(m.ratio)} · Lupe ${z ? z.getAttribute("data-factor") : "keine"} · Breite AC ${r2(m.acW)}, Δ ${r2(m.dW)} je Kategorie`);
  const f = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  check(Math.abs(m.ratio / f - 1) < 0.03, "C03: Δ-Panel im Maßstab der Basis (bzw. ausgewiesener Lupenfaktor)");
  check(Math.abs(m.acW - m.dW) < 0.01, "C03: Δ-Säulen so breit wie die AC-Säulen");
}

// ---- C08 · Linie mit ΔPL
run("C08", "Linie + ΔPL (Basis PL)", dataView(mon8, [col("actual", ac8, FMT), col("plan", pl8, FMT)],
  { chart: { orientation: "line", comparisonMode: "auto", showAbsoluteVariance: true, showRelativeVariance: false } }), 900, 420);
{
  const m = tierRatio("C08", ac8, dPl8, true, { minD: 0.05 * M, line: true });
  const z = scaleOf("C08");
  const step = 1;
  measure(`C08 Linie ΔPL: AC ${r2(m.kMain * M)} px/M, ΔPL ${r2(m.kD * M)} px/M → Faktor ${r2(m.ratio)} · Lupe ${z ? z.getAttribute("data-factor") : "keine"} · Δ-Breite ${r2(m.dW)} je Kategorie`);
  const f = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  check(Math.abs(m.ratio / f - 1) < 0.03, "C08: Δ-Panel im Maßstab der Linie (bzw. ausgewiesener Lupenfaktor)");
  check(Math.abs(m.dW - 2 / 3) < 0.01, "C08: Δ-Säulen 2/3 der Kategorienbreite");
}

// ---- C04 · Balken mit ΔPL
const prod = ["Pils", "Lager", "Dunkel", "Weizen", "Bock", "Radler", "Alkoholfrei", "Spezial"];
const acP = [2.45, 1.82, 1.31, 1.12, 0.64, 0.52, 0.41, 0.23].map(v => v * M);
const plP = [2.30, 1.90, 1.29, 1.05, 0.70, 0.48, 0.45, 0.20].map(v => v * M);
const dP = acP.map((v, i) => v - plP[i]);
run("C04", "Balken + ΔPL + ΔPL% (Basis PL)", dataView(prod, [col("actual", acP, FMT), col("plan", plP, FMT)],
  { chart: { orientation: "bars", comparisonMode: "plan", showAbsoluteVariance: true, showRelativeVariance: true } }), 900, 420);
{
  const m = tierRatio("C04", acP, dP, false, { minD: 0.03 * M });
  const z = scaleOf("C04");
  measure(`C04 Balken ΔPL: AC ${r2(m.kMain * M)} px/M, ΔPL ${r2(m.kD * M)} px/M → Faktor ${r2(m.ratio)} · Lupe ${z ? z.getAttribute("data-factor") : "keine"} · Breite AC ${r2(m.acW)}, Δ ${r2(m.dW)}`);
  const f = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  check(Math.abs(m.ratio / f - 1) < 0.03, "C04: Δ-Panel im Maßstab der Balken (bzw. ausgewiesener Lupenfaktor)");
  const labels = [...document.querySelectorAll("#C04 text")].map(t => t.textContent.trim()).filter(t => /^[+−-]/.test(t));
  const signedZero = labels.filter(t => !/[1-9]/.test(t));
  const tooLong = labels.filter(t => (t.replace(/[^0-9]/g, "").length > 3));
  measure(`C04 Δ-Beschriftungen: ${labels.join(" ")}`);
  check(signedZero.length === 0, "C04: keine signierte Null " + JSON.stringify(signedZero));
  check(tooLong.length === 0, "C04: höchstens 3 Ziffern je Zahl " + JSON.stringify(tooLong));
}

// ---- C13 · Small Multiples (Säulen ΔPY, 4 Regionen + Σ)
{
  const regions = ["Nord", "Süd", "West", "Ost"], f = [1, 0.7, 0.45, 0.25];
  const cats = [], mult = [], a = [], p = [];
  regions.forEach((r, ri) => mon8.forEach((m, mi) => { cats.push(m); mult.push(r); a.push(ac8[mi] * f[ri]); p.push(py8[mi] * f[ri]); }));
  run("C13", "Small Multiples · Säulen + ΔPY · Σ-Kachel · gleiche Skala", dataView(cats, [col("actual", a, FMT), col("previousYear", p, FMT)],
    { chart: { orientation: "columns", comparisonMode: "py", showAbsoluteVariance: true, showRelativeVariance: true, multiplesTotal: true, multiplesSameScale: true } }, mult), 1100, 640);
  // first tile = Σ (total) — measure the first non-total tile: groups after the Σ tile
  const all = [...document.querySelectorAll("#C13 g.icd-cat")];
  const firstNord = all.length >= 16 ? 8 : 0;
  const acN = ac8, dN = dPy8;
  const groups = all.slice(firstNord, firstNord + 8);
  const kM = [], kD = [];
  groups.forEach((g, i) => {
    const rects = [...g.querySelectorAll(":scope > rect")];
    const ai = rects.findIndex(r => fill(r) === AC_C);
    if (ai >= 0) { kM.push(num(rects[ai], "height") / acN[i]); }
    const dr = rects.slice(ai + 1).find(r => [GOOD, BAD, PY_C].includes(fill(r)));
    if (dr && dN[i] > 0.15 * M) { kD.push(num(dr, "height") / dN[i]); }
  });
  const z = scaleOf("C13");
  const ratio = med(kD) / med(kM);
  measure(`C13 Small Multiples ΔPY: AC ${r2(med(kM) * M)} px/M, ΔPY ${r2(med(kD) * M)} px/M → Faktor ${r2(ratio)} · Lupe ${z ? z.getAttribute("data-factor") : "keine"}`);
  const fz = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  check(Math.abs(ratio / fz - 1) < 0.05, "C13: Δ-Panels im Maßstab der Basis (bzw. ausgewiesener Lupenfaktor)");
  // a zoom is never silent: "×f" in the Δ title + a scale band in base AND Δ panel
  if (z) {
    const titles = [...document.querySelectorAll("#C13 svg text")].map(t => t.textContent);
    const bands = [...z.querySelectorAll("rect")];
    check(titles.some(t => t === `ΔPY ×${fz}`) && bands.length >= 2, "C13: Lupe mit „ΔPY ×f“ und Skalenband in Basis und Δ-Panel");
    const hB = bands.map(b => num(b, "height"));
    check(Math.abs(hB[1] / hB[0] / fz - 1) < 0.05, "C13: Skalenband im Δ-Panel genau f-mal so hoch wie in der Basis");
  }
}

// ---- C05 · Integrierte Brücke (Basis PY)
run("C05", "Integrierte Brücke PY → AC", dataView(mon8, [col("actual", ac8, FMT), col("previousYear", py8, FMT)],
  { chart: { orientation: "intwaterfall", comparisonMode: "py", showAbsoluteVariance: true, showRelativeVariance: true } }), 1100, 560);
{
  const svg = document.querySelector("#C05 svg");
  const groups = [...svg.querySelectorAll("g.icd-cat")];
  const jul = groups[6];
  const acR = [...jul.querySelectorAll("rect")].find(r => fill(r) === AC_C);
  const brick = [...jul.querySelectorAll("rect")].find(r => [GOOD, BAD].includes(fill(r)));
  const pyTot = py8.reduce((a, b) => a + b, 0);
  const anchors = [...svg.querySelectorAll(":scope > g > rect")].filter(r => fill(r) === PY_C && !r.closest("g.icd-cat"));
  const anchor = anchors.sort((a, b) => num(b, "height") - num(a, "height"))[0];
  const kA = num(anchor, "height") / pyTot, kMon = num(acR, "height") / ac8[6];
  const z = scaleOf("C05");
  const acAug = [...groups[7].querySelectorAll("rect")].find(r => fill(r) === AC_C);
  const step = num(acAug, "x") - num(acR, "x");
  const pairW = (num(acR, "x") + num(acR, "width")) - Math.min(...[...jul.querySelectorAll("rect")].filter(r => fill(r) === PY_C).map(r => num(r, "x")));
  measure(`C05 Integrierte Brücke: Anker ${r2(kA * M)} px/M, Monatssäule Jul ${r2(num(acR, "height"))} px = ${r2(kMon * M)} px/M → Faktor ${r2(kMon / kA)} · Kennzeichnung ${z ? z.getAttribute("data-factor") : "keine"} · Breiten Stein ${r2(num(brick, "width") / step)}, Anker ${r2(num(anchor, "width") / step)}, Monatspaar ${r2(pairW / step)} je Kategorie`);
  const fz = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  check(Math.abs(kMon / kA / fz - 1) < 0.03, "C05: Monatssäulen auf der Ankerskala (bzw. ausgewiesener Faktor)");
  check(Math.abs(num(brick, "width") - num(anchor, "width")) < 0.6 && Math.abs(pairW - num(brick, "width")) < 0.6,
    "C05: Anker, Brückensteine und Monatspaar gleich breit");
}

// ---- C12 · Varianzbrücke: Anker nach Basis
const wfCats = ["Pils", "Lager", "Dunkel", "Weizen", "Bock"];
const wfAc = [2.45, 1.82, 1.31, 1.12, 0.64].map(v => v * M);
const wfPy = [2.30, 1.95, 1.20, 1.05, 0.70].map(v => v * M);
[["C12py", "py", "previousYear"], ["C12pl", "plan", "plan"]].forEach(([id, mode, role]) => {
  run(id, `Varianzbrücke · Basis ${mode}`, dataView(wfCats, [col("actual", wfAc, FMT), col(role, wfPy, FMT)],
    { chart: { orientation: "waterfall", comparisonMode: mode, showAbsoluteVariance: true, showRelativeVariance: true } }), 900, 400);
  const first = document.querySelector(`#${id} g.icd-cat rect`);
  const f = fill(first), s = (first.getAttribute("stroke") || "").toUpperCase();
  measure(`${id} Basis-Anker: fill ${f}, stroke ${s || "–"}`);
  if (mode === "py") { check(f === PY_C, `${id}: PY-Anker hellgrau gefüllt`); }
  else { check(f === "#FFFFFF" && s === AC_C, `${id}: PL-Anker als Umriss`); }
});

// ---- C09 · Scatter: Achsen ohne Null → Bruchmarke, x nicht negativ bei Werten ≥ 0
{
  const units = ["A", "B", "C", "D", "E", "F", "G"];
  const y = [3.1, 4.2, 3.6, 5.0, 4.4, 3.9, 4.8].map(v => v * M);
  const x = [22, 35, 28, 61, 47, 30, 55];
  run("C09", "Scatter · alle Werte positiv, Bereiche ohne Null", dataView(units, [col("actual", y, FMT), col("xValue", x, "0", "Marge")],
    { chart: { orientation: "scatter", scatterQuadrant: "mean", scatterColorBy: "single" } }), 900, 460);
  const brX = document.querySelector('#C09 [data-icd="axis-break-x"]'), brY = document.querySelector('#C09 [data-icd="axis-break-y"]');
  const ticks = [...document.querySelectorAll('#C09 [data-icd="scatter-xtick"]')].map(t => t.textContent);
  measure(`C09 Scatter: Bruchmarke x ${brX ? "ja" : "nein"}, y ${brY ? "ja" : "nein"} · x-Ticks ${ticks.join(" ")}`);
  check(!ticks.some(t => /^[−-]/.test(t.trim())), "C09: x-Achse beginnt nicht negativ");
  check(!!brX && !!brY, "C09: Bruchmarke an beiden Achsen ohne Null");
}
{
  // values close to zero: the range reaches 0 → no break, and still no negative tick
  const units = ["A", "B", "C", "D", "E"];
  run("C09b", "Scatter · x ab 1,5 (Bereich enthält die Null)", dataView(units,
    [col("actual", [0.4, 2.2, 3.1, 4.0, 5.2].map(v => v * M), FMT), col("xValue", [1.5, 8, 20, 35, 60], "0", "Marge")],
    { chart: { orientation: "scatter", scatterQuadrant: "off", scatterColorBy: "single" } }), 700, 380);
  const ticks = [...document.querySelectorAll('#C09b [data-icd="scatter-xtick"]')].map(t => t.textContent);
  measure(`C09b Scatter nahe Null: x-Ticks ${ticks.join(" ")} · Bruchmarke x ${document.querySelector('#C09b [data-icd="axis-break-x"]') ? "ja" : "nein"}`);
  check(!ticks.some(t => /^[−-]/.test(t.trim())), "C09b: kein negativer x-Tick bei Werten ≥ 0");
  check(!document.querySelector('#C09b [data-icd="axis-break-x"]'), "C09b: keine x-Bruchmarke, die Null liegt im Bereich");
}

// ---- Doppel-Varianz: ΔPY und ΔPL beide im Basismaßstab
run("DUAL", "Doppel-Varianz ΔPL + ΔPY", dataView(mon8, [col("actual", ac8, FMT), col("previousYear", py8, FMT), col("plan", pl8, FMT)],
  { chart: { orientation: "columns", dualVariance: true, showAbsoluteVariance: true, showRelativeVariance: true } }), 900, 620);
{
  const groups = [...document.querySelectorAll("#DUAL g.icd-cat")];
  const jul = [...groups[6].querySelectorAll(":scope > rect")];
  const ai = jul.findIndex(r => fill(r) === AC_C);
  const kM = num(jul[ai], "height") / ac8[6];
  const ds = jul.slice(ai + 1).filter(r => [GOOD, BAD, PY_C].includes(fill(r)));
  const kPl = num(ds[0], "height") / Math.abs(dPl8[6]), kPy = num(ds[1], "height") / Math.abs(dPy8[6]);
  const z = scaleOf("DUAL"), f = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  measure(`DUAL: AC ${r2(kM * M)} px/M, ΔPL ${r2(kPl * M)}, ΔPY ${r2(kPy * M)} px/M · Lupe ${z ? f : "keine"}`);
  check(Math.abs(kPl / kPy - 1) < 0.03 && Math.abs(kPl / kM / f - 1) < 0.03, "DUAL: beide Δ-Panels gleiche Skala wie die Basis");
}

// ---- GuV-Wasserfall (rowType) mit ΔPY-Tier: Tier im Wasserfall-Maßstab
{
  const cats = ["Umsatz", "Material", "Personal", "Rohertrag", "Vertrieb", "EBIT"];
  const types = ["sum", "delta", "delta", "sum", "delta", "sum"];
  const a = [9.8, -4.2, -2.4, 3.2, -0.9, 2.3].map(v => v * M), py = [9.1, -3.9, -2.3, 2.9, -0.8, 2.1].map(v => v * M);
  run("WF", "GuV-Wasserfall + ΔPY-Tier", dataView(cats, [col("actual", a, FMT), col("previousYear", py, FMT)],
    { chart: { orientation: "waterfall", showAbsoluteVariance: true, showRelativeVariance: true } }, null, types), 900, 520);
  const groups = [...document.querySelectorAll("#WF g.icd-cat")];
  const anchor = groups[0].querySelector("rect");
  const kM = num(anchor, "height") / a[0];
  // tier bars live outside the icd-cat groups: the tallest good/bad rect above the waterfall
  const tierRects = [...document.querySelectorAll("#WF svg > g > rect")].filter(r => [GOOD, BAD].includes(fill(r)));
  const umsatzD = tierRects[0];
  const kD = num(umsatzD, "height") / Math.abs(a[0] - py[0]);
  const z = scaleOf("WF"), f = z ? parseFloat(z.getAttribute("data-factor")) : 1;
  measure(`WF GuV: Anker ${r2(kM * M)} px/M, ΔPY-Tier ${r2(kD * M)} px/M → Faktor ${r2(kD / kM)} · Lupe ${z ? f : "keine"}`);
  check(Math.abs(kD / kM / f - 1) < 0.04, "WF: ΔPY-Tier im Wasserfall-Maßstab (bzw. ausgewiesener Lupenfaktor)");
}

// ---- Σ-Zeile + Titel (C03)
{
  const txt = [...document.querySelectorAll("#C03 svg text")].map(t => t.textContent);
  const sum = txt.find(t => t.startsWith("Σ")) || "";
  const title = txt.find(t => t.startsWith("Nettoumsatz")) || "";
  measure(`C03 Σ-Zeile: „${sum}“ · Titel: „${title}“`);
  const nums = (sum.match(/[+−-]?\d[\d.,]*/g) || []).map(n => n.replace(/[^0-9]/g, ""));
  check(nums.every(n => n.length <= 3), "C03: Σ-Zeile höchstens 3 Ziffern je Zahl");
  check(/^Nettoumsatz in Mio\. EUR/.test(title), "C03: Titel „Nettoumsatz in Mio. EUR“ statt doppeltem „in“");
}

// ---- KPI-Karten: ein Δ-Format für alle Karten derselben Einheit
{
  const cats = ["Umsatz Nord", "Umsatz Süd", "Umsatz West"];
  const a = [15.4, 6.2, 3.0].map(v => v * M), py = [16.4, 6.338, 2.9].map(v => v * M);
  run("CARDS", "KPI-Karten · gleiche Einheit", dataView(cats, [col("actual", a, FMT), col("previousYear", py, FMT)],
    { chart: { orientation: "cards" } }), 960, 220);
  const ds = [...document.querySelectorAll("#CARDS text")].map(t => t.textContent.trim())
    .filter(t => /^[+−-]\d/.test(t) && /M/.test(t)).map(t => t.split(" ")[0]);
  const dec = ds.map(t => (t.split(",")[1] || "").replace(/[^0-9]/g, "").length);
  measure(`CARDS Δ-Werte: ${ds.join(" ")}`);
  check(ds.length >= 3 && dec.every(d => d === dec[0]), "CARDS: gleiche Nachkommastellen auf allen Karten");
}
</script>
