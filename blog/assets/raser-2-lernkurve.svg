31a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="904.0" y="519.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c3c2b7" font-weight="600" text-anchor="start" >Bestand: −5 %</text><text x="904.0" y="545.7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#898781" font-weight="400" text-anchor="start" >27 Anlagen</text><text x="904.0" y="867.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#f0b54a" font-weight="700" text-anchor="start" >B 55a: −71 %</text><text x="132.0" y="345.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="700" text-anchor="start" >443 Fälle pro Tag</text><text x="748.2" y="906.4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle" >127 pro Tag</text><text x="60.0" y="1110.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Anlagen im Bestand bleiben im selben Zeitraum fast gleich: Die Jahreszeit erklärt den Rückgang nicht.</text><text x="60.0" y="1142.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Auch schwere Fälle werden seltener: Anteil mit 21 km/h und mehr zu viel 13,0 % → 5,9 %.</text><text x="60.0" y="1174.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#898781" font-weight="400" text-anchor="start" >Nicht jede neue Anlage wirkt so stark. Verkehrsmengen liegen nicht vor.</text><text x="60.0" y="1310.0" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#898781" font-weight="400" text-anchor="start" >Daten: Stadt Köln, Offene Daten (dl-de/zero-2-0) · Auswertung: Daten-WG · datenwgknowledgekitchen.com</text></svg>