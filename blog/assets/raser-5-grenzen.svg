<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0b0c0e"/><text x="60.0" y="92.0" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#f0b54a" font-weight="600" text-anchor="start" letter-spacing="3">KÖLNER RASER-ATLAS 2025 · EHRLICH GESAGT</text><text x="60.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" fill="#ffffff" font-weight="750" text-anchor="start" >Was die Daten</text><text x="60.0" y="240.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" fill="#ffffff" font-weight="750" text-anchor="start" >nicht zeigen.</text><rect x="60" y="318" width="6" height="58" fill="#c2831a"/><text x="86.0" y="340.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Keine Verkehrsmengen</text><text x="86.0" y="374.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Die Daten zählen Geblitzte, nicht Autos. Eine „Raserquote“ lässt sich nicht berechnen.</text><rect x="60" y="428" width="6" height="58" fill="#c2831a"/><text x="86.0" y="450.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Keine Unfälle</text><text x="86.0" y="484.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Ob Blitzer Unfälle verhindern, zeigen diese Daten nicht.</text><rect x="60" y="538" width="6" height="58" fill="#c2831a"/><text x="86.0" y="560.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Kennzeichen = Halter</text><text x="86.0" y="594.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Das Kürzel nennt den Zulassungsbezirk, nicht, wer am Steuer saß.</text><rect x="60" y="648" width="6" height="58" fill="#c2831a"/><text x="86.0" y="670.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start" >Nur die Stadt</text><text x="86.0" y="704.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Messungen der Polizei, etwa auf Autobahnen, sind nicht enthalten.</text><rect x="60" y="790" width="960" height="250" fill="#15171b" stroke="#2c2c2a"/><text x="90.0" y="842.0" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#f0b54a" font-weight="600" text-anchor="start" letter-spacing="2">Eine Frage an die Stadt</text><text x="90.0" y="892.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start" >Mobil wird zu 90 % tagsüber und zu 80 % werktags gemessen.</text><text x="90.0" y="932.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="600" text-anchor="start" >Die schweren Verstöße passieren aber vor allem nachts.</text><text x="90.0" y="986.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c3c2b7" font-weight="400" text-anchor="start" >Warum wird mobil nicht öfter nachts gemessen?</text><text x="60.0" y="1210.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#c3c2b7" font-weight="400" text-anchor="start" >Ganze Story mit Karte, Zeitraffer und Atlas aller 655 Messstellen:</text><text x="60.0" y="1246.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#f0b54a" font-weight="700" text-anchor="start" >datenwgknowledgekitchen.com/koelner-raser-story.html</text><text x="60.0" y="1310.0" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#898781" font-weight="400" text-anchor="start" >Daten: Stadt Köln, Offene Daten (dl-de/zero-2-0) · Auswertung: Daten-WG · datenwgknowledgekitchen.com</text></svg>