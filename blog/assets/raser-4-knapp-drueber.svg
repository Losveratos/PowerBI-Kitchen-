<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#0b0c0e"/><text x="60.0" y="92.0" font-family="JetBrains Mono, Consolas, monospace" font-size="20" fill="#f0b54a" font-weight="600" text-anchor="start" letter-spacing="3">KÖLNER RASER-ATLAS 2025 · WIE SCHNELL?</text><text x="60.0" y="250.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="190" fill="#f0b54a" font-weight="750" text-anchor="start" >97 %</text><text x="60.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start" >der 445.483 Fälle liegen höchstens 20 km/h über dem Limit,</text><text x="60.0" y="358.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="400" text-anchor="start" >also ohne Punkt in Flensburg.</text><text x="60.0" y="430.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Häufigster Wert: 6 km/h zu viel (20,5 % aller Fälle), darunter wird praktisch nicht geahndet.</text><text x="60.0" y="464.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >61,6 % der Fälle passieren bei Tempo 30. Verwarnungsgeld (bis 15 km/h): 90 %.</text><text x="60.0" y="498.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#c3c2b7" font-weight="400" text-anchor="start" >Katalogwert aller Fälle rund 18 Mio. €, im Schnitt 40 € pro Fall. Keine Einnahme.</text><text x="60.0" y="600.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#898781" font-weight="400" text-anchor="start" >Fälle je km/h zu viel (1 bis 40)</text><rect x="112.0" y="996.4" width="18.8" height="13.6" fill="#a3a19a"/><rect x="134.8" y="997.5" width="18.8" height="12.5" fill="#a3a19a"/><rect x="157.5" y="998.4" width="18.8" height="11.6" fill="#a3a