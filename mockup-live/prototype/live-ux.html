<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MockupKitchen live · UX-Prototyp</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* MockupKitchen live · klickbarer UX-Prototyp. Grundlage: mockup-live/UX-KONZEPT.md. Tokens aus mockup-kitchen.html. */
:root{
  --bg:#FAFAF7; --bg-card:#FFFFFF; --bg-soft:#F1F0EA; --ink:#0F1E2E; --ink-soft:#475569; --ink-mute:#66707F;
  --line:#E4E2DA; --line-strong:#B5B2A6; --accent:#C25A2D; --accent-soft:#F6E7DF;
  --accent-strong:#BD572B; --accent-strong-hover:#A94C25;
  --ok:#2E7D5B; --bad:#B8392F; --sel:#1F5FBF; --sel-soft:#E3ECFA;
  --warn:#B7791F; --warn-soft:#FFF7E6; --warn-line:#F3D9A4; --warn-ink:#7A4B00;
  --ok-soft:#E8F5EE; --ok-line:#BFE3CD; --ok-ink:#1E5A3A; --bad-soft:#FDECEA; --bad-line:#F0B8B2;
  --ff-sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --ff-mono:'Geist Mono',ui-monospace,Consolas,monospace;
  --r:8px; --sh:0 1px 2px rgba(15,30,46,.06),0 4px 14px rgba(15,30,46,.06);
  --sh-pop:0 14px 36px rgba(15,30,46,.18),0 2px 6px rgba(15,30,46,.08);
  --ease:cubic-bezier(.2,.7,.2,1); --ease-io:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ff-sans);color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
[hidden]{display:none!important}
.mono{font-family:var(--ff-mono);font-size:11px}
.mute{color:var(--ink-mute)}
.spacer{flex:1}
kbd{font-family:var(--ff-mono);font-size:10px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--bg);color:var(--ink-soft)}
body:not(.ws-mode) .ws{display:none!important}
body.ws-mode .mod{display:none!important}

/* ---------- Grundgerüst ---------- */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg-card);border-bottom:1px solid var(--line);min-height:52px;flex:none;z-index:30}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px}
.brand h1{font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.brand small{font-family:var(--ff-mono);font-size:10px;color:var(--ink-mute);letter-spacing:.04em;text-transform:uppercase}
.topbar input.name{border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:6px;font-weight:500;width:170px}
.topbar input.name:hover,.topbar input.name:focus{border-color:var(--line);background:var(--bg);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--bg-card);padding:6px 11px;border-radius:6px;font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--bg-soft)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#1c3047}
.btn.accent{background:var(--accent-strong);color:#fff;border-color:var(--accent-strong)}
.btn.accent:hover{background:var(--accent-strong-hover);border-color:var(--accent-strong-hover)}
.btn.accent kbd{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.btn.danger{color:var(--bad);border-color:var(--bad-line);background:var(--bg-card)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.full{width:100%;padding:10px 14px;font-size:14px;font-weight:600}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn[disabled]:hover{background:inherit}
.btn.primary[disabled]:hover{background:var(--ink)}
.ctl{border:1px solid var(--line-strong);background:var(--bg-card);border-radius:6px;padding:5px 8px;font-size:12.5px;width:100%}
textarea.ctl{resize:vertical;min-height:54px}

/* Deploy-Split-Knopf */
.dep-wrap{display:inline-flex;align-items:center;gap:6px}
.dep{display:inline-flex;align-items:stretch;border-radius:6px}
.dep-main{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--bg-card);padding:6px 12px;border-radius:6px 0 0 6px;font-weight:600;font-size:12.5px;min-width:132px;white-space:nowrap;transition:background .18s,color .18s,border-color .18s}
.dep-main>span{position:relative;z-index:1}
.dep-more{border:1px solid var(--line-strong);border-left-width:0;background:var(--bg-card);border-radius:0 6px 6px 0;padding:0 8px;font-size:10px;color:inherit}
.dep[data-s=connect] .dep-main{border-radius:6px;font-weight:500}
.dep[data-s=connect] .dep-more{display:none}
.dep[data-s=current] .dep-main{color:var(--ink-soft);font-weight:500}
.dep[data-s=changes] .dep-main,.dep[data-s=changes] .dep-more,.dep[data-s=restart] .dep-main,.dep[data-s=restart] .dep-more{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.dep[data-s=changes] .dep-more,.dep[data-s=restart] .dep-more{border-left:1px solid rgba(255,255,255,.35)}
.dep[data-s=changes] .dep-main:hover,.dep[data-s=restart] .dep-main:hover{background:var(--accent-strong-hover)}
.dep[data-s=running] .dep-main,.dep[data-s=running] .dep-more{border-color:var(--sel);color:var(--sel)}
.dep[data-s=applied] .dep-main,.dep[data-s=applied] .dep-more{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.dep[data-s=blocked] .dep-main,.dep[data-s=blocked] .dep-more{background:var(--warn-soft);border-color:#D69E2E;color:var(--warn-ink)}
.dep[data-s=error] .dep-main,.dep[data-s=error] .dep-more{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.dep-fill{position:absolute!important;inset:0;background:var(--sel-soft);transform-origin:left center;transform:scaleX(var(--p,0));transition:transform .25s linear;z-index:0!important}
.dep-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:500;background:var(--bg);cursor:pointer}
.dep-pill i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.roll{display:inline-block;height:1.25em;overflow:hidden;vertical-align:-.28em}
.roll-in{display:flex;flex-direction:column;animation:roll 240ms var(--ease) forwards}
.roll-in i{font-style:normal;height:1.25em;line-height:1.25em}
@keyframes roll{from{transform:translateY(0)}to{transform:translateY(-1.25em)}}
.leitung{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;z-index:2}
.leitung i{display:block;height:100%;width:0;background:var(--sel);transition:width .25s linear}
.leitung.restart i{width:100%!important;background:repeating-linear-gradient(90deg,var(--sel) 0 7px,transparent 7px 12px);opacity:.75;transition:none}
.leitung.done i{background:var(--ok);transition:width .25s linear,opacity .6s 1.2s;opacity:0}

/* Sitzungsband */
.band{height:36px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg-card);border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;overflow:hidden;position:relative;z-index:25}
.band .bsep{width:1px;height:16px;background:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-mute)}
.dot.sel{background:var(--sel)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-mute)}
.dot.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(31,95,191,.18)}}
.b-proj{display:inline-flex;align-items:center;gap:7px;min-width:0}
.b-proj b{font-weight:600}
.b-proj .mono{color:var(--ink-mute);overflow:hidden;text-overflow:ellipsis}
.b-item{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)}
.b-link{border:0;background:none;padding:2px 6px;border-radius:5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;font-size:12px}
.b-link:hover{background:var(--bg-soft);color:var(--ink)}
.tl{display:inline-flex;align-items:center;gap:5px;padding-left:2px}
.tl-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);background:#fff;padding:0;transition:transform .12s}
.tl-dot:hover{transform:scale(1.25);border-color:var(--sel)}
.tl-dot.cur{background:var(--ink);border-color:var(--ink)}
.tl-dot.back{border-style:dashed}
.tl-n{font-family:var(--ff-mono);font-size:11px;font-weight:500;margin-left:2px}
.band .gh{border:0;background:none;padding:4px 8px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px}
.band .gh:hover{background:var(--bg-soft);color:var(--ink)}
.cnt-pill{display:inline-block;min-width:16px;padding:0 5px;border-radius:999px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-ink);font-size:10.5px;font-weight:600;text-align:center;line-height:15px}
.band.stepper{background:linear-gradient(0deg,rgba(227,236,250,.45),rgba(227,236,250,.45)),var(--bg-card)}
.steps{display:flex;align-items:center;gap:0}
.stn{display:inline-flex;align-items:center;gap:6px;color:var(--ink-mute);font-weight:500}
.stn i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;background:#fff;flex:none}
.stn.done{color:var(--ink-soft)}
.stn.done i{background:var(--ink);border-color:var(--ink);color:#fff}
.stn.run{color:var(--sel);font-weight:600}
.stn.run i{border-color:var(--sel);border-right-color:transparent;animation:spin .8s linear infinite}
.stn.fail{color:var(--bad)}.stn.fail i{background:var(--bad);border-color:var(--bad);color:#fff}
.st-line{width:26px;height:1.5px;background:var(--line-strong);margin:0 8px}
.st-line.done{background:var(--ink)}
.st-time{font-family:var(--ff-mono);font-size:11.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.bon{display:inline-block;font-family:var(--ff-mono);font-size:11px;font-weight:500;background:#fff;color:var(--ink);border:1px solid var(--line-strong);border-bottom:0;padding:1px 6px 2px;border-radius:2px 2px 0 0;position:relative;line-height:1.35}
.bon::after{content:'';position:absolute;left:-1px;right:-1px;bottom:-4px;height:4px;background:linear-gradient(135deg,var(--line-strong) 25%,transparent 25%) 0 0/6px 4px,linear-gradient(225deg,var(--line-strong) 25%,transparent 25%) 0 0/6px 4px}
.bon-fly{position:fixed;z-index:400;pointer-events:none;box-shadow:0 6px 16px rgba(15,30,46,.22);font-size:12px}
.band-row{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--warn-soft);border-bottom:1px solid var(--warn-line);color:var(--warn-ink);font-size:12.5px;position:relative;z-index:24;animation:rowin 220ms var(--ease)}
.band-row.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink)}
.band-row.bad{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad)}
.band-row.info{background:var(--sel-soft);border-color:#C9D8F2;color:#173F7C}
.band-row b{font-weight:600}
.band-row .btn{font-size:12px;padding:4px 10px}
.band-row .x{border:0;background:none;color:inherit;opacity:.6;font-size:14px;padding:0 4px}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* Arbeitsfläche */
.work{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 360px;position:relative}
.panel{background:var(--bg-card);overflow:auto;overflow-x:hidden;display:flex;flex-direction:column;min-height:0}
.panel.left{border-right:1px solid var(--line)}
.panel.right{border-left:1px solid var(--line)}
.panel-head{padding:10px 14px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-card);z-index:2}
.panel-head h2{font-size:15px;font-weight:600;margin:0 0 2px}
.panel-head p{margin:0;color:var(--ink-mute);font-size:11.5px}
.panel-body{padding:10px 14px 24px;flex:1}
.hint{color:var(--ink-mute);font-size:11.5px;margin:4px 0 0}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;background:var(--bg-card);position:sticky;top:0;z-index:3}
.tab{padding:9px 8px;border:0;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;color:var(--ink-soft);background:none;display:inline-flex;align-items:center;gap:5px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab .tdot{width:7px;height:7px;border-radius:50%;background:var(--ink-mute)}
.search{position:relative;margin-bottom:8px}
.search input{padding-left:28px}
.search svg{position:absolute;left:9px;top:8px;width:13px;height:13px;color:var(--ink-mute)}
.table-block{margin-bottom:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.table-head{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-soft);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
.table-head .cnt{margin-left:auto;color:var(--ink-mute);font-weight:400;font-family:var(--ff-mono);font-size:10.5px}
.table-head .car{color:var(--ink-mute);transition:transform .15s;font-size:10px}
.table-block.open .car{transform:rotate(90deg)}
.table-body{display:none;padding:6px 6px 4px}
.table-block.open .table-body{display:block}
.fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);background:var(--bg-card);border-radius:5px;padding:3px 7px 3px 5px;margin:0 4px 4px 0;font-size:11.5px;user-select:none;max-width:100%}
.fchip .ico{width:15px;height:15px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--ff-mono);font-size:9.5px;font-weight:600;flex:none}
.fchip.m .ico{background:#FDE7D9;color:var(--accent)}
.fchip.c .ico{background:#E3ECFA;color:var(--sel)}
.fchip.new{border-style:dashed;border-color:var(--warn);background:var(--warn-soft)}

/* Bühne */
.stagewrap{display:flex;flex-direction:column;min-height:0;min-width:0}
.pagebar{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--bg-card);border-bottom:1px solid var(--line);flex:none}
.ptab{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.ptab.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.ptab .n{font-family:var(--ff-mono);font-size:10px;opacity:.6}
.padd{border:1px dashed var(--line-strong);background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink-mute)}
.seal{display:inline-flex;align-items:center;gap:3px;font-family:var(--ff-mono);font-size:10px;font-weight:500;padding:0 6px;border-radius:999px;background:var(--ok-soft);color:var(--ok-ink);border:1px solid var(--ok-line);line-height:16px}
.ptab.act .seal{background:rgba(255,255,255,.14);color:#CFEBDD;border-color:rgba(255,255,255,.25)}
.seal svg{width:10px;height:10px}
.stage{position:relative;overflow:hidden;flex:1;min-height:0;background:radial-gradient(circle at 1px 1px,rgba(15,30,46,.09) 1px,transparent 1px) 0 0/16px 16px,var(--bg)}
.saum{position:absolute;left:0;right:0;top:0;height:2px;background:var(--sel-soft);z-index:4}
.page{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#F4F4F1;box-shadow:0 2px 6px rgba(15,30,46,.08),0 18px 44px rgba(15,30,46,.12);outline:1px solid var(--line);--zoom:.4}
.pg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;max-width:none}
.dsk-ov{opacity:.5;pointer-events:none;z-index:2}
.tov{position:absolute;border-radius:12px;cursor:pointer;z-index:3;transition:box-shadow .18s var(--ease)}
.tov:hover{box-shadow:0 0 0 calc(2px / var(--zoom)) rgba(31,95,191,.3)}
.tov.r-sel{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--sel)}
.tov.r-warn{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--warn)}
.tov.r-ok{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--ok)}
.tov.r-bad{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--bad)}
.tov.sel{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--sel),0 0 0 calc(7px / var(--zoom)) rgba(31,95,191,.18)}
.tov.writing{animation:writing 1.1s ease-in-out infinite}
@keyframes writing{0%,100%{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--sel)}50%{box-shadow:0 0 0 calc(2px / var(--zoom)) var(--sel),0 0 0 calc(8px / var(--zoom)) rgba(31,95,191,.2)}}
.tov.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,40%{box-shadow:0 0 0 calc(3px / var(--zoom)) var(--accent),0 0 0 calc(14px / var(--zoom)) rgba(194,90,45,.2)}}
.tov::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;box-shadow:inset 0 0 0 calc(5px / var(--zoom)) rgba(46,125,91,.55);background:rgba(46,125,91,.05)}
.tov.arrive::after{animation:frame 900ms var(--ease)}
@keyframes frame{0%{opacity:1}100%{opacity:0}}
.badges{position:absolute;top:14px;right:16px;display:flex;gap:4px;align-items:center;transform:scale(calc(1 / var(--zoom)));transform-origin:top right}
.mk{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;line-height:1;color:#fff;box-shadow:0 0 0 2px #fff;flex:none}
.mk-ok{background:var(--ok)}.mk-warn{background:var(--warn)}.mk-bad{background:var(--bad)}.mk-skip{background:#8A919C}
.mk-chg{background:#fff;box-shadow:inset 0 0 0 2px var(--sel),0 0 0 2px #fff}
.mk.mk-pop{animation:pop 260ms var(--ease) both}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.idb{font-family:var(--ff-mono);font-size:9.5px;background:var(--ink);color:#fff;border-radius:3px;padding:1px 5px;opacity:.85}
.stage-bar{position:absolute;left:14px;right:14px;bottom:12px;display:flex;align-items:flex-end;gap:12px;z-index:5;pointer-events:none}
.stage-bar>*{pointer-events:auto}
.stage-info{font-family:var(--ff-mono);font-size:10.5px;color:var(--ink-mute);background:rgba(250,250,247,.85);padding:3px 7px;border-radius:4px}
.stage-tools{display:flex;gap:6px;margin-left:auto}
.stage-tools .btn{box-shadow:var(--sh)}
.stage-tools .btn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Pausenkarte, Stempel */
.pause{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);width:440px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-pop);padding:16px 18px 14px;z-index:8;animation:rise 260ms var(--ease)}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.pause .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pause .ph b{font-size:14px}
.pause .clock{margin-left:auto;font-family:var(--ff-mono);font-size:24px;font-weight:500;color:var(--sel);letter-spacing:-.02em}
.pause p{margin:0 0 10px;color:var(--ink-soft);font-size:12.5px}
.pause .bar{height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--sel) 0 7px,transparent 7px 12px);opacity:.6}
.pause ol{list-style:none;margin:10px 0 0;padding:0;display:flex;gap:6px;flex-wrap:wrap}

.doc li{margin:3px 0;font-size:13.5px}

.doc .fit{border:1px solid var(--line);border-radius:6px}

      p.innerHTML = `<div class="ph"><span class="ck" style="color:var(--ok)">${CHECK_SVG}</span><b>Sitzung bereit. Ab jetzt ohne Neustart.</b><span class="clock">1:12</span></div>
        <p>In Desktop oben in der gelben Leiste die Visuals erlauben.</p>
        <div class="yellowbar"><span>⚠</span><span>Einige Visuals in diesem Bericht sind deaktiviert.</span><span class="fake">Aktivieren</span></div>
        <div style="display:flex;justify-content:flex-end"><button class="btn primary" data-act="prepDone">Erledigt</button></div>`;
    } });
  },
  prepDone: () => { $('#pause').hidden = true; S.prep = 'done'; renderTab(); },
  // Neustart
  rsCancel: () => { $('#dlgRestart').close(); S.cd = null; T.clear(); },
  rsGo: () => restartGo(), rsDiscard: () => restartGo(),
  rsNoRestart: () => { $('#dlgRestart').close(); runDeploy({ seq: 6, onDone: el => { arrive({ seq: 6, dur: fmtS(el), stamp: false, sum: 'Ohne Neustart', rowText: `<b>Deploy ${bon(6)} angekommen.</b> Top 5 Produkte bleibt Skizze, bis Desktop neu startet.` }); } }); },
  rsSave: () => {
    const b = $('#rsBody'); b.insertAdjacentHTML('afterbegin', '<div class="waitrow" id="waitRow"><span class="spin"></span>Warte, bis du in Desktop speicherst …</div>');
    $$('#dlgRestart .dlg-foot .btn').forEach(x => x.disabled = x.dataset.act !== 'rsDiscard' ? true : x.disabled);
    T.set(() => { const w = $('#waitRow'); if (w) { w.className = 'waitrow ok'; w.innerHTML = '✓ Gespeichert erkannt. Es geht weiter.'; } }, 2400);
    T.set(restartGo, 3300);
  },
  // Blockiert
  savedGo: () => { setBandRow(null); runDeploy({ seq: 6, onDone: el => arrive({ seq: 6, dur: fmtS(el), stamp: false, sum: '1 Kachel geändert' }) }); },
  overwrite: () => { S.restartCase = 1; openRestart(true); },
  retry: () => { setBandRow(null); runDeploy({ seq: 6, onDone: el => arrive({ seq: 6, dur: fmtS(el), stamp: false, sum: '1 Kachel geändert' }) }); },
  // Freigaben
  phOpen: () => { S.approvals[0].phMenu = !S.approvals[0].phMenu; renderTab(); },
  phPick: () => { const a = S.approvals[0]; a.replaced = true; a.phMenu = false; a.test = null; renderTab(); },
  fgTest: () => { const a = S.approvals[0]; a.test = 'run'; renderTab(); T.set(() => { a.test = a.replaced ? 'ok' : 'bad'; renderTab(); }, 900); },
  fgApprove: a => {
    const ap = S.approvals.find(x => x.id === a.dataset.id); ap.state = 'approved'; ap.at = ap.id === 'db' ? '10:53' : '10:51'; ap.focus = false;
    if (ap.id === 'marge') setTile('529iu5b', { ring: 'sel', tip: 'Bereit für den nächsten Deploy' });
    const fg = S.approvals.filter(x => x.state !== 'approved' && x.state !== 'rejected').length;
    if (S.btn.s === 'changes') setBtn('changes', { n: S.btn.n, pill: fg }); renderBand(); renderTab(); renderModel();
  },
  fgReject: a => { const ap = S.approvals.find(x => x.id === a.dataset.id); ap.state = 'rejected'; ap.at = '10:52'; const fg = S.approvals.filter(x => x.state !== 'approved' && x.state !== 'rejected').length; if (S.btn.s === 'changes') setBtn('changes', { n: S.btn.n, pill: fg }); renderBand(); renderTab(); },
  // Verlauf
  tlDot: a => { setTab('live'); T.set(() => flashSec('secHist'), 30); $('#tlPop').hidden = true; },
  histBack: a => { S.histConfirm = +a.dataset.seq; renderTab(); },
  histCancel: () => { S.histConfirm = null; renderTab(); },
  histGo: a => {
    const back = +a.dataset.seq; S.histConfirm = null; const seq = S.seq + 1;
    runDeploy({ seq, label: '↶' + back, onDone: el => arrive({ seq, dur: fmtS(el), stamp: false, back, time: '10:49', sum: `Zurück zu ${bon(back)}`, rowText: `<b>Zurück auf dem Stand von ${bon(back)}.</b> ${bon(4)} und ${bon(5)} bleiben im Verlauf.` }) });
  },
  // Ergebnis
  resPage: a => { S.res.page = +a.dataset.page; renderResult(); },
  resMode: a => { S.res.mode = a.dataset.mode; renderResult(); },
  rowOk: a => { const id = a.closest('.trow').dataset.tid; S.rows[id] = Object.assign({}, S.rows[id], { ok: true }); rerow(id); },
  rowNote: a => { const id = a.closest('.trow').dataset.tid; S.rows[id] = Object.assign({ note: '' }, S.rows[id], { noteOpen: true }); rerow(id); const ta = $(`.trow[data-tid="${id}"] textarea`); ta && ta.focus(); },
  rowNoteCancel: a => { const id = a.closest('.trow').dataset.tid; S.rows[id].noteOpen = false; rerow(id); },
  rowNoteSave: a => { const r = a.closest('.trow'), id = r.dataset.tid; S.rows[id].note = r.querySelector('textarea').value.trim() || 'Aufbau an die Skizze angleichen'; S.rows[id].noteOpen = false; rerow(id); },
  rowShow: a => { const id = a.closest('.trow').dataset.tid; closeResult(); S.page = S.res.page; renderPagebar(); S.sel = id; renderPage(); setTab('el'); const t = $(`.tov[data-tile="${id}"]`); if (t) { t.classList.add('flash'); } },
  accept: () => {
    const p = S.res.page; S.seals[p] = p === 1 ? '10:58' : '11:06';
    $('#rlFoot').innerHTML = `<div class="accepted"><span class="ck">${CHECK_SVG}</span>Seite abgenommen ${S.seals[p]}</div>`;
    const segs = $$('#resView .fv-head .seg')[0]; segs.querySelector(`[data-page="${p}"]`).insertAdjacentHTML('beforeend', ' ' + sealHtml(S.seals[p], true));
    renderPagebar(); const pt = $(`.ptab[data-page="${p}"] .seal`); if (pt) pt.outerHTML = sealHtml(S.seals[p], true);
  },
  // Protokoll
  protoDl: () => toast('Protokoll erstellt (im Prototyp ohne Datei)'),
  protoMd: () => toast('Kopiert'), protoPrint: () => toast('Druckansicht (im Prototyp ohne Wirkung)'),
  slide: () => { if (!$('#protoView .slide-wrap')) { $('#protoView').insertAdjacentHTML('beforeend', slideHtml()); requestAnimationFrame(() => fitAll($('#protoView'))); } },
  slideClose: () => { const s = $('#protoView .slide-wrap'); s && s.remove(); },
  slideBg: (a, e) => { if (e.target === a) a.remove(); }
};
function demoMin(on) { const d = $('#demo'); d.classList.toggle('min', on); $('#demoMinBtn').textContent = on ? '▴' : '▾'; }
function demoAuto() {
  const full = !$('#resView').hidden || !$('#protoView').hidden || !$('#presentView').hidden || !$('#startLayer').hidden;
  if (S.demoUser == null) demoMin(full); else demoMin(S.demoUser);
}
setInterval(demoAuto, 250);
function rerow(id) { const r = $(`.trow[data-tid="${id}"]`); if (!r) return; const d = document.createElement('div'); d.innerHTML = rowHtml(TILE(id)); r.replaceWith(d.firstElementChild); }
function flashBandRow() { const r = $('#bandRow'); if (r.hidden) return; r.style.animation = 'none'; void r.offsetWidth; r.style.animation = ''; }

/* ================================================================ Ereignisse */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!e.target.closest('.menu') && !e.target.closest('#depMore') && !e.target.closest('#btnMore')) closeMenus();
  if (S.pvOpen && !e.target.closest('#pvPop') && !e.target.closest('#dep')) closePreview();
  if (!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); }
});
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip();
  const d = e.target.closest('.tl-dot');
  const pop = $('#tlPop');
  if (d) {
    const h = S.history.find(x => x.seq === +d.dataset.seq); if (!h) return;
    pop.innerHTML = `<img src="${IMG.sk}" alt=""><div><span class="bon">${h.back ? '↶' + h.back : bon(h.seq)}</span> <span class="mono mute">${h.time}</span><br><small>${h.sum}</small></div>`;
    pop.hidden = false; const r = d.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(window.innerWidth - 250, r.left - 110)) + 'px'; pop.style.top = (r.bottom + 10) + 'px';
  } else if (!pop.hidden) pop.hidden = true;
});
document.addEventListener('input', e => {
  if (e.target.id === 'fadeR') { S.res.fade = +e.target.value; applyCmp(); }
});
// Schieber-Griff ziehen (Ergebnis und Präsentation)
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('#handle, #prHandle'); if (!h) return;
  drag = { el: h, box: h.parentElement.getBoundingClientRect(), pr: h.id === 'prHandle' };
  h.setPointerCapture && h.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (drag) {
    const v = Math.max(0, Math.min(100, (e.clientX - drag.box.left) / drag.box.width * 100));
    if (drag.pr) { PR.split = v; drag.el.style.left = v + '%'; drag.el.parentElement.querySelector('.top').style.clipPath = `inset(0 0 0 ${v}%)`; }
    else { S.res.split = v; applyCmp(); }
  }
  loupeAt(e);
});
document.addEventListener('pointerup', () => { drag = null; });
// Alt allein soll in Windows nicht das Browsermenü öffnen
document.addEventListener('keyup', e => {
  if (e.key === 'Alt') { e.preventDefault(); $('#loupe').hidden = true; }
  if (e.key === ' ' && S.res.blink) { e.preventDefault(); blinkStop(); }
});
document.addEventListener('keydown', e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'range';
  if (!$('#presentView').hidden) { if (presentKey(e)) { e.preventDefault(); return; } }
  if (e.key === 'Alt') { e.preventDefault(); return; }
  if (e.key === 'Escape') {
    if (cancelDeploy()) return;
    if (!$('#depMenu').hidden || !$('#moreMenu').hidden) return closeMenus();
    if (S.pvOpen) return closePreview();
    if ($('#protoView .slide-wrap')) return ACT.slideClose();
    if (!$('#resView').hidden) return closeResult();
    if (!$('#protoView').hidden) return closeProto();
    if (!$('#startLayer').hidden) return closeStart();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (e.shiftKey && (S.btn.s === 'changes')) return go(6);
    if (S.pvOpen) { const b = $('#pvGo'); if (b) b.click(); return; }
    if (S.live) ACT.openPreview();
    return;
  }
  if (S.pvOpen && e.key === 'Enter' && !inField) { e.preventDefault(); const b = $('#pvGo'); if (b) b.click(); return; }
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
  const res = !$('#resView').hidden;
  if (res && e.key === ' ') { e.preventDefault(); if (!e.repeat) blinkStart(); return; }
  if (res && (e.key === '[' || e.key === ']')) {
    if (S.res.mode === 'slider') S.res.split = Math.max(0, Math.min(100, S.res.split + (e.key === ']' ? 5 : -5)));
    else if (S.res.mode === 'fade') { S.res.fade = Math.max(0, Math.min(100, S.res.fade + (e.key === ']' ? 10 : -10))); const r = $('#fadeR'); if (r) r.value = S.res.fade; }
    applyCmp(); return;
  }
  if (document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); return go(S.scen + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); return go(S.scen - 1); }
  if (!S.live) return;
  const k = e.key.toLowerCase();
  if (k === 'l') setTab('live');
  else if (k === 'd' && !e.shiftKey) ACT.toggleShot();
  else if (k === 'r') ACT.remeasure();
});
let rz = null;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { layoutPage(); fitAll(); if (!$('#presentView').hidden) renderPresent(); }, 60); });

/* ================================================================ Start */
$('#demoMinBtn').textContent = '▾';
setFav(null);
const m = /^#(\d+)(?:\.(\d+))?$/.exec(location.hash || '');
go(m ? +m[1] : 1, m && m[2] ? +m[2] : 0);
window.MKLIVE_PROTO = { go, S };
})();
</script>
</body>
