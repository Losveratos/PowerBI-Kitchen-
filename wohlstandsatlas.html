n bekommt ihren Anteil am BIP und an der Bevölkerung ihres Landes laut nationaler Statistik und diesen Anteil an den Landeswerten 2024. So summieren sich Regionen genau zum Land, und jede Ebene deckt die ganze Welt ab. Wirtschaftsleistung ohne Region (US-Bundesaktivität im Ausland, Norwegens Förderung auf See) ist als eigene Einheit ohne Kartenfläche geführt. Die Jahre der Regionaldaten unterscheiden sich je Land (meist 2023–2025, Ukraine 2021, Iran 2018); sie bestimmen nur die Verteilung innerhalb des Landes.</p>\n<p><b>Regionale Quellen.</b> Europa: Eurostat (NUTS-3, meist 2023), Schweiz BFS, Norwegen SSB, Großbritannien ONS. USA: BEA und Census Bureau (Bundesstaaten und Counties 2024). Kanada: Statistics Canada. Mexiko: INEGI. Brasilien: IBGE. Russland: Rosstat. Japan: Cabinet Office. Südkorea: KOSTAT. China: NBS und städtische Statistikkommuniqués. Indien: MOSPI. Weitere Länder: die nationalen Statistikämter; Quelle und Jahr stehen bei jeder Region. Grenzen: Eurostat GISCO, US Census, Natural Earth.</p>\n<p><b>Kennzahlen.</b> KKP = Kaufkraftparität in internationalen Dollar (Int.$). „Haushalte/Kopf“: Länder = Konsumausgaben der privaten Haushalte (Weltbank); Regionen = Landeswert × regionales verfügbares Einkommen pro Kopf im Verhältnis zum Land (Eurostat, ONS, BEA, Statistics Canada, NBS, Cabinet Office, KOSTAT). „Regionale Kaufkraft“ nutzt regionale Preisindizes, wo es sie gibt (USA: BEA, Deutschland: Kreise); sonst gilt das Preisniveau des Landes. BNE = Bruttonationaleinkommen (Weltbank; Irland: GNI* des CSO). EU-Index = BIP pro Kopf (KKP) im Verhältnis zum EU-27-Schnitt, eine Annäherung an die offizielle Einstufung. Gini = Einkommensungleichheit innerhalb eines Landes (Weltbank über Gapminder, jüngster Wert bis 2024), dieselben Werte wie im <a href=\"laender-indikatoren-explorer.html\">Länder-Indikatoren-Explorer</a> der Knowledge Kitchen.</p>\n<p><b>Ränge und Ausreißer.</b> Einheiten unter 50.000 Einwohnern bekommen keinen Rang und keinen Ländervergleich: Einzelne Ölfelder oder Firmen verzerren dort alles. Regionen mit mehr als doppelt so hohem BIP pro Kopf wie ihr Land sind markiert (Pendler, Konzernsitze, Rohstoffe). Die Verteilungsgrafik kappt die obersten 0,5 % der Bevölkerung; gekappte Balken haben ein kleines Dreieck.</p>\n<p><b>Anteile an der Welt.</b> Bezugsgröße ist immer die gesamte Weltbevölkerung aller Länder (8,1 Mrd.); wer keine Daten hat, wird als „ohne Daten“ ausgewiesen. Der Anteil „darunter“ hängt von der Ebene ab: Feinere Regionen zeigen die Unterschiede genauer.</p>\n<p><b>Umstrittene Gebiete</b> sind schraffiert markiert, mit dem Status im Tooltip. Die Krim hat keine Daten; die russischen Werte enthalten weder die Krim noch die 2022 besetzten Gebiete.</p>\n<p><b>Grenzen der Methode.</b> Preise innerhalb eines Landes gelten außer in den USA und Deutschland als gleich. Das BIP zählt am Arbeitsort, die Bevölkerung am Wohnort – Kernstädte wirken deshalb reicher als ihr Umland; die Ebene „Metropolregionen“ gleicht das aus, wo es sie gibt. Die Daten einiger Länder (China, Russland) gelten als weniger verlässlich.</p>\n"};

function groupDef(){

  return {n:7, of:u=>u[m.k]==null?-1:sc.cls(u[m.k]),

}
function colorOf(u){

function colorKey(u){ return sqColor==="cont" ? keyCont(u) : (u[sqColor]==null ? -1 : scaleOf(sqColor).cls(u[sqColor])); }

function layoutSquares(){
  const gd = groupDef(), list = atLevel().filter(u=>u.pop), sortK = gd.m ? gd.m.k : metric.k;
  const bins = d3.range(gd.n).map(i=>({i, label:gd.label(i), short:gd.short(i), units:[], pop:0}));
  for(const u of list){ const b=gd.of(u); if(b>=0&&bins[b]){ bins[b].units.push(u); bins[b].pop+=u.pop; } }
  for(const b of bins) b.units.sort((a,c)=> (colorKey(c)-colorKey(a)) || ((c[sortK]||0)-(a[sortK]||0)));
  for(const b of bins){
    b.sq = [];
    if(sqUnit==="region") b.units.forEach(u=>b.sq.push({u, key:u.id}));
    else { const n=Math.round(b.pop/PEOPLE_STEP); let acc=0, j=0;
      for(let i=0;i<n;i++){ const t=(i+.5)*PEOPLE_STEP; while(j<b.units.length-1 && acc+b.units[j].pop<t){ acc+=b.units[j].pop; j++; } b.sq.push({u:b.units[j], key:b.units[j].id+"#"+i}); } }
  }
  const padX=6, top=34, bottom=36, W=CW, H=CH, bw=(W-padX*(bins.length+1))/bins.length, ah=H-top-bottom;
  let lo=.6, hi=40;
  for(let it=0;it<30;it++){ const s=(lo+hi)/2, cols=Math.max(1,Math.floor(bw/s));
    const ok=bins.every(b=>Math.ceil(b.sq.length/cols)*s<=ah); if(ok) lo=s; else hi=s; }
  const s=lo, cols=Math.max(1,Math.floor(bw/s)); sqS=s;
  const next=[];
  bins.forEach((b,bi)=>{
    const x0=padX+bi*(bw+padX)+(bw-cols*s)/2;
    b.x=padX+bi*(bw+padX); b.w=bw;
    b.sq.forEach((q,i)=>{ q.x=x0+(i%cols)*s; q.y=H-bottom-(Math.floor(i/cols)+1)*s; q.s=s; q.c=colorOf(q.u); next.push(q); });
    b.topY = H-bottom-Math.ceil(b.sq.length/cols)*s;
  });
  const from = new Map(squares.map(q=>[q.key,q]));
  for(const q of next){ const p=from.get(q.key); q.fx=p?p.x:q.x; q.fy=p?p.y:H-bottom; q.fs=p?p.s:0; }
  squares=next; sqBins=bins; sqDirty=false;
  sqAnim = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? null : {t0:performance.now(), d:650};
}
function drawSquares(){
  if(sqDirty) layoutSquares();
  const now=performance.now(); let t=1;
  if(sqAnim){ t=Math.min(1,(now-sqAnim.t0)/sqAnim.d); t=d3.easeCubicInOut(t); if(t>=1) sqAnim=null; }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.fillStyle=C.surface; cx.fillRect(0,0,CW,CH);
  const gap = sqS>=3 ? Math.max(.5, sqS*.14) : 0;
  for(const q of squares){
    const x=q.fx+(q.x-q.fx)*t, y=q.fy+(q.y-q.fy)*t, s=(q.fs+(q.s-q.fs)*t)-gap;
    if(s<=0) continue; cx.fillStyle=q.c; cx.fillRect(x,y,s,s);
  }
  for(const q of squares){ if(group.has(q.u.id)){ cx.strokeStyle=C.grp; cx.lineWidth=Math.max(1,sqS*.18); cx.strokeRect(q.x+.5,q.y+.5,q.s-gap-1,q.s-gap-1); } }
  for(const q of squares){ if(q.u===selected){ cx.strokeStyle=C.sel; cx.lineWidth=Math.max(1.5,sqS*.25); cx.strokeRect(q.x,q.y,q.s-gap,q.s-gap); } }
  const narrow = CW<560;
  cx.textAlign="center"; cx.fillStyle=C.muted;
  for(const b of sqBins){
    const mid=b.x+b.w/2;
    cx.font=`500 ${narrow?10:11}px ${C.mono}`;
    cx.fillText(narrow? b.short : b.label, mid, CH-20);
    cx.font=`400 ${narrow?9:10}px ${C.mono}`;
    const cnt = sqUnit==="region" ? f0(b.units.length) : big(b.pop);
    cx.fillText(cnt, mid, Math.min(CH-40, b.topY-6));
    cx.fillText(pct(b.pop/WORLD.pop), mid, CH-7);
  }
  if(sqAnim) redraw();
}

  if(!fromSlider && thr!=null && sortedVals.length){ thrEl.value = Math.round(1000*d3.bisectLeft(sortedVals,thr)/Math.max(1,sortedVals.length-1)); }
  document.getElementById("thrv").textContent = thr!=null?metric.fmt(thr):"–";
  const s=hlStats();
  const ref = thr!=null && selected[metric.k]===thr ? ` als ${selected.name}` : "";
  const word = hlMode==="below"? metric.word[1] : metric.word[0];
  document.getElementById("sentence").innerHTML = hlMode==="off"
    ? `Wähle <b>Alle darüber</b> oder <b>Alle darunter</b>, um zu sehen, wie viele Menschen weltweit über oder unter <b>${selected.name}</b> liegen. Mit dem Regler verschiebst du die Schwelle.`
    : `<b>${big(s.pop)} Menschen</b> leben in Gebieten mit ${word} ${metric.noun}${ref} (${metric.fmt(thr)}). Das sind <b>${pct(s.pop/WORLD.pop)}</b> der Weltbevölkerung und <b>${pct(s.ppp/WORLD.ppp)}</b> der Weltwirtschaft.`;
  document.getElementById("hlstats").innerHTML = [

    [big(s.ppp)+" "+IS, `Wirtschaftsleistung (KKP) · ${pct(s.ppp/WORLD.ppp)} der Welt`],
    [s.pop? nice(s.ppp/s.pop)+" "+IS:"–", `BIP pro Kopf (KKP) dieser Menschen`],
  ].map(([n,l])=>`<div class="stat"><span class="n">${n}</span><span class="l">${l}</span></div>`).join("");
  const v=selected[metric.k];
  if(v!=null && !metric.total){ const lv=atLevel().filter(u=>u[metric.k]!=null); const below=d3.sum(lv.filter(u=>u[metric.k]<v),u=>u.pop||0), above=d3.sum(lv.filter(u=>u[metric.k]>v),u=>u.pop||0);
    document.getElementById("split3").textContent = `Bezogen auf ${selected.name}: darunter ${pct(below/WORLD.pop)} · darüber ${pct(above/WORLD.pop)} · gleich ${pct((WORLD.pop-below-above-s.noData)/WORLD.pop)} · ohne Daten ${pct(s.noData/WORLD.pop)} der Weltbevölkerung. Die Anteile hängen von der Ebene ab: Je feiner die Regionen, desto genauer.`; }
  else document.getElementById("split3").textContent="";

function dist(){
  const s=d3.select("#dist"), el=document.getElementById("dist");
  const DW=Math.max(280, el.parentElement.clientWidth), DH=CW<560?170:200, m={l:8,r:8,t:10,b:30};
  s.attr("viewBox",`0 0 ${DW} ${DH}`); s.selectAll("*").remove();
  const k=metric.k, byGdp=metric.total;
  const wOf = u=> byGdp ? (u.gdp_usd||0) : (u.pop||0);
  const data = atLevel().filter(u=>u[k]!=null&&wOf(u)>0).sort((a,b)=>a[k]-b[k]);
  if(!data.length){ document.getElementById("disttitle").textContent="Keine Daten auf dieser Ebene"; return; }
  const tot = d3.sum(data,wOf); let acc=0;
  for(const u of data){ u._x0=acc/tot; acc+=wOf(u); u._x1=acc/tot; }
  document.getElementById("disttitle").textContent = byGdp
    ? `Weltwirtschaft nach Größe der Einheiten · Breite = Anteil am Welt-BIP`
    : `Die Welt nach ${metric.noun} · Breite = Anteil an der Weltbevölkerung (mit Daten)`;
  const x=d3.scaleLinear().domain([0,1]).range([m.l,DW-m.r]);
  const ext=d3.extent(data,u=>u[k]);
  const pAt = data.find(u=>u._x1>=0.995); const cap = metric.log? ext[1] : Math.min(ext[1], (pAt?pAt[k]:ext[1])*1.15);
  const y=(metric.log?d3.scaleLog().domain([Math.max(ext[0],1e-3),ext[1]]):d3.scaleLinear().domain([0,cap])).range([DH-m.b,m.t]).nice().clamp(true);
  const sc=scaleOf(k);
  s.selectAll("rect.b").data(data).join("rect").attr("class",u=>"b"+(u===selected?" sel":""))
    .attr("x",u=>x(u._x0)).attr("width",u=>Math.max(.6,x(u._x1)-x(u._x0)))
    .attr("y",u=>y(u[k])).attr("height",u=>Math.max(0,DH-m.b-y(u[k])))
    .attr("fill",u=>passes(u)?fill(sc.cls(u[k])):"var(--dim)");
  s.selectAll("rect.sel").raise();
  // bars cut at the top get a small mark, so the clipping is visible
  data.filter(u=>!metric.log&&u[k]>y.domain()[1]&&x(u._x1)-x(u._x0)>1.5).forEach(u=>s.append("path").attr("class","capmark")
    .attr("d",`M${x((u._x0+u._x1)/2)-3},${m.t+5}L${x((u._x0+u._x1)/2)},${m.t}L${x((u._x0+u._x1)/2)+3},${m.t+5}Z`));
  s.append("line").attr("class","axis").attr("x1",m.l).attr("x2",DW-m.r).attr("y1",DH-m.b).attr("y2",DH-m.b);
  s.selectAll("text.x").data([0,.25,.5,.75,1]).join("text").attr("class","x").attr("x",x).attr("y",DH-m.b+14)
    .attr("text-anchor",(d,i)=>i===0?"start":i===4?"end":"middle").text(d=>f0(d*100)+" %");
  s.append("text").attr("x",DW-m.r).attr("y",DH-4).attr("text-anchor","end").text(byGdp?"kumulierter Anteil am Welt-BIP":"kumulierter Anteil der Weltbevölkerung");
  const yt=y.ticks(4).filter(t=>(!metric.log||Math.log10(t)%1===0)&&y(t)>14);
  s.selectAll("text.y").data(yt).join("text").attr("class","y").attr("x",m.l+2).attr("y",d=>y(d)-3).text(tick);
  if(!byGdp && !metric.log){
    const refs=[[worldMean(k),"Weltschnitt"],[weightedQuantile(atLevel(),k,.5),"mittlerer Mensch"]].filter(r=>r[0]!=null&&y(r[0])>m.t+8);
    refs.forEach(([v,l],i)=>{ s.append("line").attr("class","ref").attr("x1",m.l).attr("x2",DW-m.r).attr("y1",y(v)).attr("y2",y(v));
      const near=refs.length===2&&Math.abs(y(refs[0][0])-y(refs[1][0]))<14;
      s.append("text").attr("class","reft").attr("x",i?DW-m.r-2:m.l+2).attr("text-anchor",i?"end":"start").attr("y",near&&i?y(v)+11:y(v)-3).text(`${l}: ${metric.fmt(v)}`); });
  }
  if(hlMode!=="off"&&thr!=null) s.append("line").attr("class","thr").attr("x1",m.l).attr("x2",DW-m.r).attr("y1",y(thr)).attr("y2",y(thr));
  if(selected[k]!=null && data.includes(selected)){ const cx2=x((selected._x0+selected._x1)/2), cy=y(selected[k]);
    s.append("circle").attr("cx",cx2).attr("cy",cy).attr("r",4.5).attr("fill","var(--sel)");
    s.append("text").attr("x",cx2>DW*0.7?cx2-7:cx2+7).attr("y",Math.max(12,cy-6)).attr("text-anchor",cx2>DW*0.7?"end":"start").style("fill","var(--sel)").text(selected.name); }
  s.on("click",e=>{ const [px]=d3.pointer(e); const p=x.invert(px); const u=data.find(d=>d._x0<=p&&d._x1>=p); if(u) pick(u); });
}

function lead(){
  const k = (metric.total||metric.k==="density"||metric.scope) ? "gdp_pc_ppp" : metric.k, M=METRICS.find(x=>x.k===k);
  const med = weightedQuantile(atLevel(),k,.5);

  if(v!=null){ const lv=atLevel().filter(u=>u[k]!=null); const below=d3.sum(lv.filter(u=>u[k]<v),u=>u.pop||0);
    t += ` <b>${selected.name}</b> liegt mit ${M.fmt(v)} über <b>${pct(below/WORLD.pop)}</b> der Weltbevölkerung.`; }
  document.getElementById("lead").innerHTML = t;

// ---------- profile card ----------
const ratio=(a,b)=>Math.abs(Math.log(a/b));
function nearest(v,k,skip){ return v==null?null:peers.filter(c=>c[k]!=null&&c.id!==skip).sort((a,b)=>ratio(a[k],v)-ratio(b[k],v))[0]; }
function popShareBelow(u,k){ const lv=atLevel().filter(x=>x[k]!=null); return d3.sum(lv.filter(x=>x[k]<u[k]),x=>x.pop||0)/WORLD.pop; }
function dq(u){
  const L=[], sp=(DATA.split[u.id]||[]), c=byId.get(u.country);
  if(u.flag==="missing") L.push(`<span class="warn">Für diese Region liegen keine Daten vor.</span>`);
  if(u.small) L.push(`<span class="warn">Weniger als ${f0(META.small_pop)} Einwohner: zu klein für einen fairen Vergleich, daher ohne Rang. Einzelne Betriebe oder Rohstoffe können den Wert stark verzerren.</span>`);
  if(u.hot) L.push(`<span class="warn">BIP pro Kopf mehr als doppelt so hoch wie im Landesschnitt. ${u.pop>5e6?"Ein Wirtschaftszentrum des Landes: Hier ballen sich Industrie, Dienstleistungen und Konzernsitze.":"Typisch für Pendlerzentren, Konzernsitze oder Rohstoffförderung: Die Wirtschaftsleistung entsteht hier, viele Beschäftigte wohnen aber woanders."} ${u.hh_pc_ppp?`Haushalte: ${nice(u.hh_pc_ppp)} ${IS} pro Kopf.`:""}</span>`);
  if(u.kind==="Land/Gebiet"){
    L.push(`Quelle: ${u.src}, ${u.year}`);
    if(u.old_year) L.push(`<span class="warn">Teilweise ältere Werte, der älteste von ${u.old_year}.</span>`);
    if(level>0 && !sp.includes(Math.min(level,2))) L.push(`<span class="warn">Keine amtlichen Regionaldaten${u.note?` (${u.note})`:""}: Das Land wird auf dieser Ebene als Ganzes gezeigt.</span>`);
  } else if(u.flag!=="missing"){
    L.push(`Verteilung innerhalb des Landes: ${u.src}, Jahr ${u.year}. Hochgerechnet auf die Landeswerte 2024 (${c?c.src:"Weltbank"}).`);
    if(u.flag==="estimate") L.push(`<span class="warn">Teilweise geschätzt (z. B. nach Einwohnern aufgeteilt oder Bevölkerungsprojektion).</span>`);
    if(u.flag==="older") L.push(`<span class="warn">Ältere Regionaldaten (${u.year}).</span>`);
    if(u.price_index) L.push(`Regionales Preisniveau: ${f0(u.price_index)} (Land = 100).`);
    if(u.hh_note && metric.k==="hh_pc_ppp") L.push(`Haushaltswert: ${u.hh_note} (feinere Daten gibt es hier nicht).`);
  }
  if(DQ_NOTE[u.country]) L.push(DQ_NOTE[u.country]);
  return `<div class="dq">${L.map(x=>`<span>${x}</span>`).join("")}</div>`;
}
function rankBand(u,k){ const lv=atLevel().filter(x=>x[k]!=null&&ranked(x)).sort((a,b)=>b[k]-a[k]); const r=lv.indexOf(u)+1; if(!r) return "";
  const p=r/lv.length, band = p<=.01?"oberstes 1 %":p<=.05?"oberste 5 %":p<=.1?"oberste 10 %":p<=.25?"oberes Viertel":p<=.5?"obere Hälfte":p<=.75?"untere Hälfte":p<=.9?"unteres Viertel":"unterste 10 %";
  return `${band} der Einheiten <small>(Rang ${f0(r)} von ${f0(lv.length)}, ohne Einheiten unter ${f0(META.small_pop)} Einw.)</small>`; }
function spark(u){
  const c=u.kind==="Land/Gebiet"?u.id:u.country, s=TS&&TS.series[c]; if(!s) return "";
  const pts=s.map((v,i)=>[TS.start+i,v]).filter(p=>p[1]!=null); if(pts.length<5) return "";

  const line=d3.line().x(p=>x(p[0])).y(p=>y(p[1])), area=d3.area().x(p=>x(p[0])).y0(H-m.b).y1(p=>y(p[1]));
  const a=pts[0], b=pts[pts.length-1], g=(b[1]/a[1]-1);

  return `<div style="display:grid;gap:4px"><h3>Reales BIP pro Kopf ${a[0]}–${b[0]} · ${name}</h3>
    <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf"><path class="a" d="${area(pts)}"/><path class="l" d="${line(pts)}"/>
    <circle cx="${x(b[0])}" cy="${y(b[1])}" r="3"/><text x="${x(b[0])+5}" y="${y(b[1])+4}">${tick(b[1])}</text>
    <text x="${m.l}" y="${H-3}">${a[0]}</text><text x="${W-m.r}" y="${H-3}" text-anchor="end">${b[0]}</text></svg>
    <span class="hint">${g>=0?"+":""}${f0(g*100)} % seit ${a[0]} (konstante Preise 2021)</span></div>`;
}

  document.getElementById("grpmode").setAttribute("aria-pressed",groupMode);
  if(!m.length){
    el.innerHTML = `<div><div class="kind">Gruppe</div><h2>Eigene Gruppe</h2></div>
      <p class="hint">Tippe auf <b>Gruppe bilden</b> und dann auf Regionen oder Länder, um sie zusammenzurechnen. Zum Beispiel Bayern und Baden-Württemberg gegen Kalifornien oder alle Kreise einer Metropolregion.</p>`;
    return;
  }
  const pop=d3.sum(m,u=>u.pop||0), usd=d3.sum(m,u=>u.gdp_usd||0), ppp=d3.sum(m,u=>u.gdp_ppp||0), real=d3.sum(m,u=>u.gdp_real||0), area=d3.sum(m,u=>u.area_km2||0);

           hh_pc_ppp:wavg("hh_pc_ppp"), gdp_pc_rp:wavg("gdp_pc_rp"), eu_index:wavg("eu_index"), gni_pc_ppp:null};

// ---------- link that restores the whole view (#ID--m2--l1--vq--ha--t67000--cp--up--g12x40) ----------
function writeHash(){
  const parts=[selected.id, "m"+METRICS.indexOf(metric), "l"+level, "v"+(view==="map"?"m":"q"), "h"+hlMode[0], "c"+classMode[0], "u"+sqUnit[0]];
  if(thr!=null&&hlMode!=="off") parts.push("t"+Math.round(thr));
  if(group.size) parts.push("g"+[...group].map(id=>byId.get(id)._i.toString(36)).join("x"));
  try{ history.replaceState(null,"","#"+parts.join("--")); }catch(e){}
}
function readHash(){
  let h; try{ h=decodeURIComponent(location.hash.slice(1)); }catch(e){ return false; } if(!h) return false;
  const [id,...ps]=h.split("--"); if(!byId.has(id)) return false;
  selected=byId.get(id);
  for(const p of ps){ const t=p[0], v=p.slice(1);
    if(t==="m"&&METRICS[+v]) metric=METRICS[+v];
    if(t==="l"&&+v>=0&&+v<=3) level=+v;
    if(t==="v") view = v==="q"?"squares":"map";
    if(t==="h") hlMode = v==="a"?"above":v==="b"?"below":"off";
    if(t==="c") classMode = v==="p"?"people":"countries";
    if(t==="u") sqUnit = v==="r"?"region":"people";
    if(t==="t") thr=+v;
    if(t==="g") v.split("x").forEach(s=>{ const u=units[parseInt(s,36)]; if(u) group.add(u.id); });
  }
  if(!selected.lv.includes(level)) level=Math.max(...selected.lv.filter(l=>l<=2));
  if(metric.countryOnly){ level=0; if(selected.kind!=="Land/Gebiet") selected=byId.get(selected.country)||selected; }
  if(thr==null) thr=selected[metric.k]??null;
  return true;
}

const toast=t=>{ const el=document.getElementById("toast"); el.textContent=t; clearTimeout(toast._t); toast._t=setTimeout(()=>el.textContent="",4000); };
function citeText(){
  const v=selected[metric.k];
  const srcs = new Set(["Weltbank WDI 2024"]); if(selected.kind!=="Land/Gebiet"&&selected.src) srcs.add(`${selected.src} ${selected.year}`);
  let t = v!=null ? `${selected.name}: ${metric.label} ${metric.fmt(v)}${ranked(selected)&&!metric.total?` – mehr als bei ${pct(popShareBelow(selected,metric.k))} der Weltbevölkerung`:""}.` : `${selected.name}: keine Daten.`;
  if(hlMode!=="off") t += " " + document.getElementById("sentence").textContent;
  return `${t} Quelle: ${[...srcs].join("; ")}; Berechnung Wohlstandsatlas (${LEVELS[level]}). ${META.link}${location.hash}`;
}
document.getElementById("cite").onclick=()=>{
  const t=citeText();
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); toast("Text markiert – jetzt kopieren."); setTimeout(()=>ta.remove(),8000); };
  try{ navigator.clipboard.writeText(t).then(()=>toast("Kopiert."), fallback); }catch(e){ fallback(); }
};

  if(downloads){ document.getElementById("png").hidden=false; document.getElementById("csv").hidden=false; } })();
async function save(filename,data){ try{ await downloads.save({filename,data}); toast(META.target==="kitchen"?"Download gestartet.":"Gespeichert."); }
  catch(e){ if(e&&e.code==="declined") toast("Abgebrochen."); else toast("Speichern ist hier nicht möglich."); } }
document.getElementById("csv").onclick=()=>{
  const cols=["id","name","kind","country","pop","area_km2",...METRICS.map(m=>m.k),"year","src","flag"];
  const esc=v=>v==null?"":(/[",;\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:String(v));
  const rows=atLevelAll().map(u=>cols.map(c=>esc(u[c])).join(","));
  save(`wohlstandsatlas_${LEVELS[level].replace(/\W+/g,"_").toLowerCase()}.csv`, cols.join(",")+"\n"+rows.join("\n"));
};
document.getElementById("png").onclick=()=>{
  const pad=24*dpr, foot=64*dpr, head=56*dpr, out=document.createElement("canvas");
  out.width=cv.width+2*pad; out.height=cv.height+head+foot; const o=out.getContext("2d");
  o.fillStyle=C.bg; o.fillRect(0,0,out.width,out.height); o.drawImage(cv,pad,head);
  o.fillStyle=C.ink; o.font=`700 ${22*dpr}px ${C.display||"sans-serif"}`; o.fillText(`Wohlstandsatlas · ${metric.label}`, pad, 34*dpr);
  o.font=`400 ${12*dpr}px ${C.body}`; o.fillStyle=C.muted;
  o.fillText(`${LEVELS[level]} · ${metric.unit}${selected?` · markiert: ${selected.name}`:""}`, pad, 50*dpr);
  o.fillText(`Quelle: Weltbank WDI 2024, IWF, Eurostat und nationale Statistikämter; Berechnung Wohlstandsatlas`, pad, head+cv.height+26*dpr);
  o.fillText(META.link, pad, head+cv.height+44*dpr);
  out.toBlob(b=>{ if(b) save(`wohlstandsatlas_${metric.k}.png`, b); }, "image/png");
};

// ---------- stories ----------
function findName(n){ return units.find(u=>u.name===n&&!u.nogeo); }
const STORIES=[
  {t:"Die Welt in Menschen", run(){ setView("squares",true); level=2; drawLevel(); sqUnit="people"; sqGroup="gdp_pc_ppp"; sqColor="cont"; metric=METRICS[0]; hlMode="off"; },
   text(){ const med=weightedQuantile(atLevel(),"gdp_pc_ppp",.5); return `Jedes Quadrat steht für 5 Millionen Menschen. Die Hälfte der Menschheit lebt in Regionen unter ${METRICS[0].fmt(med)} pro Kopf – vor allem in Asien und Afrika. ${(()=>{ const sc=scaleOf("gdp_pc_ppp"), lu=atLevel().filter(u=>u.gdp_pc_ppp!=null&&u.pop); const top=lu.filter(u=>sc.cls(u.gdp_pc_ppp)>=5); return `In den beiden obersten Stufen leben ${pct(d3.sum(top,u=>u.pop)/WORLD.pop)} der Menschheit, sie erwirtschaften aber ${pct(d3.sum(top,u=>u.gdp_ppp||0)/WORLD.ppp)} der Weltwirtschaft.`; })()}`; }},
  {t:"Wer ist reicher als Berlin?", run(){ setView("map",true); level=2; drawLevel(); metric=METRICS[0]; selected=byId.get("DE300")||selected; thr=selected.gdp_pc_ppp; hlMode="above"; zoomTo(null); },
   text(){ const s=hlStats(); return `Nur ${pct(s.pop/WORLD.pop)} der Menschheit leben in Regionen mit höherem BIP pro Kopf als Berlin. Diese ${big(s.pop)} Menschen erwirtschaften ${pct(s.ppp/WORLD.ppp)} der Weltwirtschaft – fast alle in Nordamerika, Westeuropa, Ostasien, am Golf und in Russlands Metropolen.`; }},
  {t:"China: Küste gegen Inland", run(){ setView("map",true); level=2; drawLevel(); metric=METRICS[0]; hlMode="off"; selected=units.find(u=>u.id==="CN310000")||selected; zoomTo([[73,18],[135,54]]); },
   text(){ const sh=units.find(u=>u.id==="CN310000"), gs=byId.get("CN-GS"); const a=sh&&nearest(sh.gdp_pc_ppp,"gdp_pc_ppp"), b=gs&&nearest(gs.gdp_pc_ppp,"gdp_pc_ppp");
     return sh&&gs?`Shanghai liegt mit ${METRICS[0].fmt(sh.gdp_pc_ppp)} pro Kopf etwa auf dem Niveau von ${a.name}, die Provinz Gansu im Nordwesten mit ${METRICS[0].fmt(gs.gdp_pc_ppp)} auf dem von ${b.name}. Ein Land, zwei Welten: Der Reichtum konzentriert sich an der Ostküste.`:""; }},
  {t:"Wenn BIP täuscht", run(){ setView("map",true); level=2; drawLevel(); metric=METRICS[0]; hlMode="off"; selected=findName("Wolfsburg")||selected; zoomTo([[5.5,47.2],[15.5,55.1]]); },
   text(){ const w=findName("Wolfsburg"); const ch=byId.get("CHE");
     return w?`Wolfsburg erwirtschaftet ${METRICS[0].fmt(w.gdp_pc_ppp)} pro Kopf – mehr als die Schweiz (${METRICS[0].fmt(ch.gdp_pc_ppp)}). Der Grund: VW. Viele Beschäftigte pendeln aus dem Umland ein. Wechsle zur Kennzahl „Haushalte/Kopf“ oder zur Ebene „Metropolregionen“, und der Ausreißer verschwindet.`:""; }},
  {t:"EU: unter 75 %", run(){ setView("map",true); level=2; drawLevel(); metric=METRICS.find(m=>m.k==="eu_index"); selected=byId.get("DE300")||selected; thr=75; hlMode="below"; zoomTo([[-11,35],[33,63]]); },
   text(){ const eu=atLevel().filter(u=>u.eu_index!=null); const below=d3.sum(eu.filter(u=>u.eu_index<75),u=>u.pop), tot=d3.sum(eu,u=>u.pop);
     return `Regionen unter 75 % des EU-Durchschnitts gelten als „weniger entwickelt“ und bekommen die höchste Förderung. Auf Kreisebene trifft das hier auf ${pct(below/tot)} der EU-Bevölkerung zu – vor allem im Osten und Süden. Die offizielle Einstufung rechnet mit NUTS-2-Regionen und Dreijahresmitteln.`; }},
  {t:"Kaufkraft vor Ort", run(){ setView("map",true); level=1; drawLevel(); metric=METRICS.find(m=>m.k==="gdp_pc_rp"); hlMode="off"; selected=byId.get("USA-MS")||selected; zoomTo([[-125,24],[-66,50]]); },
   text(){ const ms=byId.get("USA-MS"), ny=byId.get("USA-NY"); if(!ms||!ms.price_index) return "Regionale Preisdaten werden noch geladen.";
     return `In Mississippi liegt das Preisniveau bei ${f0(ms.price_index)} % des US-Schnitts, in New York bei ${f0(ny.price_index)} %. Zu regionalen Preisen schrumpft der Abstand: Mississippi kommt auf ${METRICS[2].fmt(ms.gdp_pc_rp)} statt ${METRICS[0].fmt(ms.gdp_pc_ppp)} pro Kopf.`; }},
  {t:"Metropolen statt Kreise", run(){ setView("map",true); level=3; drawLevel(); metric=METRICS[0]; hlMode="off"; selected=units.find(u=>u.lv.includes(3)&&/München|Munich/.test(u.name))||selected; zoomTo([[-11,35],[33,63]]); },
   text(){ return `Kreisgrenzen trennen Städte von ihrem Umland – deshalb wirken Arbeitsorte reich und Wohnorte arm. Die Ebene „Metropolregionen“ fasst Stadt und Umland zusammen. So werden Paris, München oder New York mit der Welt vergleichbar.`; }},
];
d3.select("#stories").selectAll("button").data(STORIES).join("button").attr("type","button").attr("class","chip story").text(d=>d.t)
  .on("click",(e,d)=>{ story=d; d.run(); update(); });
document.getElementById("storyclose").onclick=()=>{ story=null; update(); };
function storyBox(){
  const box=document.getElementById("storybox"); box.hidden=!story;
  d3.selectAll("#stories .chip").attr("aria-pressed",d=>d===story);
  if(story){ document.getElementById("storytitle").textContent=story.t; document.getElementById("storytext").textContent=story.text(); }
}

function update(fromSlider){
  d3.selectAll("#metrics .chip").attr("aria-pressed",d=>d===metric);
  d3.selectAll("#levels .chip").attr("aria-pressed",(d,i)=>i===level).property("disabled",(d,i)=>!!(metric.countryOnly&&i>0));
  document.querySelectorAll("#views [data-cw]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cw===classMode));
  document.getElementById("explain").innerHTML = metric.info + ` <span>· Ebene: ${LEVEL_INFO[level]}</span>`;
  recolor(); band(fromSlider);
  if(!fromSlider){ card(); groupPanel(); lead(); storyBox(); }
  if(view==="squares") sqControls();
  writeHash();
}

document.getElementById("sub").textContent = META.subtitle;
document.getElementById("notes").innerHTML = META.notes;
readHash();
if(!selected.lv.includes(level)) level=Math.max(...selected.lv.filter(l=>l<=2));
if(thr==null) thr = selected[metric.k] ?? null;
if(window.matchMedia("(max-width:700px)").matches) document.getElementById("settings").open=false;
readTheme(); sizeCanvas(); drawLevel(); setView(view,true); update();
document.querySelectorAll("#views .chip[data-v]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===view));
let rz; window.addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>{ const w=CW; sizeCanvas(); if(w!==CW){ T=d3.zoomIdentity; d3.select(cv).call(zoom.transform,T);} sqDirty=true; squares=[]; redraw(); band(); },150);});
const onTheme=()=>{ readTheme(); recolor(); groupPanel(); };
try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme); }catch(e){}
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
window.addEventListener("hashchange",()=>{ const before=selected; if(readHash()){ drawLevel(); setView(view,true); update(); } });
</script>
