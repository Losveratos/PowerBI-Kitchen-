<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #fff; margin: 0; }
  .stage { position: relative; background: #fff; }
</style>
</head>
<body>
<script src="locales.js"></script>
<script src="visual.bundle.js"></script>
<script src="stock-data.js"></script>
  <script>
// 1.7.1 tile test: a small P&L at month grain — AC Jan–Sep, PY / PL / FC Jan–Dec
window.FLOW_ROWS = (function () {
  const M = ["2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10","2026-11","2026-12"];
  const acc = [
    { levels: ["Umsatz", "Produkt A", null], account: "A", sort: 1, sign: 1, base: 900, d: [12, -8, 5, 20, -3, 7, 9, -15, 4] },
    { levels: ["Umsatz", "Produkt B", null], account: "B", sort: 2, sign: 1, base: 300, d: [-2, 3, -1, 1, 2, -4, 1, 2, -1] },
    { levels: ["Kosten", "Material", null], account: "C", sort: 3, sign: -1, base: 500, d: [6, -2, 3, 4, -5, 2, 1, 3, -2] },
  ];
  const rows = [];
  for (const a of acc) {
    M.forEach((m, i) => {
      const pl = a.base + i * 10;
      const ac = i < 9 ? pl + a.d[i] : null;
      rows.push({ levels: a.levels, account: a.account, sort: a.sort, rowType: "Account", formulaDef: null, sign: a.sign,
        displayInvert: false, varianceInvert: false, month: m, comment: null,
        values: { ac, py: pl * 0.95, pl, fc: i < 9 ? ac : pl * 1.02 } });
    });
  }
  return rows;
})();
</script>
<script>
const Visual = PnlByDatenWG.Visual;
window.__selLog = [];
function makeSelectionMocks() {
  return {
    createSelectionManager: () => ({
      select(ids) { return Promise.resolve(Array.isArray(ids) ? ids : [ids]); },
      clear() { return Promise.resolve(); },
      showContextMenu() { return Promise.resolve({}); },
      registerOnSelectCallback() {},
      hasSelection: () => false,
      getSelectionIds: () => [],
    }),
    createSelectionIdBuilder: () => {
      const b = { col: null, idx: null };
      b.withCategory = function (cat, i) { this.col = cat && cat.source ? cat.source.displayName : null; this.idx = i; return this; };
      b.createSelectionId = function () { return { col: this.col, idx: this.idx, equals: () => false }; };
      return b;
    },
  };
}
function locMgr(locale) {
  const L = window.PNL_LOCALES || {};
  const own = L[locale] || {}; const en = L["en-US"] || {};
  return { getDisplayName: (k) => (own[k] != null ? own[k] : en[k] != null ? en[k] : k) };
}
function makeHost(locale, opts) {
  const o = opts || {};
  const host = {
    locale: locale || "de-DE",
    colorPalette: { isHighContrast: false },
    eventService: { renderingStarted(){}, renderingFinished(){}, renderingFailed(o,e){ console.error("renderfail", e); } },
    tooltipService: { enabled: () => false, show(){}, move(){}, hide(){} },
    createLocalizationManager: () => locMgr(locale || "de-DE"),
    persistProperties: () => {},
    launchUrl: () => {},
  };
  Object.assign(host, makeSelectionMocks());
  if (o.allowInteractions === false) { host.hostCapabilities = { allowInteractions: false }; }
  return host;
}
function dvRows(rows, objects) {
  const col = (role, name, vals) => ({ source: { roles: { [role]: true }, displayName: name, index: 0 }, values: vals });
  const L = (i) => rows.map(r => r.levels[i] ?? null);
  const categories = [
    col("levels", "L1", L(0)), col("levels", "L2", L(1)), col("levels", "L3", L(2)),
    col("account", "AccountID", rows.map(r => r.account)),
    col("sortOrder", "Sort", rows.map(r => r.sort)),
    col("rowType", "RowType", rows.map(r => r.rowType)),
    col("formulaDef", "Formula", rows.map(r => r.formulaDef)),
    col("signConvention", "Sign", rows.map(r => r.sign)),
    col("displayInvert", "DispInv", rows.map(r => r.displayInvert)),
    col("varianceInvert", "VarInv", rows.map(r => r.varianceInvert)),
  ];
  if (rows.some(r => r.month != null)) { categories.push(col("period", "Monat", rows.map(r => r.month))); }
  if (rows.some(r => r.comment)) { categories.push(col("comment", "Kommentar", rows.map(r => r.comment || null))); }
  const values = [
    col("ac", "AC", rows.map(r => r.values.ac ?? null)),
    col("py", "PY", rows.map(r => r.values.py ?? null)),
    col("pl", "PL", rows.map(r => r.values.pl ?? null)),
    col("fc", "FC", rows.map(r => r.values.fc ?? null)),
  ];
  if (rows.some(r => r.values.fcfy != null)) {
    values.push(col("fcFy", "FC FY", rows.map(r => r.values.fcfy ?? null)),
      col("plFy", "PL FY", rows.map(r => r.values.plfy ?? null)));
  }
  return { categorical: { categories, values }, metadata: { objects: objects || {} } };
}
// cross-highlight as the host sends it: the unfiltered query plus `highlights`
// per measure column — here: a click on one month in a column chart marks every
// row of that month (null elsewhere)
function withHighlight(d, rows, pred) {
  for (const v of d.categorical.values) {
    v.highlights = v.values.map((x, i) => (x == null || !pred(rows[i])) ? null : x);
  }
  return d;
}
window.RENDER = function (id, set, objects, w, h, opt) {
  const o = opt || {};
  const d = document.createElement("div");
  d.className = "stage"; d.id = id;
  d.style.cssText = `width:${w}px;height:${h}px;`;
  document.body.appendChild(d);
  const rows = set === "flow" ? window.FLOW_ROWS.map(r => Object.assign({}, r, { values: Object.assign({}, r.values) }))
    : window.STOCK_DEMO.rows(set, o.stockOpt);
  if (o.acZero) { rows.forEach(r => { if (r.month && r.month > o.acZero && r.values) { r.values = Object.assign({}, r.values, { ac: 0 }); } }); }
  let data = dvRows(o.noComment ? rows.map(r => Object.assign({}, r, { comment: null })) : rows, objects);
  if (o.hlMonth) { data = withHighlight(data, rows, r => r.month === o.hlMonth); }
  const v = new Visual({ element: d, host: makeHost(o.locale || "de-DE", o.host) });
  v.update({ dataViews: [data], viewport: { width: w, height: h }, type: 2, viewMode: o.viewMode });
  window.__v = window.__v || {}; window.__v[id] = v;
  return true;
};
</script>
</body>
</html>
