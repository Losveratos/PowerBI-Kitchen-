<!--
  Mega-Table-Prototyp für „P&L Statement byDatenWG" — Design-Quelle für den
  Ausbau der Tabellen-Ansicht (siehe ../SPEC-MEGATABLE.md). Kein Build, keine
  Bibliothek, keine externen Ressourcen. Bleibt im Repo.

  RENDER-WAHL: EIN SVG für die ganze Tabelle (Kopf, Zeilen, Zell-Charts, Fuß).
  Begründung:
   1. Die neuen Elemente sind zeilenübergreifend: kaskadierender Wasserfall mit
      Verbindungslinien über mehrere Zeilen, EINE Nulllinie je Spalte über den
      ganzen Block, Szenario-Unterstreichungen, Summenlinien. Mit HTML-Zellen +
      Einzel-SVG je Zelle (Bestand: deltaBarCell/deltaPinCell) müssten diese
      Linien zerstückelt und pixelgenau wieder zusammengesetzt werden.
   2. Der Bestand rendert Wasserfall (waterfall.ts) und Baum bereits D3-frei als
      SVG mit einem svgEl(tag, attrs)-Helfer — `el()` hier ist 1:1 derselbe Stil.
   3. Der Code ist dreigeteilt und einzeln übertragbar:
        (a) Rechenkern  computeAll / delta / cascade  → engine.ts-Funktionen
            (buildModel, variance, waterfall.ts-Kaskade) im Visual, NICHT neu bauen
        (b) Layout      layout()  → reine Zahlen (Spalten x/w, Zeilen y,
            Maßstab k, Achse x0, Kappung) ohne DOM außer Textmessung
        (c) Painter     paint()   → SVG-Elemente aus dem Layout-Objekt
      Will das Visual für sehr lange Statements virtualisieren, kann (b)
      unverändert bleiben und (c) je Chart-Spalte einen hohen SVG-Streifen
      neben HTML-Zahlenzellen zeichnen.

  ARCHITEKTUR DER SCHALTER: Es gibt keine Template-Sonderfälle im Renderer.
  Jede Spalte und jedes Element ist ein eigener Schalter (state); die
  Templates T01–T04/12A sind nur PRESETS dieser Schalter (PRESETS unten).
  Notation kommt aus EINER Funktion: notation(minuend, subtrahend).
-->

// ---- Zeilenrahmen ----------------------------------------------------------

function statementFrame(lbl) {

function regionFrame(subtotals) {

// ============================================================================
// 2 · Rechenkern  (im Visual: engine.ts buildModel/variance — nicht duplizieren)
// ============================================================================
const SCENS = ["PY", "PL", "AC", "FC"];
function computeAll(frame, vals) {
  const out = {};
  for (const s of SCENS) {
    const v = {};
    for (const r of frame) { if (r.kind === "acc") { v[r.id] = vals[s][r.id] ?? null; } }
    for (const r of frame) {
      if (r.kind === "sum") {
        let t = 0; for (const c of frame) { if (c.parent === r.id && c.id in v) { t += v[c.id]; } } v[r.id] = t;
      } else if (r.kind === "formula") {
        v[r.id] = r.terms.reduce((t, [id, sg]) => t + sg * v[id], 0);
      } else if (r.kind === "pct") {
        v[r.id] = v[r.den] ? v[r.num] / v[r.den] : null;
      }
    }
    out[s] = v;
  }
  return out;
}

/** Varianz einer Zeile (= engine.ts variance + %p-Fall für Margen-Zeilen). */
function delta(blk, r, min, ref) {
  const a = blk.v[min][r.id], b = blk.v[ref][r.id];
  if (a == null || b == null) { return null; }
  if (r.kind === "pct") { return { d: (a - b) * 100, p: b ? a / b - 1 : null, good: a >= b, pp: true }; }
  const d = a - b;
  return { d, p: b ? d / Math.abs(b) : null, good: (d >= 0) !== !!r.cost, impact: r.cost ? -d : d };
}

/**
 * Kaskade (Δ- oder Wert-Wasserfall): jeder Schritt beginnt am Ende des vorigen,
 * anchor-Zeilen (=) zeichnen ab der Nulllinie und setzen den Lauf neu,
 * Summen ohne Anker (− Operating expenses, Europe …) spannen über ihre Kinder.
 * Gleiche Logik wie cascadeSegments()/waterfall.ts im Visual.
 */
function cascade(rows, val) {
  const out = new Map(); const spanStart = {}; let cum = 0;
  for (const r of rows) {
    if (r.kind === "gap" || r.kind === "pct") { continue; }
    const v = val(r); if (v == null) { continue; }
    if (r.anchor) { out.set(r.id, { s: 0, e: v, type: "anchor" }); cum = v; continue; }
    if (r.kind === "sum") { out.set(r.id, { s: spanStart[r.id] ?? cum, e: cum, type: "span" }); continue; }
    if (r.parent && !(r.parent in spanStart)) { spanStart[r.parent] = cum; }
    out.set(r.id, { s: cum, e: cum + v, type: "step" }); cum += v;
  }
  return out;
}

/**
 * Ausreißer-Kappung (Pins; optional Balken) — Tukey-Zaun (Faktor 4 statt 3, s. T02A) auf |Werte|:
 *   Zaun = Q3 + 4 × (Q3 − Q1);  Kappung = größter |Wert| ≤ Zaun.
 * Alles darüber wird bis zur Kappung + Pfeilspitze gezeichnet, Zahl auf dem Stiel.
 * Abgleich mit den Referenzen: 12A (+983, +391 gekappt, +95 passt) ✓ ·
 * T02A (+16.5 passt) ✓ · T04 (+25.6 passt) ✓ · 12A mit FC (+1633/+1200/+686
 * nah beieinander → alle gekappt) ✓. T02F kappt in der Referenz bereits
 * −27.3/+26.1 (Sprung nur 1.35×) — bewusst NICHT nachgebaut, das wäre
 * Handarbeit; eine Regel, die das trifft, kappt auch T02A fälschlich.
 */
const OUTLIER = { fence: 4, minN: 8 };
function outlierCap(values) {
  const a = values.map(Math.abs).filter(x => x > 0).sort((x, y) => x - y);
  if (a.length < OUTLIER.minN) { return Infinity; }
  const q = p => { const i = (a.length - 1) * p, lo = Math.floor(i); return a[lo] + (a[Math.ceil(i)] - a[lo]) * (i - lo); };
  const fence = q(0.75) + OUTLIER.fence * (q(0.75) - q(0.25));
  const inside = a.filter(x => x <= fence);
  return inside.length === a.length ? Infinity : inside[inside.length - 1];
}

// ============================================================================
// 3 · Notations-Engine — EINE Funktion für alle Varianz-/Szenario-Elemente
// ============================================================================
/**
 * notation(minuend, subtrahend) → Zeichenvorschrift.
 *   Minuend  (AC | FC)  → FÜLLUNG:  AC voll, FC schraffiert (+ 1-px-Kontur in derselben Farbe)
 *   Subtrahend (PY | PL) → ACHSE:   PY graue Linie, PL Doppellinie
 * Dieselbe Tabelle liefert die Szenario-Kennung jedes Szenarios (Kopf- und
 * Summen-Unterstreichung, Füllung der Wert-Kaskade):
 *   AC  voll dunkel · PY voll grau · PL doppelt (Kontur) · FC schraffiert
 */
const SCENARIO_NOTATION = {
  AC: { mark: "solid", fill: "solid", tone: C.ink, toneLight: C.soft },
  FC: { mark: "hatch", fill: "hatch", tone: C.ink, toneLight: C.soft },
  PY: { mark: "gray", fill: "solid", tone: C.py, toneLight: C.pyLight, axis: "gray" },

  el("tspan", {}, t2).textContent = title[1][1];
  text(0, G.titleLineH * 2.8, title[2]);
  if (L.ds.message) { paintMessage(L, text); }
  hline(0, W, L.titleH - Math.round(G.fs * 0.6) + 0.5, C.py, 1.5);

  // ---- Kopf ------------------------------------------------------------------
  const markMid = L.markY + G.markH / 2;
  const paintMark = (kind, x, w, y) => {
    y = y ?? L.markY;
    if (kind === "solid") { rect(x, y, w, G.markH, { fill: C.ink }, gRules); }
    else if (kind === "gray") { rect(x, y, w, G.markH, { fill: C.py }, gRules); }
    else if (kind === "double") { hline(x, x + w, y + 0.5, C.ink); hline(x, x + w, y + G.markH - 0.5, C.ink); }
    else if (kind === "hatch") { rect(x + 0.5, y + 0.5, w - 1, G.markH - 1, { fill: hatch(C.ink), stroke: C.ink, sw: 0.75 }, gRules); }
    else if (kind === "rule") { hline(x, x + w, Math.round(y + G.markH / 2) + 0.5, C.ink); }
  };
  if (L.style.blockTitles) {
    for (const b of blocks) {
      const bc = cols.filter(c => c.block === b.i);
      if (!bc.length) { continue; }
      const x1 = bc[0].x, x2 = bc[bc.length - 1].x + bc[bc.length - 1].w;
      text((x1 + x2) / 2, base(L.blockTitleY, G.rowH), b.name, { anchor: "middle" });
      hline(x1, x2, L.blockTitleY + G.rowH - 0.5, C.ink);
    }
  }
  for (let i = 0; i < cols.length; i++) {
    const c = cols[i];
    const ty = base(L.colHeadY, G.rowH);
    if (c.type === "label") { if (style.headerRules) { paintMark("rule", c.x, c.w); } continue; }
    if (c.type === "value") {
      text(c.x + c.w - G.pad, ty, c.head, { anchor: "end" });
      paintMark(S.marks ? N.mark(c.scen) : "rule", c.x, c.w);
      continue;
    }
    if (c.type === "delta" && style.pairHeader && cols[i + 1] && cols[i + 1].type === "dpct" && cols[i + 1].ref === c.ref && cols[i + 1].block === c.block) {
      const n = cols[i + 1];
      text(n.x + n.w - G.pad, ty, c.head, { anchor: "end" });
      if (style.headerRules) { paintMark("rule", c.x, n.x + n.w - c.x); }
      i++; continue;
    }
    if (c.type === "delta" || c.type === "dpct") { text(c.x + c.w - G.pad, ty, c.head, { anchor: "end" }); }
    else { text(c.x + c.w / 2, ty, c.head, { anchor: "middle" }); }
    if (style.headerRules) { paintMark("rule", c.x, c.w); }
  }

  // ---- Zeilen: Linien --------------------------------------------------------
  const left = cols.length ? cols[0].x : 0;
  for (let i = 0; i < R.length; i++) {
    const { r, y, h } = R[i];
    const next = R[i + 1];
    const contiguous = next && next.y === y + h;
    if (isBold(r)) {
      if (style.continuousSumRules) { hline(left, L.tableW, y + 0.5, C.ink); }
      else { for (const c of cols) { hline(c.x, c.x + c.w, y + 0.5, C.ink); } }
    }
    if (style.rowRules && r.kind === "acc" && !(contiguous && isBold(next.r))) {
      for (const c of cols) { hline(c.x, c.x + c.w, y + h - 0.5, C.rule); }
    }
  }
  if (style.closing) {
    for (const c of cols) {
      if (c.type === "value") { paintMark(N.mark(c.scen), c.x, c.w, L.bodyBottom + 2); }
      else { hline(c.x, c.x + c.w, L.bodyBottom + 0.5, C.ink); }
    }
  }

  // ---- Zahlen ----------------------------------------------------------------
  for (const { r, y, h } of R) {
    for (const c of cols) {
      if (c.type === "label") {
        const fsx = r.kind === "pct" ? G.fsSmall : G.fs;
        const ty = base(y, h, fsx);
        if (style.signs && r.op) { text(c.x + G.pad, ty, r.op === "-" ? "-" : r.op, { bold: isBold(r) }); }
        text(c.x + G.pad + (style.signs ? G.signW : 0) + (r.level || 0) * G.indent, ty, r.label,
          { bold: isBold(r), italic: r.kind === "pct", fs: fsx });
        continue;
      }
      if (CHART_TYPES.has(c.type)) { continue; }
      const t = L.cellText(c, r);
      if (t) { text(c.x + c.w - G.pad, base(y, h, t.fs), t.t, { anchor: "end", bold: t.bold, italic: t.italic, fs: t.fs, color: t.color }); }
    }
  }

  // ---- Chart-Spalten ---------------------------------------------------------
  for (const c of L.charts) { paintChartColumn(L, c, { el, rect, text, vline, hatch, base, gCharts }); }

  // ---- Fußzeile „Δ in red if" -------------------------------------------------
  if (style.thresholds) {
    const fy = base(L.footY, G.rowH, G.fsSmall);
    const o = { italic: true, fs: G.fsSmall, color: C.soft, anchor: "end" };
    for (const b of blocks) {
      const bc = cols.filter(c => c.block === b.i);
      const firstD = bc.findIndex(c => c.type === "delta" || c.type === "dpct");
      if (firstD < 0) { continue; }
      const before = bc[firstD - 1];
      const lx = before ? before.x + before.w - G.pad : bc[firstD].x - G.groupGap;
      text(lx, fy, "Δ in red if:", o);
      for (const c of bc) {
        if (c.type === "delta") { text(c.x + c.w - G.pad, fy, "<" + num(b.th.abs, 0, false), o); }
        if (c.type === "dpct") { text(c.x + c.w - G.pad, fy, "<" + num(b.th.pct * 100, 0, false) + "%", o); }
      }
    }
  }
  return svg;
}

function paintChartColumn(L, c, h) {
  const { S, G, R, N, blocks, fmt } = L;
  const { el, rect, text, vline, hatch, base, gCharts } = h;
  const blk = blocks[c.block];
  const P = pal();
  const X = v => c.x0 + v * c.k;
  const g = el("g", {}, gCharts);
  const gAx = el("g", { "shape-rendering": "crispEdges" }, g);
  // Achse (Nulllinie) über den ganzen Block
  const y1 = L.bodyTop - Math.round(G.fs * 0.3), y2 = L.bodyBottom;
  const axisKind = c.type === "vwf" ? "value" : SCENARIO_NOTATION[c.ref].axis;
  const ax = Math.round(c.x0);
  const axisHalf = axisKind === "double" ? G.axisPLGap / 2 + 1 : axisKind === "gray" ? G.axisPY / 2 : 0.5;
  const paintAxis = () => {
    if (axisKind === "gray") { vline(ax, y1, y2, C.py, G.axisPY, gAx); }
    else if (axisKind === "double") { vline(ax - G.axisPLGap / 2 - 0.5, y1, y2, C.ink, 1, gAx); vline(ax + G.axisPLGap / 2 + 0.5, y1, y2, C.ink, 1, gAx); }
    else { vline(ax + 0.5, y1, y2, C.ink, 1, gAx); }
  };
  const label = (x, y, t, anchor, bold, halo) => {
    if (!S.barLabels) { return; }
    text(x, y, t, { anchor, bold, parent: g, halo });
  };
  const arrow = (xTip, cy, dir, hgt, fill) =>
    el("path", { d: `M${xTip},${cy} L${xTip - dir * G.arrowW},${cy - hgt / 2} L${xTip - dir * G.arrowW},${cy + hgt / 2} Z`, fill }, g);

  if (c.type === "bar" || c.type === "pin") {
    const byRow = new Map(c.vals.map(o => [o.r, o]));
    const gBars = el("g", {}, g);
    for (const { r, y, h: rh } of R) {
      const o = byRow.get(r); if (!o) { continue; }
      const cy = y + rh / 2, ty = base(y, rh);
      const v = o.v, dir = v >= 0 ? 1 : -1;
      const capped = Math.abs(v) > c.cap;
      const vv = capped ? dir * c.cap : v;
      const color = o.D.good ? P.good : P.bad;
      const bold = isBold(r);
      if (c.type === "bar") {
        const x2 = X(vv);
        const bx = Math.min(c.x0, x2), bw = Math.abs(x2 - c.x0);
        if (v !== 0) { rect(Math.round(bx * 2) / 2, cy - G.barH / 2, Math.max(bw, 1), G.barH, N.area(color, hatch), gBars); }
        if (capped) {
          arrow(x2 + dir * G.arrowW, cy, dir, G.barH + 4, color);
          label(x2 - dir * 3, ty, fmt.delta(v), dir > 0 ? "end" : "start", bold, true);
        } else {
          const lx = dir > 0 ? Math.max(x2, c.x0 + axisHalf) + G.lblGap : Math.min(x2, c.x0 - axisHalf) - G.lblGap;
          label(lx, ty, fmt.delta(v), dir > 0 ? "start" : "end", bold);
        }
      } else {
        const xh = X(vv);
        const stemEnd = capped ? xh : xh;
        el("line", { x1: c.x0, x2: stemEnd, y1: cy, y2: cy, stroke: color, "stroke-width": G.pinStem }, gBars);
        if (capped) {
          arrow(xh + dir * G.arrowW, cy, dir, G.pinHead + 2, color);
          label(xh - dir * 3, ty, fmt.pin(o.D.p), dir > 0 ? "end" : "start", bold, true);
        } else {
          const hs = G.pinHead;
          rect(xh - hs / 2, cy - hs / 2, hs, hs, N.head(hatch), gBars);
          const lx = dir > 0 ? Math.max(xh, c.x0) + hs / 2 + G.lblGap : Math.min(xh, c.x0) - hs / 2 - G.lblGap;
          label(lx, ty, fmt.pin(o.D.p), dir > 0 ? "start" : "end", bold);
        }
      }
    }
    paintAxis();
    return;
  }

  // ---- Kaskaden (Δ-Wasserfall „wf" · Wert-Kaskade „vwf") -----------------------
  paintAxis();
  const gConn = el("g", { "shape-rendering": "crispEdges" }, g);
  let last = null;          // { v, yb } — Lauf-Ende des zuletzt gezeichneten Segments
  const spanFrom = {};      // Elternsumme → { v, yb } am Beginn ihrer Kinder
  const near = (a, b) => Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(a), Math.abs(b));
  const conn = (v, ya, yb) => { if (yb - ya > 0.5) { vline(Math.round(X(v)) + 0.5, ya, yb, C.soft, 1, gConn); } };
  for (const { r, y, h: rh } of R) {
    const seg = c.casc.get(r.id); if (!seg) { continue; }
    const cy = y + rh / 2, top = cy - G.barH / 2, bot = cy + G.barH / 2, ty = base(y, rh);
    if (r.parent && !(r.parent in spanFrom) && last) { spanFrom[r.parent] = last; }
    let st, txt;
    if (c.type === "wf") {
      const D = delta(blk, r, S.min, c.ref);
      st = N.area(D.good ? pal().good : pal().bad, hatch);
      txt = fmt.delta(D.d);
    } else {
      st = N.value(c.scen, !!r.cost, hatch);
      txt = fmt.val(blk.v[c.scen][r.id]);
    }
    const xa = X(Math.min(seg.s, seg.e)), xb = X(Math.max(seg.s, seg.e));
    rect(xa, top, Math.max(xb - xa, 1), G.barH, st, g);
    // Verbindungslinien
    if (last) {
      if (seg.type === "anchor") { if (near(seg.e, last.v)) { conn(seg.e, last.yb, top); } }
      else if (seg.type === "span") {
        const sf = spanFrom[r.id];
        if (sf && near(seg.s, sf.v)) { conn(seg.s, sf.yb, top); }
        if (near(seg.e, last.v)) { conn(seg.e, last.yb, top); }
      } else if (near(seg.s, last.v)) { conn(seg.s, last.yb, top); }
    }
    last = { v: seg.e, yb: bot };
    const up = seg.e >= seg.s;
    label(up ? xb + G.lblGap : xa - G.lblGap, ty, txt, up ? "start" : "end", isBold(r));
  }
}

/** Nachrichten-Headline (12er-Serie) — aus den Daten generiert */
function paintMessage(L, text) {
  const { blocks, rows, S, G, fmt } = L;
  const ref = activeRefs(S)[0] || "PY";
  const b = blocks[0];
  const accs = rows.filter(r => r.kind === "acc").map(r => ({ r, D: delta(b, r, S.min, ref) })).filter(o => o.D);
  const best = accs.slice().sort((x, y) => y.D.impact - x.D.impact)[0];
  const opex = rows.find(r => r.id === "opex");
  const dOpex = opex ? delta(b, opex, S.min, ref) : null;
  const grp = rows.find(r => r.id === "grp");
  const dG = grp ? delta(b, grp, S.min, ref) : null;
  if (!best || !dG) { return; }
  const msg = `Compared to ${ref}, the ${dOpex && dOpex.d > 0 ? "higher" : "lower"} operating expenses (${fmt.delta(dOpex.d)} kEUR) were ` +
    `${dOpex.d > 0 ? "compensated" : "accompanied"} by ${best.r.label.toLowerCase()} (${fmt.delta(best.D.d)} kEUR), leading to a ` +
    `${dG.d >= 0 ? "higher" : "lower"} group result (${fmt.delta(dG.d)} kEUR)`;
  const x0 = Math.round(G.fs * 30);
  const words = msg.split(" "); let line = "", ln = 0;
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (tw(t, G.fs) > G.fs * 46 && line) { text(x0, G.titleLineH * (0.8 + ln), line); ln++; line = w; } else { line = t; }
  }
  text(x0, G.titleLineH * (0.8 + ln), line);
}

// ============================================================================
// 8 · Bedienleiste
// ============================================================================
const bar = document.getElementById("bar");
function seg(key, options, opts) {
  opts = opts || {};
  const wrap = document.createElement("span"); wrap.className = "ctl";
  if (opts.label) { const l = document.createElement("span"); l.className = "lbl"; l.textContent = opts.label; wrap.appendChild(l); }
  const s = document.createElement("span"); s.className = "seg";
  for (const [val, txt] of options) {
    const b = document.createElement("button");
    b.textContent = typeof txt === "function" ? txt() : txt;
    const isOn = opts.isOn ? opts.isOn(val) : state[key] === val;
    if (isOn) { b.className = "on"; }
    if (opts.disabled && opts.disabled()) { b.disabled = true; }
    b.onclick = () => { if (opts.onClick) { opts.onClick(val); } else { state[key] = val; state.preset = ""; } update(); };
    s.appendChild(b);
  }
  wrap.appendChild(s); return wrap;
}
function chk(key, label, disabled) {
  const l = document.createElement("label"); l.className = "chk" + (disabled ? " dis" : "");
  const i = document.createElement("input"); i.type = "checkbox"; i.checked = !!state[key]; i.disabled = !!disabled;
  i.dataset.key = key;
  i.onchange = () => { state[key] = i.checked; state.preset = ""; update(); };
  l.appendChild(i); l.appendChild(document.createTextNode(label)); return l;
}
function group(title, kids) {
  const g = document.createElement("span"); g.className = "grp";
  if (title) { const b = document.createElement("b"); b.textContent = title; g.appendChild(b); }
  kids.forEach(k => g.appendChild(k)); return g;
}
function buildBar() {
  bar.innerHTML = "";
  const regions = DATASETS[state.ds].kind === "regions";
  const fam = state.preset ? Object.keys(TEMPLATES).find(t => state.preset.startsWith(t)) : null;
  // Zeile 1: Presets, Daten, Szenario, Format
  const r1 = document.createElement("div"); r1.className = "row";
  r1.appendChild(seg("tpl", Object.keys(TEMPLATES).map(t => [t, t]), {
    label: "Template", isOn: t => t === fam, onClick: t => applyPreset(TEMPLATES[t]) }));
  const ps = document.createElement("select"); ps.id = "preset";
  ps.appendChild(new Option("— angepasst —", ""));
  for (const p of Object.keys(PRESETS)) { ps.appendChild(new Option(p, p)); }
  ps.value = state.preset;
  ps.onchange = () => { if (ps.value) { applyPreset(ps.value); update(); } };
  const pw = document.createElement("span"); pw.className = "ctl";
  pw.innerHTML = '<span class="lbl">Referenz</span>'; pw.appendChild(ps); r1.appendChild(pw);
  const dsSel = document.createElement("select"); dsSel.id = "ds";
  for (const k of Object.keys(DATASETS)) { dsSel.appendChild(new Option(DATASETS[k].label, k)); }
  dsSel.value = state.ds; dsSel.onchange = () => { state.ds = dsSel.value; state.preset = ""; update(); };
  const dw = document.createElement("span"); dw.className = "ctl";
  dw.innerHTML = '<span class="lbl">Daten</span>'; dw.appendChild(dsSel); r1.appendChild(dw);
  r1.appendChild(seg("min", [["AC", "AC"], ["FC", "FC"]], { label: "Minuend" }));
  const subNow = () => { const a = activeRefs(state); return a.length === 2 ? "both" : a[0] || ""; };
  r1.appendChild(seg("sub", [["PY", "nur ΔPY"], ["PL", "nur ΔPL"], ["both", "beide"]], {
    label: "Subtrahend", isOn: v => subNow() === v,
    onClick: v => {
      // Muster der aktiven Referenz übernehmen, auf die gewählte(n) Referenz(en) legen
      const src = activeRefs(state)[0] || "PL";
      const pat = Object.fromEntries(DKINDS.map(([k]) => [k, state["d" + src + k]]));
      for (const r of REFS) { const on = v === "both" || v === r; for (const [k] of DKINDS) { state["d" + r + k] = on && pat[k]; } }
      state.showPY = v !== "PL"; state.showPL = v !== "PY"; state.preset = "";
    } }));
  r1.appendChild(seg("color", [["teal", "teal"], ["ibcs", "IBCS-Grün"]], { label: "Farbe" }));
  r1.appendChild(seg("dec", [[0, "0"], [1, "1"], [2, "2"]], { label: "Dezimalen" }));
  r1.appendChild(seg("fs", [[11, "11"], [13, "13"], [15, "15"]], { label: "Schrift px" }));
  bar.appendChild(r1);
  // Zeile 2: Spalten
  const r2 = document.createElement("div"); r2.className = "row";
  r2.appendChild(group("Wertspalten", [chk("showPY", "PY"), chk("showPL", "PL"), chk("showMin", state.min), chk("valueWf", "als Wert-Kaskade (12A)")]));
  for (const r of REFS) {
    r2.appendChild(group("Δ" + r, DKINDS.map(([k, t]) => chk("d" + r + k, t.replace("Δ%", "Δ" + r + "%")))));
  }
  bar.appendChild(r2);
  // Zeile 3: Elemente, Sortierung
  const r3 = document.createElement("div"); r3.className = "row";
  r3.appendChild(group("Elemente", [
    chk("ytd", "2. Block _YTD", !regions), chk("subtotals", "Zwischensummen", !regions), chk("margins", "Margen-/%-Zeilen", regions),
    chk("thresholds", "Δ-Schwellen + Fußzeile"), chk("marks", "Szenario-Unterstreichung"), chk("barLabels", "Zahlen an Balken/Pins"),
    chk("barCap", "Ausreißer-Kappung auch für Balken")]));
  const sortOff = () => !regions;
  r3.appendChild(group("", [
    seg("sort", [["cat", "Kategorie"], ["ac", () => state.min + "↓"], ["delta", "Δ↓"]], { label: "Sortierung", disabled: sortOff }),
    seg("sortBlock", [[0, "Monat"], [1, "_YTD"]], { label: "nach Block", disabled: () => sortOff() || state.sort === "cat" || !state.ytd })]));
  bar.appendChild(r3);
}

// ============================================================================
// 9 · Ablauf
// ============================================================================
const stage = document.getElementById("stage");
let lastLayout = null;
function update() {
  writeHash();
  buildBar();
  const viewW = Math.max(760, stage.clientWidth - 34);
  const L = layout(state, viewW);
  lastLayout = L;
  stage.innerHTML = "";
  stage.appendChild(paint(L));
  // Statuszeile: abgeleitete Maße live
  const fams = Object.entries(L.famK).map(([k, v]) => {
    const [b, f] = k.split(":");
    const unit = f === "pct" ? "px/%-Pkt." : "px/Einheit";
    const cap = L.charts.find(c => String(c.block) === b && (f === "pct" ? c.type === "pin" : f === "delta" ? c.type === "bar" : false));
    return `Block ${L.blocks[b].name} · ${f}: <code>${v.toFixed(3)} ${unit}</code>` + (cap && isFinite(cap.cap) ? ` · Kappung <code>${cap.cap.toFixed(1)}</code>` : "");
  });
  document.getElementById("status").innerHTML =
    `Preset <code>${state.preset || "angepasst"}</code> · Daten <code>${L.ds.label}</code> · Notation: Minuend ${state.min} → ${state.min === "FC" ? "schraffiert" : "voll"}, ` +
    `Subtrahend ${activeRefs(state).join("+") || "–"} → ${activeRefs(state).map(r => r === "PY" ? "graue Achse" : "Doppelachse").join(" / ") || "–"} · ` +
    `Zeile ${L.G.rowH}px · Balken ${L.G.barH}px · Pin-Kopf ${L.G.pinHead}px · Tabelle ${L.tableW}px<br>` + (fams.join(" &nbsp;|&nbsp; ") || "keine Chart-Spalten");
}
function writeHash() {
  const diff = Object.keys(state).filter(k => k !== "preset" && state.preset && PRESETS[state.preset] && PRESETS[state.preset][k] !== state[k] && k !== "color" && k !== "fs");
  const parts = state.preset ? ["ref=" + state.preset] : [];
  const keys = state.preset ? diff.concat(["color", "fs"]) : Object.keys(state).filter(k => k !== "preset");
  for (const k of keys) { parts.push(k + "=" + state[k]); }
  history.replaceState(null, "", "#" + parts.join("&"));
}
function readHash() {
  const h = location.hash.slice(1); if (!h) { return; }
  const kv = Object.fromEntries(h.split("&").map(p => p.split("=")));
  if (kv.ref && PRESETS[decodeURIComponent(kv.ref)]) { applyPreset(decodeURIComponent(kv.ref)); }
  for (const [k, v] of Object.entries(kv)) {
    if (k === "ref" || !(k in state)) { continue; }
    const cur = state[k];
    state[k] = typeof cur === "boolean" ? v === "true" : typeof cur === "number" ? Number(v) : decodeURIComponent(v);
  }
}
// für Tests/Playwright
window.__mega = { state, update, applyPreset, layout: () => lastLayout, PRESETS };
readHash();
update();
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(update, 80); });
</script>
