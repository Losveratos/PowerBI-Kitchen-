<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataKitchen Gantt — Testharness</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #stage { width: 100vw; height: 100vh; }
    #log { position: fixed; bottom: 4px; left: 8px; font: 11px/1.4 ui-monospace, monospace; color: #888; pointer-events: none; z-index: 50; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="log"></div>
  <script type="module">
    import { GanttRenderer, parseVorgaenger } from './gantt.js';

    const u = (y, m, d) => Date.UTC(y, m - 1, d);
    // Demo-Daten = Referenz-Sample "BI-Rollout 2026"
    // ps/pe = Basisplan (Plan vs. Ist): Verzug bei Datenmodell/Deneb/Datenanbindung/
    // Go-Live, früher fertig bei Lastenheft, plan-treu bei Anforderungen/Test & QA
    const TASKS = [
      { key: 'Anforderungen', name: 'Anforderungen', phase: 'Konzept', s: u(2026, 1, 5), e: u(2026, 1, 16), pct: 100, st: 'Fertig', ow: 'Lena', deps: [], ps: u(2026, 1, 5), pe: u(2026, 1, 16) },
      { key: 'Lastenheft', name: 'Lastenheft', phase: 'Konzept', s: u(2026, 1, 19), e: u(2026, 1, 30), pct: 100, st: 'Fertig', ow: 'Lena', deps: ['Anforderungen'], ps: u(2026, 1, 19), pe: u(2026, 2, 2) },
      { key: 'Freigabe Konzept', name: 'Freigabe Konzept', phase: 'Konzept', s: u(2026, 2, 2), e: null, pct: null, st: null, ow: 'Lena', deps: ['Lastenheft'], ps: u(2026, 2, 2), pe: null, haupt: true },
      { key: 'Datenmodell', name: 'Datenmodell', phase: 'Umsetzung', s: u(2026, 2, 3), e: u(2026, 2, 20), pct: 80, st: 'In Arbeit', ow: 'Mika', deps: ['Freigabe Konzept'], ps: u(2026, 2, 3), pe: u(2026, 2, 16) },
      { key: 'Deneb-Visuals', name: 'Deneb-Visuals', phase: 'Umsetzung', s: u(2026, 2, 16), e: u(2026, 3, 13), pct: 45, st: 'In Arbeit', ow: 'Mika', deps: ['Datenmodell'], ps: u(2026, 2, 12), pe: u(2026, 3, 6) },
      { key: 'Datenanbindung', name: 'Datenanbindung', phase: 'Umsetzung', s: u(2026, 2, 23), e: u(2026, 3, 20), pct: 30, st: 'Blockiert', ow: 'Sara', deps: ['Datenmodell'], ps: u(2026, 2, 16), pe: u(2026, 3, 13) },
      { key: 'Test & QA', name: 'Test & QA', phase: 'Rollout', s: u(2026, 3, 23), e: u(2026, 4, 10), pct: 0, st: 'Offen', ow: 'Sara', deps: ['Deneb-Visuals', 'Datenanbindung'], ps: u(2026, 3, 23), pe: u(2026, 4, 10) },
      { key: 'Schulung', name: 'Schulung', phase: 'Rollout', s: u(2026, 4, 13), e: u(2026, 4, 24), pct: 0, st: 'Offen', ow: 'Lena', deps: ['Test & QA'] },
      { key: 'Go-Live', name: 'Go-Live', phase: 'Rollout', s: u(2026, 4, 27), e: null, pct: null, st: null, ow: 'Team', deps: ['Schulung'], ps: u(2026, 4, 20), pe: null, haupt: true },
      // haupt = Rolle "Hauptmeilenstein (Ja/Nein)". BEWUSST als letzte Zeile mit
      // mittlerem Datum: belegt, dass ?nurhaupt=1 chronologisch sortiert und
      // nicht in Datenreihenfolge.
      { key: 'Zwischenabnahme', name: 'Zwischenabnahme', phase: 'Umsetzung', s: u(2026, 3, 16), e: null, pct: null, st: null, ow: 'Mika', deps: ['Deneb-Visuals'], haupt: true }
    ];

    const log = document.getElementById('log');
    const selected = new Set();
    const r = new GanttRenderer(document.getElementById('stage'));

    const params = new URLSearchParams(location.search);
    // ?tipzeilen=dauer,wer bzw. ?zeinheiten=Tage,Monate → nur die genannten an.
    // Ohne den Parameter bleibt alles an (wie die Vorgaben im Formatbereich).
    const auswahl = (param, keys) => {
      const roh = params.get(param);
      if (roh === null) return undefined;
      const an = new Set(roh.split(',').map(x => x.trim().toLowerCase()).filter(x => x));
      return Object.fromEntries(keys.map(k => [k, an.has(k)]));
    };
    const opts = () => ({
      dark: params.get('dark') === '1',
      ibcs: params.get('ibcs') === '1',
      wochenenden: params.get('wochenenden') !== '0',
      abhaengigkeiten: params.get('deps') !== '0',
      heuteLinie: params.get('heute') !== '0',
      tabellenBreite: params.has('tw') ? Number(params.get('tw')) : 620,
      gruppenNamen: params.get('gnamen') !== '0',
      // ?txt=Vorgang|Vorhaben|Vorhaben|Paket|Pakete (Namensspalte|Projekt 1|Projekt n|Ebene 1|Ebene n)
      texte: params.has('txt') ? (([a, b, c, d, e]) => ({ spalteTask: a, projekt1: b, projektN: c, ebene1: d, ebeneN: e }))(params.get('txt').split('|')) : undefined,
      kopfzeile: params.get('kopf') !== '0',
      tooltip: params.get('tooltip') !== '0',
      tipZeilen: auswahl('tipzeilen', ['zeitraum', 'plan', 'abweichung', 'dauer', 'status', 'fortschritt', 'wer', 'abhaengigkeiten', 'planung']),
      zeiteinheiten: auswahl('zeinheiten', ['tage', 'wochen', 'monate', 'quartale', 'jahre']),
      basisplan: params.get('plan') !== '0',
      deltaSpalte: params.get('delta') !== '0',
      // 2.2: ?pleg=0 → Legende Aktuell/Basisplan aus, ?dlbl=0 → kein „Δ“ an Balken/Rauten
      basisplanLegende: params.get('pleg') !== '0',
      deltaBeschriftung: params.get('dlbl') !== '0',
      verzugZeilen: params.get('verzug') !== '0',
      statusDatum: params.has('status') ? Date.parse(params.get('status')) : (MSP ? u(2026, 3, 16) : null),
      zeiteinheit: params.get('ze') || 'auto',
      tageEinheit: params.get('u') || 't',
      msAufPhase: params.get('mskompakt') !== '0',
      msDatum: params.get('msdatum') !== '0',
      msNamen: params.get('msnamen') !== '0',
      msBeschriftung: params.get('mslabel') || 'nurDatum',
      msEndeGleichStart: params.get('msgleich') === '1',
      nurHaupt: params.get('nurhaupt') === '1',
      // --- 2.0: Planerwerkzeuge (Vorgaben wie im Formatbereich)
      startAnsicht: params.get('ansicht') || 'alle',
      knopfMeilensteine: params.get('knopfms') !== '0',
      knopfBasisplan: params.get('knopfplan') !== '0',
      kritischHervorheben: params.get('krit') !== '0',
      ueberfaelligMarkieren: params.get('ueber') !== '0',
      pufferAnzeigen: params.get('puffer') !== '0',
      stichtageAnzeigen: params.get('stich') !== '0',
      fortschrittslinie: params.get('fl') === '1',
      arbeitstage: params.get('at') === '1',
      // ?fei=… überschreibt, ?fei= (leer) schaltet die Feiertage des MSP-Samples ab
      feiertage: params.has('fei') ? params.get('fei') : (MSP ? MSP_FEI : ''),
      farbeNach: params.get('farbe') || 'zweig',
      legende: params.get('legende') !== '0',
      namenZweizeilig: params.get('zweizeilig') === '1',
      zusatzKoepfe: MSP ? ['Gewerk', 'Kosten'] : undefined,
      // ?edit=1 → Bericht im Bearbeitungsmodus (Einrichtungshilfe sichtbar), ?einr=0 schaltet sie ab.
      bearbeiten: params.get('edit') === '1',
      einrichtung: params.get('einr') !== '0',
      // ?diag=text,anzahl,limit,lueckenhaft → simuliert Befunde aus dem Einlesen (visual.ts)
      diagnose: params.has('diag') ? (() => {
        const f = new Set(params.get('diag').split(','));
        return { zeilen: DATA.length, ohneName: f.has('lueckenhaft') ? 2 : 0, ohneStart: f.has('lueckenhaft') ? 3 : 0,
          endeVorStart: f.has('lueckenhaft') ? 1 : 0, textDaten: f.has('text') ? DATA.length : 0, limitErreicht: f.has('limit'),
          fortschrittAnzahl: f.has('anzahl'), pspDoppelt: 0, nrDoppelt: 0,
          // gefiltert = Task und Start gebunden, aber keine Zeile übrig
          rollen: f.has('gefiltert') ? { task: true, start: true, end: true } : {} };
      })() : undefined,
      onVorlage: (key) => { window.__vorlage = key; log.textContent = 'vorlage: ' + key; },
      selectedKeys: selected.size ? new Set(selected) : null,
      interactionsAllowed: true,
      onSelect: (task, ev) => {
        const multi = ev.ctrlKey || ev.metaKey;
        if (!multi) selected.clear();
        if (selected.has(task.key) && multi) selected.delete(task.key);
        else selected.add(task.key);
        log.textContent = 'select: ' + [...selected].join(', ');
        r.setOptions(opts());
      },
      onSelectMany: (tasks, ev) => {
        const multi = ev.ctrlKey || ev.metaKey;
        if (!multi) selected.clear();
        tasks.forEach(t => selected.add(t.key));
        log.textContent = 'select: ' + [...selected].join(', ');
        r.setOptions(opts());
      },
      onContextMenu: (task) => { log.textContent = 'contextmenu: ' + task.key; },
      onClear: () => { selected.clear(); log.textContent = 'clear'; r.setOptions(opts()); }
    });

    // ?ebenen=1 → mehrstufige Hierarchie, Beispiel MAR-S005 aus der Anforderung.
    // path[] = Rolle "Ebenen" (Ebene 1..3). Absichtlich ungleich tief: "Netzanschluss"
    // und "Kabeltrasse" enden auf Ebene 2, der PV-Zweig geht bis Ebene 4.
    // "Gutachten" kommt zweimal mit gleichem Namen in verschiedenen Zweigen vor.
    // Zwei Sammelvorgänge: "Artenschutzgutachten …" (nur Vorgänge als Kinder) und
    // "Inbetriebnahme" (auch Meilensteine als Kinder).
    // ?msp=1 → Plan wie aus einem MS-Project-Export: KEINE Ebenen-Felder, die
    // Hierarchie kommt allein aus dem PSP-Code; Vorgänger als Nummern mit Typ und
    // Zeitabstand; Sammelvorgänge als eigene Zeilen; Stichtage; Feiertage.
    // Erwartet (Statusdatum 16.03.26, Feiertage an): kritisch = 7, 8, 9, 10, 17, 18, 19
    // — 17 NUR mit Feiertagen (Pfingstmontag 25.05.); überfällig = 4, 5;
    // Stichtag an 10 verletzt, an 5 eingehalten.
    const MSP = params.get('msp') === '1';
    const MSP_FEI = '03.04.2026, 06.04.2026, 01.05.2026, 14.05.2026, 25.05.2026';
    const msp = (nr, psp, name, s, e, pct, vg, x = {}) => ({
      key: '#' + nr, nr: String(nr), psp, name, phase: null, path: [], s, e, pct,
      st: x.st || null, ow: x.ow || '', deps: vg ? vg.split(';') : [], depRefs: vg ? parseVorgaenger(vg) : [],
      color: null, ps: x.ps ?? null, pe: x.pe ?? null, haupt: !!x.haupt,
      stichtag: x.stichtag ?? null, farbeWert: x.gewerk || null, zusatz: [x.gewerk || '', x.kosten || ''],
      kritisch: params.get('kritrolle') === '1' ? !!x.krit : undefined
    });
    const MSP_TASKS = [
      msp(1, '1', 'Vor- und Entwurfsplanung', u(2026, 1, 5), u(2026, 4, 30), null, ''),
      msp(2, '1.1', 'Kampfmittelfreiheit', u(2026, 1, 5), u(2026, 3, 6), null, ''),
      msp(3, '1.1.1', 'Antrag auf Luftbildauswertung', u(2026, 1, 5), u(2026, 1, 16), 100, '', { ow: 'Behle', gewerk: 'Genehmigung', kosten: '2.400 €' }),
      msp(4, '1.1.2', 'Luftbildauswertung durch Behörde', u(2026, 1, 19), u(2026, 3, 6), 70, '3', { ow: 'Behörde', gewerk: 'Genehmigung' }),
      msp(5, '1.1.3', 'Kampfmittelfreiheit liegt vor', u(2026, 3, 6), null, 0, '4', { haupt: true, stichtag: u(2026, 3, 13) }),
      msp(6, '1.2', 'PV-Anlage', u(2026, 2, 9), u(2026, 4, 30), null, ''),
      msp(7, '1.2.1', 'Artenschutzgutachten', u(2026, 2, 9), u(2026, 3, 20), 60, '', { ow: 'Külpmann', gewerk: 'Umwelt', kosten: '8.900 €', krit: true }),
      msp(8, '1.2.2', 'Bauantragsunterlagen erstellen', u(2026, 3, 23), u(2026, 4, 10), 0, '7', { ow: 'Külpmann', gewerk: 'Planung', krit: true }),
      msp(9, '1.2.3', 'Bauantrag einreichen', u(2026, 4, 13), u(2026, 4, 17), 0, '8EA', { ow: 'Külpmann', gewerk: 'Planung', krit: true }),
      msp(10, '1.2.4', 'Prüfung durch das Bauamt', u(2026, 4, 20), u(2026, 4, 30), 0, '9', { ow: 'Bauamt', gewerk: 'Genehmigung', stichtag: u(2026, 4, 24), krit: true }),
      msp(11, '1.3', 'Netzanschluss', u(2026, 2, 16), u(2026, 4, 24), null, ''),
      msp(12, '1.3.1', 'Netzanschluss beantragen', u(2026, 2, 16), u(2026, 3, 6), 100, '', { ow: 'Westnetz', gewerk: 'Netz' }),
      msp(13, '1.3.2', 'Netzverträglichkeitsprüfung', u(2026, 3, 9), u(2026, 4, 2), 30, '12', { ow: 'Westnetz', gewerk: 'Netz', kosten: '1.150 €' }),
      msp(14, '1.3.3', 'Zusage Netzbetreiber', u(2026, 4, 2), null, 0, '13', { haupt: true }),
      msp(15, '1.3.4', 'Trassenplanung', u(2026, 3, 16), u(2026, 4, 24), 10, '13AA+5T', { ow: 'Külpmann', gewerk: 'Netz' }),
      msp(16, '2', 'Genehmigung', u(2026, 5, 4), u(2026, 5, 29), null, ''),
      msp(17, '2.1', 'Genehmigungsverfahren', u(2026, 5, 4), u(2026, 5, 22), 0, '10;5', { ow: 'Kreis', gewerk: 'Genehmigung', krit: true }),
      msp(18, '2.2', 'Genehmigung liegt vor', u(2026, 5, 29), null, 0, '17EA+4T', { haupt: true, krit: true }),
      msp(19, '3', 'Bauausführung', u(2026, 6, 1), u(2026, 6, 30), 0, '18', { ow: 'GU', gewerk: 'Bau', kosten: '412.000 €', krit: true })
    ];

    const E1 = 'Vor- und Entwurfsplanung erstellen (P 2/3)';
    const HIER = [
      { name: 'Antrag auf Luftbildauswertung erstellen und einreichen', path: [E1, 'Kampfmittelfreiheit'], s: u(2026, 1, 7), e: u(2026, 1, 23), pct: 100, st: 'Fertig', ow: 'Behle', deps: [] },
      { name: 'Luftbildauswertung durchführen u. Bescheid erteilen (durch Behörde)', path: [E1, 'Kampfmittelfreiheit'], s: u(2026, 1, 26), e: u(2026, 3, 6), pct: 60, st: 'In Arbeit', ow: 'Behörde', deps: ['Antrag auf Luftbildauswertung erstellen und einreichen'] },
      { name: 'Kampfmittelfreiheit liegt vor', path: [E1, 'Kampfmittelfreiheit'], s: u(2026, 3, 9), e: null, pct: null, st: null, ow: '', deps: [], haupt: true },
      { name: 'Gutachten', path: [E1, 'Kampfmittelfreiheit'], s: u(2026, 2, 2), e: u(2026, 2, 13), pct: 100, st: 'Fertig', ow: 'Behle', deps: [] },
      { name: 'Artenschutzgutachten beauftragen und durchführen', path: [E1, 'PV-Anlage', 'Artenschutzgutachten beauftragen und durchführen'], s: u(2026, 2, 9), e: u(2026, 4, 3), pct: 40, st: 'In Arbeit', ow: 'Külpmann', deps: [], ps: u(2026, 2, 9), pe: u(2026, 3, 20) },
      { name: 'Erstellung Bauantragsunterlagen', path: [E1, 'PV-Anlage', 'Artenschutzgutachten beauftragen und durchführen'], s: u(2026, 3, 2), e: u(2026, 3, 27), pct: 55, st: 'In Arbeit', ow: 'Külpmann', deps: [] },
      { name: 'Einreichung Bauantragsunterlagen', path: [E1, 'PV-Anlage', 'Artenschutzgutachten beauftragen und durchführen'], s: u(2026, 3, 30), e: u(2026, 4, 10), pct: 0, st: 'Offen', ow: 'Külpmann', deps: ['Erstellung Bauantragsunterlagen'] },
      { name: 'Gutachten', path: [E1, 'PV-Anlage'], s: u(2026, 4, 13), e: u(2026, 4, 24), pct: 0, st: 'Offen', ow: 'Külpmann', deps: [] },
      { name: 'Netzanschluss beantragen', path: [E1, 'Netzanschluss'], s: u(2026, 2, 16), e: u(2026, 3, 13), pct: 20, st: 'Blockiert', ow: 'Westnetz', deps: [], ps: u(2026, 2, 16), pe: u(2026, 3, 6) },
      { name: 'Netzverträglichkeitsprüfung liegt vor', path: [E1, 'Netzanschluss'], s: u(2026, 4, 20), e: null, pct: null, st: null, ow: '', deps: [], haupt: true },
      { name: 'Kabeltrasse planen', path: [E1, 'Kabeltrasse'], s: u(2026, 3, 16), e: u(2026, 4, 17), pct: 10, st: 'Offen', ow: 'Külpmann', deps: [] },
      // Zweiter Sammelvorgang, diesmal mit MEILENSTEINEN als Kindern: "Inbetriebnahme"
      // trägt eine eigene Zeile gleichen Namens (MS-Project-Export). Erwartet wird
      // EINE Gruppenzeile mit EINEM Balken, darunter die beiden Meilenstein-Zeilen —
      // und keine zweite, namensgleiche Vorgangszeile.
      { name: 'Inbetriebnahme', path: [E1, 'PV-Anlage', 'Inbetriebnahme'], s: u(2026, 4, 27), e: u(2026, 6, 5), pct: 0, st: 'Offen', ow: 'Külpmann', deps: [] },
      { name: 'Zählersetzung beantragt', path: [E1, 'PV-Anlage', 'Inbetriebnahme'], s: u(2026, 5, 4), e: null, pct: null, st: null, ow: 'Westnetz', deps: [] },
      { name: 'Inbetriebnahme erfolgt', path: [E1, 'PV-Anlage', 'Inbetriebnahme'], s: u(2026, 6, 5), e: null, pct: null, st: null, ow: 'Team', deps: [], haupt: true },
      // ohne jede Ebene → hängt direkt unter dem Projekt (ungleich tiefe Zweige)
      { name: 'Projektabschluss', path: [], s: u(2026, 5, 15), e: null, pct: null, st: null, ow: 'Team', deps: [], haupt: true }
    ].map(t => ({
      ...t, projekt: 'MAR-S005',
      key: 'MAR-S005¦' + (t.path.length ? t.path.join('¦') + '¦' : '') + t.name,
      phase: t.path.length ? t.path[0] : null,
      color: null, ps: t.ps ?? null, pe: t.pe ?? null, haupt: t.haupt === true
    }));

    // ?proj=1 → Portfolio-Modus: Sample als zwei Projekte (zweites um 120 Tage versetzt)
    let DATA = TASKS;
    if (MSP) DATA = MSP_TASKS;
    else if (params.get('ebenen') === '1') DATA = HIER;
    else if (Number(params.get('nproj')) > 1) {
      // ?nproj=5 → Portfolio aus n Projekten (je 45 Tage versetzt), alle mit
      // Basisplan; Projekt k läuft k·3 Tage hinter seinem Basisplan her
      const n = Number(params.get('nproj'));
      const namen = ['PV-Anlage Bottrop', 'Speicher Gladbeck', 'Wind Hünxe', 'PV-Park Dorsten', 'Netzanschluss Marl', 'Wind Kirchhellen', 'PV Haltern'];
      DATA = [];
      for (let k = 0; k < n; k++) {
        const ds = k * 45 * 86400000, verzug = k * 3 * 86400000, pfx = 'P' + k + ':';
        TASKS.forEach(t => DATA.push({
          ...t, projekt: namen[k % namen.length], key: pfx + t.key, deps: t.deps.map(d => pfx + d),
          s: t.s + ds + verzug, e: t.e === null ? null : t.e + ds + verzug,
          ps: (t.ps ?? t.s) + ds, pe: t.e === null ? null : (t.pe ?? t.e) + ds
        }));
      }
    }
    else if (params.get('proj') === '1') {
      const shift = 120 * 86400000;
      const clone = (t, pfx, projekt, ds) => ({
        ...t, projekt, key: pfx + t.key, deps: t.deps.map(d => pfx + d),
        s: t.s + ds, e: t.e === null ? null : t.e + ds,
        ps: t.ps === undefined || t.ps === null ? t.ps : t.ps + ds,
        pe: t.pe === undefined || t.pe === null ? t.pe : t.pe + ds
      });
      DATA = [
        ...TASKS.map(t => clone(t, 'A:', 'PV-Anlage Bottrop', 0)),
        ...TASKS.map(t => clone(t, 'B:', 'Speicher Gladbeck', shift))
      ];
    }
    // ?leer=1 → keine Daten (Startseite mit Checkliste)
    if (params.get('leer') === '1') DATA = [];
    r.setData(DATA);
    r.setOptions(opts());
    window.__gantt = r; // für Debug-Zugriff
    // ?aus=meilensteine,basisplan → Leser-Knöpfe der Leiste nach dem ersten Bild drücken
    if (params.has('aus')) setTimeout(() => {
      params.get('aus').split(',').forEach(k => {
        const b = document.querySelector('[data-knopf="' + k.trim() + '"]');
        if (b) b.dispatchEvent(new MouseEvent('mousedown', { button: 0, bubbles: true }));
        log.textContent = 'aus: ' + params.get('aus') + (b ? '' : ' (Knopf fehlt)');
      });
    }, 150);
    // ?tip=<Vorgangsname> → Tooltip des ersten passenden Balkens im Chart öffnen (für Screenshots)
    if (params.has('tip')) setTimeout(() => {
      const el = [...(r.chartArea || document).querySelectorAll('[data-task]')].find(e => e.getAttribute('data-task').endsWith(params.get('tip')));
      if (!el) return;
      const b = el.getBoundingClientRect();
      el.dispatchEvent(new MouseEvent('mouseenter', { clientX: b.left + b.width / 2, clientY: b.top + b.height / 2 }));
    }, 300);
  </script>
</body>
</html>
