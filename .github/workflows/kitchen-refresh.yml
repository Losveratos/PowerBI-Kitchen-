name: Kitchen — Video-Refresh (Fetch)

# Holt die Daten für den kitchen-update-Skill auf einem GitHub-Runner
# (die Claude-Sandbox erreicht YouTube nicht durch den Egress-Proxy).
# Ergebnis landet auf dem Daten-Branch `kitchen-refresh-data` (refresh/)
# und zusätzlich als Artifact. Die Klassifizierung + das Einpflegen in
# die HTML-Dateien macht danach der Skill — nicht dieser Workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Bestehende Episoden extrahieren
        run: node scripts/extract_existing.js

      - name: Channel-Listen holen (Videos, Shorts, Live)
        # Die Live-Formate (BI Thinkers Talk, GxP Talk) stehen nur im Tab /streams.
        run: |
          for t in videos shorts streams; do
            yt-dlp --flat-playlist --dump-single-json --skip-download \
              "https://www.youtube.com/@Daten-WG/$t" > _ch_$t.json || echo "WARN: Tab $t nicht abrufbar"
          done
          cp _ch_videos.json _channel_fresh.json

      - name: Neue Videos ermitteln
        run: node scripts/kitchen_diff.js _ch_videos.json _ch_shorts.json _ch_streams.json

      - name: Vollinfo für neue Videos holen
        run: |
          mkdir -p refresh/videos
          cp _channel_fresh.json refresh/channel_fresh.json
          cp _ch_shorts.json refresh/channel_shorts.json 2>/dev/null || true
          cp _ch_streams.json refresh/channel_streams.json 2>/dev/null || true
          cp _new_ids.txt refresh/new_ids.txt
          if [ -s _new_ids.txt ]; then
            while read -r id; do
              [ -n "$id" ] || continue
              yt-dlp --skip-download --write-info-json --no-write-thumbnail \
                --sleep-requests 1 -o "refresh/videos/%(id)s.%(ext)s" \
                "https://www.youtube.com/watch?v=$id" \
              || yt-dlp --extractor-args "youtube:player_client=mweb" --ignore-no-formats-error \
                --skip-download --write-info-json --no-write-thumbnail --sleep-requests 3 \
                -o "refresh/videos/%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$id" \
              || echo "WARN: Vollinfo fuer $id fehlgeschlagen"
            done < _new_ids.txt
          else
            echo "Keine neuen Videos — refresh/ enthaelt nur die Channel-Liste."
          fi

      - name: RSS-Feed holen (Fallback für Beschreibungen/Datum)
        # Einzelne watch-Seiten scheitern auf Runner-IPs oft am YouTube-
        # Bot-Check; der RSS-Feed (letzte ~15 Videos inkl. Beschreibung
        # und Veröffentlichungsdatum) ist ohne Cookies erreichbar.
        run: |
          CH=$(node -e 'const d=require("./_channel_fresh.json"); console.log(d.channel_id || d.uploader_id || "")')
          echo "channel_id: $CH"
          if [ -n "$CH" ]; then
            curl -sf "https://www.youtube.com/feeds/videos.xml?channel_id=$CH" -o refresh/feed.xml \
              || echo "WARN: RSS-Feed nicht erreichbar"
          fi

      - name: Daten-Branch veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan kitchen-refresh-data
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name refresh ! -name .git -exec rm -rf {} +
          git add -f refresh
          git commit -m "Kitchen-Refresh-Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin kitchen-refresh-data

      - uses: actions/upload-artifact@v4
        with:
          name: kitchen-refresh
          path: refresh/
