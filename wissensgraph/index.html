<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DatenWG Library · Knowledge Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF5;--bg-card:#FFFFFF;--bg-soft:#F4F1E8;--ink:#1A1A1A;--ink-soft:#4A4A4A;--ink-mute:#6B6B6B;
  --line:#E6E2D6;--accent:#117865;--accent-soft:#E3F2ED;--accent-warm:#C25A2D;
  --c-update:#C25A2D;--c-fabric:#1E3A5F;--c-model:#2A857A;--c-gov:#8B2E2E;--c-viz:#5C2E2E;--c-pbi:#166088;
  --c-career:#B8336A;--c-strategy:#5B3B7A;--c-event:#B8860B;
  --n-topic:#2A857A;--n-tool:#166088;--n-person:#B8336A;--n-bucket:#B8860B;--n-org:#5B3B7A;--n-page:#4A4A4A;
  --serif:'Fraunces',Georgia,serif;--sans:'Geist',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(10,10,10,.04),0 2px 8px rgba(10,10,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--bg-card);position:sticky;top:0;z-index:5}
header h1{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;white-space:nowrap}
header h1 em{font-style:italic;color:var(--accent)}
header h1 a{color:inherit;text-decoration:none}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink-mute)}
.searchbox{position:relative;flex:1;max-width:520px}
.searchbox input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg)}
.suggest{position:absolute;left:0;right:0;top:100%;background:var(--bg-card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-top:4px;max-height:360px;overflow:auto;display:none;z-index:6}
.suggest a{display:flex;gap:8px;align-items:center;padding:8px 12px;color:var(--ink);border-bottom:1px solid var(--line)}
.suggest a:hover,.suggest a.hot{background:var(--accent-soft);text-decoration:none}
.suggest .k{font-family:var(--mono);font-size:10px;color:var(--ink-mute);margin-left:auto;white-space:nowrap}
.hdr-links{margin-left:auto;display:flex;gap:14px;font-size:13px;white-space:nowrap}
main{display:grid;grid-template-columns:290px 1fr;min-height:calc(100% - 56px)}
nav.tree{border-right:1px solid var(--line);background:var(--bg-card);padding:14px 12px 30px;overflow:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
h3.nav{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer;background:var(--bg);user-select:none;color:var(--ink)}
.chip.on{color:#fff;border-color:transparent;background:var(--ink)}
a.chip:hover{text-decoration:none;border-color:var(--accent);color:var(--accent)}
a.chip.on:hover{color:#fff}
.tree details{margin:2px 0}
.tree summary{cursor:pointer;padding:5px 6px;border-radius:6px;font-weight:500;display:flex;align-items:center;gap:6px;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'▸';font-size:10px;color:var(--ink-mute);width:10px}
.tree details[open]>summary::before{content:'▾'}
.tree summary:hover{background:var(--bg-soft)}
.tree .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tree .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-mute)}
.tree ul{list-style:none;margin:0;padding:0 0 0 14px}
.tree li a{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;color:var(--ink);font-size:13px}
.tree li a:hover{background:var(--bg-soft);text-decoration:none}
.tree li a.cur{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tree li a .cnt{margin-left:auto}
.tree .more{font-size:11px;color:var(--ink-mute);padding:2px 6px;cursor:pointer}
article{padding:22px 34px 60px;max-width:1080px}
.crumbs{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-bottom:10px}
.crumbs a{color:var(--ink-mute)}
h1.title{font-family:var(--serif);font-weight:600;font-size:34px;margin:0 0 6px;line-height:1.1}
h1.title small{font-family:var(--mono);font-size:11px;font-weight:400;color:#fff;padding:2px 8px;border-radius:4px;vertical-align:middle;margin-left:8px}
.lead{font-size:16px;color:var(--ink-soft);line-height:1.55;max-width:70ch;margin:8px 0 12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink-soft)}
.kpi b{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600}
h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:28px 0 10px}
h2 .sub{font-family:var(--mono);font-size:11px;color:var(--ink-mute);font-weight:400;margin-left:8px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.card{flex:0 0 250px;scroll-snap-align:start;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;color:var(--ink);transition:border-color .15s}
.card:hover{border-color:var(--accent);text-decoration:none}
.card .name{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2}
.card .w{font-family:var(--mono);font-size:10px;color:var(--ink-mute)}
.card .q{font-size:12.5px;color:var(--ink-soft);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.doc{flex-basis:280px;padding:0;overflow:hidden}
.card.doc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--bg-soft)}
.card.doc .ph{width:100%;aspect-ratio:16/9;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--ink-mute)}
.card.doc .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.card.doc .name{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid .card{flex-basis:auto}
.badge{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg-soft);color:var(--ink-soft);margin-left:6px}
.badge.ex{background:var(--accent-soft);color:var(--accent)}
.badge.host{background:#FBE7EF;color:var(--n-person)}
.badge.type{color:#fff}
.badge.Topic{background:var(--n-topic)}.badge.Tool{background:var(--n-tool)}.badge.Person{background:var(--n-person)}
.badge.Bucket{background:var(--n-bucket)}.badge.Organization{background:var(--n-org)}.badge.page{background:var(--n-page);color:#fff}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg{margin:6px 0 10px;padding:9px 12px;border-left:3px solid var(--line);background:var(--bg-card);border:1px solid var(--line);border-left-width:3px;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5}
.seg.claim{border-left-color:var(--accent)}
.seg .ts{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none;margin-right:6px;white-space:nowrap}
.seg .h{font-family:var(--mono);font-size:10px;color:var(--ink-mute);display:block;margin-bottom:3px}
.seg mark{background:#FFE9A8;padding:0 1px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .t{font-weight:500;color:var(--ink)}
.list .m{font-family:var(--mono);font-size:11px;color:var(--ink-mute);margin-top:2px}
.btn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;background:var(--bg-card);margin:4px 6px 0 0;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.spark{display:flex;align-items:flex-end;gap:2px;height:46px;margin:6px 0 4px}
.spark div{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-width:3px;position:relative}
.spark div:hover{opacity:1}
.spark-x{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-mute)}
.gql{font-family:var(--mono);font-size:11px;background:#0F1E2E;color:#DCE6EE;padding:10px 12px;border-radius:8px;white-space:pre-wrap;margin:8px 0 12px;line-height:1.5}
.gql .k{color:#8FD3C4}
.empty{color:var(--ink-mute);font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.legend{font-family:var(--mono);font-size:10px;color:var(--ink-mute);display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}
@media (max-width:900px){main{grid-template-columns:1fr}nav.tree{position:static;height:auto;max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}article{padding:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1><a href="#">DatenWG <em>Library</em></a></h1>
  <div class="searchbox"><input id="q" type="search" placeholder="Thema, Person, Folge oder Volltext … " autocomplete="off"><div class="suggest" id="suggest"></div></div>
  <div class="hdr-links"><a id="graph-link" href="graph.html">Graph-Sicht</a><a href="../index.html">← Kitchen</a></div>
</header>
<main>
  <nav class="tree" id="tree"></nav>
  <article id="page"><p class="empty">lädt …</p></article>
</main>

<script>
const DATA = 'data/';
const BUCKET_COLOR = {'bucket-1':'var(--c-update)','bucket-2':'var(--c-fabric)','bucket-3':'var(--c-model)','bucket-4':'var(--c-gov)','bucket-5':'var(--c-viz)','bucket-6':'var(--c-pbi)','bucket-7':'var(--c-career)','bucket-8':'var(--c-strategy)','bucket-9':'var(--c-event)'};
const TYPE_COLOR = {Topic:'var(--n-topic)',Tool:'var(--n-tool)',Person:'var(--n-person)',Bucket:'var(--n-bucket)',Organization:'var(--n-org)'};
const TYPE_DE = {Topic:'Thema',Tool:'Tool',Person:'Person',Bucket:'Bucket',Organization:'Organisation'};
const KIND = {fact:'Fakt', opinion:'Meinung', recommendation:'Empfehlung', warning:'Warnung'};
const REL = {RECOMMENDS:'empfiehlt', CONTRASTS:'steht im Gegensatz zu', REQUIRES:'setzt voraus', REPLACES:'ersetzt', PART_OF:'ist Teil von'};
let G, byId, segs = null, segsByDoc = null, timeRange = 'all', sources = new Set(['youtube','markdown']), dcCache = null, current = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtT = s => { s = Math.floor(s || 0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0'); };
const fmtD = d => d ? new Date(d).toLocaleDateString('de-DE', {year:'numeric', month:'short'}) : '';
const isDoc = n => n && n.type === 'Document';
const deepLink = (doc, s, heading) => { if (doc.source === 'youtube' && s != null) return doc.url + '&t=' + Math.floor(s) + 's'; if (doc.source !== 'youtube' && heading) return doc.url + '#:~:text=' + encodeURIComponent(heading.replace(/[.,;:!?]+$/, '').slice(0, 80)); return doc.url || '#'; };
const thumb = d => d.ytId ? `https://i.ytimg.com/vi/${d.ytId}/mqdefault.jpg` : null;
const href = (id, extra) => '#' + new URLSearchParams(Object.assign({n: id}, timeRange !== 'all' ? {t: timeRange} : {}, sources.size !== 2 ? {s: [...sources].join(',')} : {}, extra || {})).toString();
const nodeA = (n, cls) => `<a class="${cls || ''}" href="${href(n.id)}">${esc(n.name)}</a>`;

fetch(DATA + 'graph.json').then(r => r.json()).then(g => {
  G = g; byId = new Map(g.nodes.map(n => [n.id, n]));
  G.docs = g.nodes.filter(isDoc); G.claims = g.nodes.filter(n => n.type === 'Claim');
  G.concepts = g.nodes.filter(n => ['Topic','Tool','Person','Organization'].includes(n.type));
  G.out = new Map(); G.in = new Map();
  for (const e of g.edges) { (G.out.get(e.s) || G.out.set(e.s, []).get(e.s)).push(e); (G.in.get(e.t) || G.in.set(e.t, []).get(e.t)).push(e); }
  window.addEventListener('hashchange', route);
  route();
});

// ---------- Filter ----------
function docActive(d) {
  if (!d || !sources.has(d.source)) return false;
  if (timeRange === 'all' || !d.published) return timeRange === 'all' || !d.published;
  const p = new Date(d.published), now = new Date();
  if (timeRange === 'm3') return (now - p) / 864e5 <= 92;
  if (timeRange === 'm12') return (now - p) / 864e5 <= 366;
  if (timeRange === '2024') return p.getFullYear() <= 2024;
  return String(p.getFullYear()) === timeRange;
}
function docCount(nid) {
  if (!dcCache) dcCache = new Map();
  if (dcCache.has(nid)) return dcCache.get(nid);
  const n = byId.get(nid); let c = 0;
  if (n.type === 'Person') c = (G.out.get(nid) || []).filter(e => e.type === 'SPEAKS_IN' && docActive(byId.get(e.t))).length;
  else if (n.type === 'Bucket') c = (G.in.get(nid) || []).filter(e => e.type === 'IN_BUCKET' && docActive(byId.get(e.s))).length;
  else c = (G.in.get(nid) || []).filter(e => e.type === 'MENTIONS' && isDoc(byId.get(e.s)) && docActive(byId.get(e.s))).length;
  dcCache.set(nid, c); return c;
}
function speakers(docId) { return (G.in.get(docId) || []).filter(e => e.type === 'SPEAKS_IN').map(e => ({p: byId.get(e.s), role: e.role})).filter(x => x.p); }
function neighbourDocs(nid) {
  const n = byId.get(nid);
  if (n.type === 'Person') return (G.out.get(nid) || []).filter(e => e.type === 'SPEAKS_IN').map(e => ({doc: byId.get(e.t), e, role: e.role})).filter(x => x.doc && docActive(x.doc)).sort((a, b) => (b.doc.published || '').localeCompare(a.doc.published || ''));
  if (n.type === 'Bucket') return (G.in.get(nid) || []).filter(e => e.type === 'IN_BUCKET').map(e => ({doc: byId.get(e.s), e})).filter(x => x.doc && docActive(x.doc)).sort((a, b) => (b.doc.published || '').localeCompare(a.doc.published || ''));
  return (G.in.get(nid) || []).filter(e => e.type === 'MENTIONS').map(e => ({doc: byId.get(e.s), e})).filter(x => x.doc && docActive(x.doc)).sort((a, b) => (b.e.share || 0) - (a.e.share || 0));
}
function related(nid, limit) {
  return [...(G.out.get(nid) || []), ...(G.in.get(nid) || [])].filter(e => e.type === 'RELATES_TO').map(e => ({o: byId.get(e.s === nid ? e.t : e.s), w: e.w})).filter(x => x.o).sort((a, b) => b.w - a.w).slice(0, limit || 12);
}
function claimsOf(nid) { return (G.in.get(nid) || []).filter(e => e.type === 'ABOUT').map(e => byId.get(e.s)).filter(c => c && docActive(byId.get(c.doc))); }
function bucketOfConcept(nid) {   // stärkster Bucket eines Konzepts nach Dokumentanteil
  const acc = new Map();
  for (const x of neighbourDocs(nid)) { const b = x.doc.bucket; if (b) acc.set(b, (acc.get(b) || 0) + (x.e.share || 0)); }
  return [...acc.entries()].sort((a, b) => b[1] - a[1])[0]?.[0];
}
async function ensureSegs() {
  if (segs) return;
  segs = await (await fetch(DATA + 'segments.json')).json();
  segsByDoc = new Map();
  for (const s of segs) (segsByDoc.get(s.d) || segsByDoc.set(s.d, []).get(s.d)).push(s);
}

// ---------- Routing ----------
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  const t = p.get('t') || 'all', s = p.get('s');
  if (t !== timeRange) { timeRange = t; dcCache = null; }
  const ns = new Set(s ? s.split(',') : ['youtube','markdown']);
  if ([...ns].join() !== [...sources].join()) { sources = ns; dcCache = null; }
  const id = p.get('n'), ask = p.get('ask'), q = p.get('q');
  current = id || null;
  renderTree();
  $('#graph-link').href = 'graph.html' + (id ? '#' + new URLSearchParams({n: id, ...(timeRange !== 'all' ? {t: timeRange} : {})}).toString() : '');
  if (ask) return renderAsk(ask, p.get('a') || '', p.get('b') || '', p.get('p') || '');
  if (q) return renderSearch(q);
  const n = id && byId.get(id);
  if (!n) return renderStart();
  if (isDoc(n)) return renderDoc(n);
  if (n.type === 'Bucket') return renderBucket(n);
  renderConcept(n);
  window.scrollTo(0, 0);
}
function setFilter(kind, v) {
  const p = new URLSearchParams(location.hash.slice(1));
  if (kind === 't') { if (v === 'all') p.delete('t'); else p.set('t', v); }
  if (kind === 's') { const ns = new Set(sources); ns.has(v) ? ns.delete(v) : ns.add(v); if (ns.size === 2 || ns.size === 0) p.delete('s'); else p.set('s', [...ns].join(',')); }
  location.hash = p.toString();
}

// ---------- Baum ----------
const treeOpen = new Set();
function renderTree() {
  const el = $('#tree');
  const cur = current ? byId.get(current) : null;
  const curBucket = cur ? (cur.type === 'Bucket' ? cur.id : isDoc(cur) ? (cur.bucket ? 'bucket:' + cur.bucket : null) : cur.type === 'Person' ? null : 'bucket:' + (bucketOfConcept(cur.id) || '')) : null;
  if (curBucket) treeOpen.add(curBucket);
  let h = `<h3 class="nav">Zeitraum</h3><div class="chips">${[['all','Alle'],['m3','3 Monate'],['m12','12 Monate'],['2026','2026'],['2025','2025'],['2024','≤ 2024']].map(([k, l]) => `<span class="chip${timeRange === k ? ' on' : ''}" data-t="${k}">${l}</span>`).join('')}</div>`;
  h += `<h3 class="nav">Quellen</h3><div class="chips"><span class="chip${sources.has('youtube') ? ' on' : ''}" data-s="youtube">Folgen</span><span class="chip${sources.has('markdown') ? ' on' : ''}" data-s="markdown">Seiten</span></div>`;
  h += `<h3 class="nav">Themenbereiche</h3>`;
  const buckets = G.nodes.filter(n => n.type === 'Bucket').sort((a, b) => a.id.localeCompare(b.id));
  for (const b of buckets) {
    const docs = neighbourDocs(b.id).map(x => x.doc);
    const acc = new Map();
    for (const d of docs) for (const e of (G.out.get(d.id) || [])) if (e.type === 'MENTIONS' && (e.share || 0) >= 0.08) { const n = byId.get(e.t); if (n && (n.type === 'Topic' || n.type === 'Tool')) acc.set(e.t, (acc.get(e.t) || 0) + 1); }
    const concepts = [...acc.entries()].sort((a, b) => b[1] - a[1]);
    const open = treeOpen.has(b.id);
    const showAll = treeOpen.has(b.id + ':all');
    h += `<details data-id="${esc(b.id)}"${open ? ' open' : ''}><summary><span class="dot" style="background:${BUCKET_COLOR[b.bucket] || '#888'}"></span><a href="${href(b.id)}" style="color:inherit">${esc(b.name)}</a><span class="cnt">${docs.length}</span></summary><ul>`;
    h += concepts.slice(0, showAll ? 40 : 8).map(([cid, c]) => { const n = byId.get(cid); return `<li><a href="${href(cid)}" class="${cid === current ? 'cur' : ''}"><span class="dot" style="background:${TYPE_COLOR[n.type]}"></span>${esc(n.name)}<span class="cnt">${c}</span></a></li>`; }).join('');
    if (concepts.length > 8 && !showAll) h += `<li><span class="more" data-more="${esc(b.id)}">… ${concepts.length - 8} weitere</span></li>`;
    h += `</ul></details>`;
  }
  const persons = G.nodes.filter(n => n.type === 'Person').map(n => [n, docCount(n.id)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
  h += `<details data-id="persons"${treeOpen.has('persons') || (cur && cur.type === 'Person') ? ' open' : ''}><summary><span class="dot" style="background:var(--n-person)"></span>Personen<span class="cnt">${persons.length}</span></summary><ul>${persons.map(([n, c]) => `<li><a href="${href(n.id)}" class="${n.id === current ? 'cur' : ''}">${esc(n.name)}<span class="cnt">${c}</span></a></li>`).join('')}</ul></details>`;
  const pages = G.docs.filter(d => d.source === 'markdown' && docActive(d)).sort((a, b) => a.name.localeCompare(b.name, 'de'));
  h += `<details data-id="pages"${treeOpen.has('pages') || (cur && cur.source === 'markdown') ? ' open' : ''}><summary><span class="dot" style="background:var(--n-page)"></span>Seiten der Kitchen<span class="cnt">${pages.length}</span></summary><ul>${pages.map(d => `<li><a href="${href(d.id)}" class="${d.id === current ? 'cur' : ''}">${esc(d.name.length > 34 ? d.name.slice(0, 33) + '…' : d.name)}</a></li>`).join('')}</ul></details>`;
  h += `<div class="legend"><span style="--c:var(--n-topic)">Thema</span><span style="--c:var(--n-tool)">Tool</span><span style="--c:var(--n-person)">Person</span><span style="--c:var(--n-page)">Seite</span></div>`;
  el.innerHTML = h;
  el.querySelectorAll('.chip[data-t]').forEach(c => c.onclick = () => setFilter('t', c.dataset.t));
  el.querySelectorAll('.chip[data-s]').forEach(c => c.onclick = () => setFilter('s', c.dataset.s));
  el.querySelectorAll('details').forEach(d => d.addEventListener('toggle', () => { d.open ? treeOpen.add(d.dataset.id) : treeOpen.delete(d.dataset.id); }));
  el.querySelectorAll('.more').forEach(m => m.onclick = () => { treeOpen.add(m.dataset.more + ':all'); renderTree(); });
  const c = el.querySelector('a.cur'); if (c) c.scrollIntoView({block: 'nearest'});
}

// ---------- Bausteine ----------
function docCard(d, e, opts) {
  opts = opts || {};
  const sp = speakers(d.id).map(x => x.p.name).join(', ');
  const img = thumb(d) ? `<img loading="lazy" src="${thumb(d)}" alt="">` : `<div class="ph">📄</div>`;
  const first = opts.firstSeg;
  return `<a class="card doc" href="${href(d.id)}">${img}<div class="body"><div class="name">${esc(d.name)}</div><div class="w">${esc(sp || d.guest || (d.source === 'markdown' ? 'Kitchen-Seite' : 'Solo'))} · ${fmtD(d.published)}${e && e.share != null ? ' · ' + Math.round(e.share * 100) + ' %' : ''}${opts.explains ? ' · erklärt' : ''}</div>${first ? `<div class="q">${esc(first)}</div>` : ''}</div></a>`;
}
function conceptCard(n, w, claim) {
  return `<a class="card" href="${href(n.id)}" style="border-top:3px solid ${TYPE_COLOR[n.type]}"><div class="name">${esc(n.name)}</div><div class="w">${TYPE_DE[n.type]} · ${docCount(n.id)} Dokumente${w ? ' · ' + w + ' gemeinsame Segmente' : ''}</div>${claim ? `<div class="q">${esc(claim)}</div>` : ''}</a>`;
}
function claimHtml(c) {
  const d = byId.get(c.doc);
  const ts = d && c.start_s != null ? `<a class="ts" target="_blank" rel="noopener" href="${deepLink(d, c.start_s)}">▶ ${fmtT(c.start_s)}</a>` : '';
  return `<div class="seg claim"><span class="h">${KIND[c.kind] || c.kind}${d ? ' · ' + fmtD(d.published) + ' · <a href="' + href(d.id) + '">' + esc(d.name) + '</a>' : ''}</span>${ts}${esc(c.name)}</div>`;
}
function segHtml(doc, s, terms) {
  terms = terms || [];
  let raw = s.t;
  if (terms.length && raw.length > 420) { const i = raw.toLowerCase().indexOf(terms[0].toLowerCase()); const a = Math.max(0, (i < 0 ? 0 : i) - 160); raw = (a > 0 ? '… ' : '') + raw.slice(a, a + 400) + ' …'; }
  else if (raw.length > 420) raw = raw.slice(0, 400) + ' …';
  let t = linkUrls(esc(raw));
  for (const term of terms) { const rx = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'ig'); t = t.replace(rx, '<mark>$1</mark>'); }
  const ts = s.s != null ? `<a class="ts" target="_blank" rel="noopener" href="${deepLink(doc, s.s)}">▶ ${fmtT(s.s)}</a>` : `<a class="ts" target="_blank" rel="noopener" href="${deepLink(doc, null, s.h)}">📄 ${s.h ? 'Abschnitt' : 'Seite'}</a>`;
  return `<div class="seg">${s.h ? `<span class="h">${esc(s.h)}</span>` : ''}${ts}${t}</div>`;
}
// URLs im Text anklickbar machen (Text ist bereits HTML-escaped)
const linkUrls = t => t.replace(/(https?:\/\/[^\s<>"']+?)([.,;:)!?]*)(?=\s|$|&lt;|<)/g, (m, u, tail) => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, '')}</a>${tail}`);
function claimsSection(claims, title) {
  if (!claims.length) return '';
  const kinds = ['fact','opinion','recommendation','warning'].filter(k => claims.some(c => c.kind === k));
  return `<h2>${title || 'Kernaussagen'}<span class="sub">${claims.length} · maschinell extrahiert, mit Sprungmarke</span></h2><div class="tabs">${['all', ...kinds].map(k => `<span class="chip${k === 'all' ? ' on' : ''}" data-kind="${k}">${k === 'all' ? 'Alle' : KIND[k]} <span class="cnt">${k === 'all' ? claims.length : claims.filter(c => c.kind === k).length}</span></span>`).join('')}</div><div id="claims">${claims.slice(0, 40).map(claimHtml).join('')}</div>`;
}
function bindClaims(claims) {
  document.querySelectorAll('.tabs .chip[data-kind]').forEach(c => c.onclick = () => { document.querySelectorAll('.tabs .chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); const k = c.dataset.kind; $('#claims').innerHTML = claims.filter(x => k === 'all' || x.kind === k).slice(0, 60).map(claimHtml).join(''); });
}
function sparkline(nid) {
  const docs = neighbourDocs(nid).map(x => x.doc).filter(d => d.published);
  if (docs.length < 2) return '';
  const byM = new Map(); for (const d of docs) { const k = d.published.slice(0, 7); byM.set(k, (byM.get(k) || 0) + 1); }
  const keys = [...byM.keys()].sort(); const [y0, m0] = keys[0].split('-').map(Number); const end = keys[keys.length - 1];
  const months = []; let y = y0, m = m0; while (true) { const k = `${y}-${String(m).padStart(2, '0')}`; months.push(k); if (k >= end) break; m++; if (m > 12) { m = 1; y++; } }
  const max = Math.max(...byM.values());
  return `<h2>Zeitverlauf<span class="sub">Dokumente pro Monat</span></h2><div class="spark">${months.map(k => `<div style="height:${Math.max(4, 100 * (byM.get(k) || 0) / max)}%" title="${k}: ${byM.get(k) || 0}"></div>`).join('')}</div><div class="spark-x"><span>${months[0]}</span><span>${months[months.length - 1]}</span></div>`;
}
function bindEvidence(nodeId, node2) {
  document.querySelectorAll('.ev[data-doc]').forEach(el => el.onclick = async e => {
    e.preventDefault(); await ensureSegs();
    const box = el.closest('li').querySelector('.evbox'); if (box.innerHTML) { box.innerHTML = ''; return; }
    const doc = byId.get(el.dataset.doc);
    const hits = (segsByDoc.get(doc.id) || []).filter(s => s.m.some(m => m[0] === nodeId) && (!node2 || s.m.some(m => m[0] === node2))).slice(0, 12);
    box.innerHTML = hits.map(s => segHtml(doc, s, [byId.get(nodeId).name].concat(node2 ? [byId.get(node2).name] : []))).join('') || '<div class="empty">keine Segmente</div>';
  });
}
function docRow(d, e, explains, nodeId, node2, role) {
  const sp = speakers(d.id).map(x => x.p.name).join(', ');
  return `<li><a class="t" href="${href(d.id)}">${esc(d.name)}</a>${d.source === 'markdown' ? '<span class="badge page">Seite</span>' : ''}${explains && explains.has(d.id) ? '<span class="badge ex">erklärt</span>' : ''}${role ? `<span class="badge ${role === 'host' ? 'host' : ''}">${role === 'host' ? 'Host' : 'Gast'}</span>` : ''}<div class="m">${esc(sp || d.guest || (d.source === 'markdown' ? 'Kitchen-Seite' : 'Solo'))} · ${fmtD(d.published)}${e && e.share != null ? ' · ' + Math.round(e.share * 100) + ' % der Segmente' : ''}${nodeId ? ` · <a href="#" class="ev" data-doc="${esc(d.id)}">Stellen zeigen</a>` : ''}</div><div class="evbox"></div></li>`;
}
const crumbs = parts => `<div class="crumbs"><a href="#">Start</a>${parts.map(p => ' › ' + (p.href ? `<a href="${p.href}">${esc(p.name)}</a>` : esc(p.name))).join('')}</div>`;

function renderStart() {

  const newest = G.docs.filter(d => docActive(d) && d.source === 'youtube').sort((a, b) => (b.published || '').localeCompare(a.published || '')).slice(0, 12);

    <h2>Fragen zum Ausprobieren</h2><div class="chips">${examples.map(([t, a, b, p]) => `<a class="chip" href="${askHref(t, a, b, p)}">${esc(label(t, a, b, p))}</a>`).join('')}</div>
    <h2>Stärkste Themen<span class="sub">im gewählten Zeitraum</span></h2><div class="carousel">${top.map(([n]) => conceptCard(n, null, claimsOf(n.id)[0]?.name)).join('')}</div>

    <h2>Themenbereiche</h2><div class="grid">${G.nodes.filter(n => n.type === 'Bucket').map(b => `<a class="card" href="${href(b.id)}" style="border-top:3px solid ${BUCKET_COLOR[b.bucket]}"><div class="name">${esc(b.name)}</div><div class="w">${docCount(b.id)} Folgen</div></a>`).join('')}</div>`;

function derivedTopics(pid) {   // Themen einer Person über ihre Dokumente
  const acc = new Map();
  for (const x of neighbourDocs(pid)) for (const e of (G.out.get(x.doc.id) || [])) if (e.type === 'MENTIONS' && (e.share || 0) >= 0.08) { const c = byId.get(e.t); if (c && (c.type === 'Topic' || c.type === 'Tool')) acc.set(e.t, (acc.get(e.t) || 0) + 1); }
  return [...acc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map(([id, c]) => ({o: byId.get(id), w: c, docs: true}));
}
function renderConcept(n) {
  const docs = neighbourDocs(n.id), rel = n.type === 'Person' ? derivedTopics(n.id) : related(n.id, 12), claims = claimsOf(n.id);
  const explains = new Set((G.in.get(n.id) || []).filter(e => e.type === 'EXPLAINS').map(e => e.s));
  const typed = [...(G.out.get(n.id) || []), ...(G.in.get(n.id) || [])].filter(e => REL[e.type]);
  const persons = new Map(); for (const x of docs) for (const s of speakers(x.doc.id)) persons.set(s.p.id, (persons.get(s.p.id) || 0) + 1);
  const b = bucketOfConcept(n.id); const bucket = b && byId.get('bucket:' + b);
  const lead = claims.find(c => c.kind === 'fact')?.name || (docs.length ? `${TYPE_DE[n.type]} in ${docs.length} Dokumenten, am stärksten in „${docs[0].doc.name}".` : 'Keine Dokumente im gewählten Zeitraum.');
  const pages = docs.filter(x => x.doc.source === 'markdown'), eps = docs.filter(x => x.doc.source === 'youtube');
  let h = crumbs([bucket ? {name: bucket.name, href: href(bucket.id)} : {name: TYPE_DE[n.type]}, {name: n.name}]);

  h += `<div><a class="btn" href="${'graph.html#' + new URLSearchParams({n: n.id, f: n.id}).toString()}">⌖ Im Graph öffnen</a><a class="btn" href="${'#' + new URLSearchParams({ask: 'said', a: n.name}).toString()}">Was wurde dazu gesagt?</a><a class="btn" href="${'#' + new URLSearchParams({ask: 'who', a: n.name}).toString()}">Wer erklärt das?</a></div>`;

  if (typed.length) h += `<h2>Belegte Beziehungen</h2><ul class="list">${typed.map(e => { const a = byId.get(e.s), bb = byId.get(e.t), d = byId.get(e.doc_id); return `<li>${nodeA(a, 't')} <span class="badge">${REL[e.type]}</span> ${nodeA(bb, 't')}<div class="m">${esc(e.ev)}${d ? ' · <a href="' + href(d.id) + '">' + esc(d.name) + '</a>' : ''}</div></li>`; }).join('')}</ul>`;
  h += claimsSection(claims);

  if (pages.length) h += `<h2>Seiten der Kitchen dazu</h2><div class="grid">${pages.slice(0, 8).map(x => docCard(x.doc, x.e)).join('')}</div>`;
  if (persons.size) h += `<h2>Personen</h2><div class="chips">${[...persons.entries()].sort((a, b) => b[1] - a[1]).map(([pid, c]) => `<a class="chip" href="${href(pid)}">${esc(byId.get(pid).name)} <span class="cnt" style="opacity:.6">${c}</span></a>`).join('')}</div>`;
  h += sparkline(n.id);
  $('#page').innerHTML = h; bindClaims(claims); bindEvidence(n.id);
}

async function renderDoc(d) {
  const ments = (G.out.get(d.id) || []).filter(e => e.type === 'MENTIONS').map(e => ({n: byId.get(e.t), e})).filter(x => x.n).sort((a, b) => b.e.w - a.e.w);
  const explains = (G.out.get(d.id) || []).filter(e => e.type === 'EXPLAINS').map(e => ({n: byId.get(e.t), ev: e.ev})).filter(x => x.n);
  const persons = speakers(d.id);
  const claims = G.claims.filter(c => c.doc === d.id).sort((a, b) => (a.start_s || 0) - (b.start_s || 0));
  const bucket = d.bucket && byId.get('bucket:' + d.bucket);
  // verwandte Dokumente: gemeinsame starke Konzepte

  const relDocs = new Map();
  for (const [cid, sh] of mine) for (const e of (G.in.get(cid) || [])) if (e.type === 'MENTIONS' && e.s !== d.id && isDoc(byId.get(e.s)) && docActive(byId.get(e.s)) && (e.share || 0) >= 0.1) relDocs.set(e.s, (relDocs.get(e.s) || 0) + sh * e.share);
  const relSorted = [...relDocs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10).map(x => byId.get(x[0]));
  let h = crumbs([bucket ? {name: bucket.name, href: href(bucket.id)} : {name: d.source === 'markdown' ? 'Seiten' : 'Folgen'}, {name: d.name}]);
  h += `<div class="two"><div><h1 class="title" style="font-size:28px">${esc(d.name)}${d.source === 'markdown' ? '<small style="background:var(--n-page)">Seite</small>' : ''}</h1>`;
  h += `<div class="meta">${d.format ? esc(d.format) + ' · ' : ''}${fmtD(d.published)}${d.source === 'markdown' ? ' (Dateistand)' : ''}${d.duration_s ? ' · ' + Math.round(d.duration_s / 60) + ' min' : ''} · ${(d.lang || '').toUpperCase()}</div>`;
  h += `<p class="lead">${esc(d.summary || d.desc)}</p><div><a class="btn primary" target="_blank" rel="noopener" href="${esc(d.url)}">${d.source === 'markdown' ? '📄 Seite öffnen' : '▶ Auf YouTube'}</a><a class="btn" href="${'graph.html#' + new URLSearchParams({n: d.id}).toString()}">⌖ Im Graph</a></div>`;
  if (persons.length) h += `<h2>Gespräch</h2><div class="chips">${persons.map(x => `<a class="chip" href="${href(x.p.id)}">${esc(x.p.name)} <span style="opacity:.6">${x.role === 'host' ? 'Host' : 'Gast'}</span></a>`).join('')}</div>`;
  h += `</div><div>${thumb(d) ? `<a target="_blank" rel="noopener" href="${esc(d.url)}"><img src="${thumb(d).replace('mqdefault', 'hqdefault')}" alt="" style="width:100%;border-radius:12px;box-shadow:var(--shadow)"></a>` : ''}</div></div>`;
  h += `<h2>Themen in diesem Dokument</h2><div class="chips">${ments.slice(0, 20).map(x => `<a class="chip" href="${href(x.n.id)}" style="border-left:3px solid ${TYPE_COLOR[x.n.type]}">${esc(x.n.name)} <span style="opacity:.6">${x.e.segments}</span></a>`).join('')}</div>`;
  if (explains.length) h += `<h2>Erklärt<span class="sub">Kapitel oder Titel nennt das Thema</span></h2><ul class="list">${explains.map(x => `<li>${nodeA(x.n, 't')}<div class="m">${esc(x.ev)}</div></li>`).join('')}</ul>`;
  h += claimsSection(claims, 'Kernaussagen dieser Folge');
  h += `<h2>${d.source === 'markdown' ? 'Abschnitte' : 'Kapitel und Segmente'}<span class="sub">mit Themen je Abschnitt</span></h2><div id="doc-segs" class="empty">lädt …</div>`;
  if (relSorted.length) h += `<h2>Verwandte Dokumente<span class="sub">gemeinsame Themen</span></h2><div class="carousel">${relSorted.map(x => docCard(x)).join('')}</div>`;
  $('#page').innerHTML = h; bindClaims(claims);

  const ss = segsByDoc.get(d.id) || [];
  let last = null, out = '';
  for (const s of ss) {
    if (s.h && s.h !== last) {
      const tags = new Map(); for (const x of ss.filter(z => z.h === s.h)) for (const m of x.m) tags.set(m[0], (tags.get(m[0]) || 0) + m[1]);
      const topTags = [...tags.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([id]) => byId.get(id)).filter(Boolean);
      out += `<div style="margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"><b>${s.s != null ? `<a class="ts" target="_blank" rel="noopener" href="${deepLink(d, s.s)}" style="font-family:var(--mono);font-size:11px;margin-right:6px">▶ ${fmtT(s.s)}</a>` : ''}${esc(s.h)}</b>${topTags.map(n => `<a class="chip" href="${href(n.id)}" style="padding:1px 7px;font-size:11px">${esc(n.name)}</a>`).join('')}</div>`;

function renderBucket(b) {

  const concepts = [...acc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 16);
  let h = crumbs([{name: b.name}]);
  h += `<h1 class="title">${esc(b.name)}<small style="background:${BUCKET_COLOR[b.bucket]}">Themenbereich</small></h1><p class="lead">${docs.length} Folgen im gewählten Zeitraum.</p>`;
  h += `<h2>Themen in diesem Bereich</h2><div class="carousel">${concepts.map(([cid, c]) => conceptCard(byId.get(cid), null, claimsOf(cid)[0]?.name)).join('')}</div>`;
  h += `<h2>Folgen<span class="sub">neueste zuerst</span></h2><div class="grid">${docs.map(x => docCard(x.doc)).join('')}</div>`;
  $('#page').innerHTML = h;
}

function renderPersonExtras(n) { return ''; }

// ---------- Fragen ----------
const byName = name => G.concepts.find(x => x.name.toLowerCase() === name.toLowerCase()) || G.concepts.find(x => x.name.toLowerCase().startsWith(name.toLowerCase()));
const gqlTime = () => timeRange === 'all' ? '' : `\n<span class="k">FILTER</span> d.published >= '${timeRange === 'm3' ? 'heute-3M' : timeRange === 'm12' ? 'heute-12M' : timeRange === '2024' ? '…' : timeRange + '-01-01'}'`;
async function renderAsk(tpl, a, b, p) {
  const A = byName(a); if (!A) { $('#page').innerHTML = crumbs([{name: 'Frage'}]) + `<p class="empty">„${esc(a)}" ist kein bekannter Knoten.</p>`; return; }
  await ensureSegs();
  const explains = new Set((G.in.get(A.id) || []).filter(e => e.type === 'EXPLAINS').map(e => e.s));
  let title = '', gql = '', body = '', node2 = null;
  if (tpl === 'who') {
    const docs = neighbourDocs(A.id).filter(x => explains.has(x.doc.id)); const byP = new Map();
    for (const x of docs) for (const s of speakers(x.doc.id)) (byP.get(s.p.id) || byP.set(s.p.id, []).get(s.p.id)).push(x);
    title = `Wer erklärt ${A.name}?`;
    gql = `<span class="k">MATCH</span> (p:Person)-[:SPEAKS_IN]->(d:Document)-[:EXPLAINS]->(t {name: '${A.name}'})${gqlTime()}\n<span class="k">RETURN</span> p.name, count(d) <span class="k">AS</span> folgen <span class="k">ORDER BY</span> folgen <span class="k">DESC</span>`;
    body = [...byP.entries()].sort((x, y) => y[1].length - x[1].length).map(([pid, xs]) => `<h2>${nodeA(byId.get(pid), 't')}<span class="sub">${xs.length} Folgen mit Kapitel dazu</span></h2><ul class="list">${xs.map(x => docRow(x.doc, x.e, explains, A.id)).join('')}</ul>`).join('') || '<p class="empty">Niemand mit einem Kapitel dazu im Zeitraum.</p>';
  } else if (tpl === 'said') {
    const docs = neighbourDocs(A.id), claims = claimsOf(A.id);
    title = `Was wurde zu ${A.name} gesagt?`;
    gql = `<span class="k">MATCH</span> (d:Document)-[m:MENTIONS]->(t {name: '${A.name}'})${gqlTime()}\n<span class="k">OPTIONAL MATCH</span> (c:Claim)-[:ABOUT]->(t)\n<span class="k">RETURN</span> d.title, d.published, m.segments, c.text <span class="k">ORDER BY</span> d.published <span class="k">DESC</span>`;
    body = claimsSection(claims) + `<h2>Dokumente<span class="sub">${docs.length}</span></h2><ul class="list">${docs.slice(0, 40).map(x => docRow(x.doc, x.e, explains, A.id)).join('') || '<li class="empty">keine</li>'}</ul>`;
    setTimeout(() => bindClaims(claims), 0);
  } else if (tpl === 'both') {
    const B = byName(b); if (!B) { $('#page').innerHTML = crumbs([{name: 'Frage'}]) + '<p class="empty">Zweites Thema fehlt oder unbekannt.</p>'; return; }
    node2 = B.id;
    const inB = new Set(neighbourDocs(B.id).map(x => x.doc.id));
    const joint = neighbourDocs(A.id).filter(x => inB.has(x.doc.id)).map(x => ({x, n: (segsByDoc.get(x.doc.id) || []).filter(s => s.m.some(m => m[0] === A.id) && s.m.some(m => m[0] === B.id)).length})).filter(y => y.n > 0).sort((y, z) => z.n - y.n);
    title = `Was verbindet ${A.name} und ${B.name}?`;
    gql = `<span class="k">MATCH</span> (a {name: '${A.name}'})<-[:MENTIONS]-(s:Segment)-[:MENTIONS]->(b {name: '${B.name}'}),\n      (d:Document)-[:HAS_SEGMENT]->(s)${gqlTime()}\n<span class="k">RETURN</span> d.title, count(s) <span class="k">AS</span> segmente <span class="k">ORDER BY</span> segmente <span class="k">DESC</span>`;
    body = `<ul class="list">${joint.map(y => docRow(y.x.doc, {share: y.x.e.share, segments: y.n}, explains, A.id).replace('% der Segmente', '% · ' + y.n + ' gemeinsame Segmente')).join('') || '<li class="empty">kein gemeinsames Segment im Zeitraum</li>'}</ul>`;
  } else if (tpl === 'person') {
    const P = byName(p); if (!P || P.type !== 'Person') { $('#page').innerHTML = crumbs([{name: 'Frage'}]) + '<p class="empty">Person fehlt oder unbekannt.</p>'; return; }
    const spoken = new Set(neighbourDocs(P.id).map(x => x.doc.id));
    const docs = neighbourDocs(A.id).filter(x => spoken.has(x.doc.id));
    title = `Was sagt ${P.name} zu ${A.name}?`;
    gql = `<span class="k">MATCH</span> (p:Person {name: '${P.name}'})-[:SPEAKS_IN]->(d:Document)-[m:MENTIONS]->(t {name: '${A.name}'})${gqlTime()}\n<span class="k">RETURN</span> d.title, d.published, m.segments <span class="k">ORDER BY</span> d.published <span class="k">DESC</span>`;
    body = `<p class="lead">Dokumente, in denen ${esc(P.name)} dabei ist und ${esc(A.name)} vorkommt. Wer genau spricht, weiß das Transkript nicht.</p><ul class="list">${docs.map(x => docRow(x.doc, x.e, explains, A.id)).join('') || '<li class="empty">nichts im Zeitraum</li>'}</ul>`;
  } else {
    const docs = neighbourDocs(A.id).sort((x, y) => (y.doc.published || '').localeCompare(x.doc.published || '')).slice(0, 15);
    title = `Neuestes zu ${A.name}`;
    gql = `<span class="k">MATCH</span> (d:Document)-[m:MENTIONS]->(t {name: '${A.name}'})${gqlTime()}\n<span class="k">RETURN</span> d.title, d.published <span class="k">ORDER BY</span> d.published <span class="k">DESC LIMIT</span> 15`;
    body = `<div class="carousel">${docs.map(x => docCard(x.doc, x.e)).join('')}</div>`;
  }
  $('#page').innerHTML = crumbs([{name: 'Frage'}]) + `<h1 class="title" style="font-size:26px">${esc(title)}</h1><div class="gql">${gql}</div><div class="meta">So sähe die Frage als GQL gegen Graph in Fabric aus. Hier beantwortet sie der Browser aus graph.json. Diese Adresse ist der Link zur Antwort.</div>` + body;
  bindEvidence(A.id, node2);
}

// ---------- Suche ----------
const qEl = $('#q'), sug = $('#suggest');
qEl.addEventListener('input', () => {
  const v = qEl.value.trim().toLowerCase(); if (v.length < 2) { sug.style.display = 'none'; return; }
  const hits = [];
  for (const n of G.concepts) if (n.name.toLowerCase().includes(v)) hits.push({n, k: TYPE_DE[n.type]});
  for (const d of G.docs) if (d.name.toLowerCase().includes(v) && docActive(d)) hits.push({n: d, k: d.source === 'markdown' ? 'Seite' : (d.format || 'Folge')});
  hits.sort((a, b) => (a.n.name.toLowerCase().startsWith(v) ? 0 : 1) - (b.n.name.toLowerCase().startsWith(v) ? 0 : 1));
  sug.innerHTML = hits.slice(0, 10).map(h => `<a href="${href(h.n.id)}">${esc(h.n.name)}<span class="k">${h.k}</span></a>`).join('') + `<a href="#q=${encodeURIComponent(qEl.value.trim())}">Volltext: „${esc(qEl.value.trim())}"<span class="k">Enter</span></a>`;
  sug.style.display = 'block';
});
qEl.addEventListener('keydown', e => { if (e.key === 'Enter') { location.hash = 'q=' + encodeURIComponent(qEl.value.trim()); sug.style.display = 'none'; } if (e.key === 'Escape') sug.style.display = 'none'; });
document.addEventListener('click', e => { if (!e.target.closest('.searchbox')) sug.style.display = 'none'; });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); } });
async function renderSearch(q) {
  await ensureSegs();
  const terms = q.toLowerCase().split(/\s+/).filter(t => t.length > 1);
  const hits = segs.filter(s => { const d = byId.get(s.d); if (!d || !docActive(d)) return false; const lt = s.t.toLowerCase(); return terms.every(t => lt.includes(t)); });
  const byDoc = new Map(); for (const s of hits) (byDoc.get(s.d) || byDoc.set(s.d, []).get(s.d)).push(s);
  const docsSorted = [...byDoc.entries()].sort((a, b) => b[1].length - a[1].length);
  const cnt = new Map(); for (const s of hits) for (const m of s.m) cnt.set(m[0], (cnt.get(m[0]) || 0) + 1);
  const topC = [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, c]) => [byId.get(id), c]).filter(x => x[0]);
  let h = crumbs([{name: 'Suche'}]) + `<h1 class="title" style="font-size:26px">„${esc(q)}"</h1><div class="meta">${hits.length} Segmente in ${byDoc.size} Dokumenten · Zeitraum ${timeRange === 'all' ? 'alle' : timeRange}</div>`;
  if (topC.length) h += `<div class="chips" style="margin:10px 0">${topC.map(([n, c]) => `<a class="chip" href="${href(n.id)}">${esc(n.name)} <span style="opacity:.6">${c}</span></a>`).join('')}</div>`;
  for (const [docId, ss] of docsSorted.slice(0, 30)) { const d = byId.get(docId); h += `<h2 style="font-size:16px"><a href="${href(docId)}">${esc(d.name)}</a><span class="sub">${ss.length} · ${fmtD(d.published)}</span></h2>${ss.slice(0, 3).map(s => segHtml(d, s, terms)).join('')}`; }
  $('#page').innerHTML = h;
}
</script>
