[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fabscan"
version = "0.2.0"
description = "Governance-Prüfung für Microsoft Fabric Apps und den Fabric-Tenant: Berechnungen in der App, Lineage, Sicherheit, veränderte Abfragen, Abweichungen zum Semantikmodell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Tenner · Daten-WG" }]
keywords = ["fabric", "power bi", "governance", "dax", "rayfin", "fabric apps"]

[project.scripts]
fabscan = "fabscan.cli:main"

[project.urls]
Homepage = "https://datenwgknowledgekitchen.com"
Source = "https://github.com/Losveratos/PowerBI-Kitchen-/tree/main/fabric-app-scanner"

[tool.setuptools]
packages = ["fabscan"]

[tool.setuptools.package-data]
fabscan = ["skilldata/*.md"]
